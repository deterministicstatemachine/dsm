[book]
title = "Plug your app into DSM"
description = "The developer walkthrough: give your app its own DSM account, connect wallets to it, and ask them for things."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["theme/dsm.css"]
smart-punctuation = false
git-repository-url = "https://github.com/deterministicstatemachine/dsm/tree/main/guide"
edit-url-template = "https://github.com/deterministicstatemachine/dsm/edit/main/guide/{path}"
site-url = "/dsm/"

[output.html.search]
enable = true

[output.html.print]
enable = true
