# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "dsm-android-anchor"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "On-device glue for the DSM Software-Authority / Hardware-Identity anchor: installs the sender USB anchor appliance (UsbAnchorAppliance over the opaque Kotlin picoUsbTransceive) into the dsm_sdk bridge seam, plus gated device-setup ops (counter birth, slot-0 birth cage) and read-only chip diagnostics. Depends on dsm_sdk + dsm-anchor-hw-verifier in ONE direction (no dependency cycle); transitively pulls tropic01, so it is EXCLUDED from the workspace and built only in the Android cargo-ndk pipeline — the default CI workspace stays tropic01-free."

[lib]
# rlib for host tests; staticlib/cdylib so the Android build can link the on-device JNI shell (H3).
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
# OFF by default. Compiles the ACCEPT-PRODUCING sender appliance-factory install (install.rs) and
# the device-setup WRITES (counter birth, slot-0 birth cage) + their JNI triggers. A default build
# cannot produce offline-bearer releases or touch hardware state — none of it even compiles in.
# The device layer enables this for the 2-phone bench test; the production flip is the owner's call.
on_device_installs = []

[dependencies]
# The SDK whose bridge install seams we fill. One-directional: dsm_sdk never depends back on us.
dsm_sdk = { path = "../../dsm_client/deterministic_state_machine/dsm_sdk" }
# The real libtropic-backed device-setup ops (counter birth, slot-0 birth cage, counter read).
# This is the crate that pulls tropic01.
dsm-anchor-hw-verifier = { path = "../dsm-anchor-hw-verifier" }
# The tropic01-free SPI spine — SpiRelayChannel/RelayError for the local setup channel.
dsm-anchor-verifier = { path = "../dsm-anchor-verifier" }
# The OP_SPI_PASSTHROUGH ApplianceRequest/Response codec (tropic01-free) — the Phone->Pico USB
# bridge frames requests / decodes responses in Rust so Kotlin stays an opaque byte transport.
dsm-anchor-core = { path = "../dsm-anchor-core" }
# DsmError (the fail-closed error type at every op boundary).
dsm = { path = "../../dsm_client/deterministic_state_machine/dsm" }
log = "0.4"

# On Android, the USB bridge does a JNI up-call to Kotlin's opaque picoUsbTransceive (mirrors
# queue_follow_up_chunks' with_env pattern), so it needs dsm_sdk's `jni` feature + the jni crate.
# Host builds/tests don't compile this path (it's target_os="android"). Match the app's on-device
# feature set: jni (with_env up-call) + bluetooth (the BLE code paths).
[target.'cfg(target_os = "android")'.dependencies]
dsm_sdk = { path = "../../dsm_client/deterministic_state_machine/dsm_sdk", features = ["jni", "bluetooth"] }
jni = "0.21"

# This crate is workspace-EXCLUDED, so it is its own profile root: mirror the deterministic_state_machine
# workspace release profile — LTO must stay off and symbols unstripped to preserve the JNI exports when
# this cdylib ships as the app's libdsm_sdk.so (H3 packaging).
[profile.release]
opt-level = 3
lto = false
codegen-units = 1
strip = false
