# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "dsm-android-anchor"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "On-device glue that installs the DSM Boot Fenced Fused Anchor hardware impls (RelayCounterReader / SeedPairingDeriver / SeSlotWriter / LocalPicoTransport) into the dsm_sdk bridge seams. Depends on dsm_sdk + dsm-anchor-hw-verifier in ONE direction (no dependency cycle); transitively pulls tropic01, so it is EXCLUDED from the workspace and built only in the Android cargo-ndk pipeline — the default CI workspace stays tropic01-free."

[lib]
# rlib for host tests; staticlib/cdylib so the Android build can link the on-device JNI shell (H3).
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# The SDK whose bridge install seams we fill. One-directional: dsm_sdk never depends back on us.
dsm_sdk = { path = "../../dsm_client/deterministic_state_machine/dsm_sdk" }
# The real libtropic-backed anchor impls (Phase F/G): RelayCounterReader, SeedPairingDeriver,
# the verifier session, and (H2) the slot-write logic. This is the crate that pulls tropic01.
dsm-anchor-hw-verifier = { path = "../dsm-anchor-hw-verifier" }
# The tropic01-free relay spine — for `RelayError` in the injected round-trip type.
dsm-anchor-verifier = { path = "../dsm-anchor-verifier" }
# The OP_SPI_PASSTHROUGH ApplianceRequest/Response codec (tropic01-free) — the Phone->Pico USB
# bridge frames requests / decodes responses in Rust so Kotlin stays an opaque byte transport.
dsm-anchor-core = { path = "../dsm-anchor-core" }
# FusedAnchorPin (the reader's pin type) for the on-device self-test.
dsm = { path = "../../dsm_client/deterministic_state_machine/dsm" }
log = "0.4"
# The self-test drives the reader's relay bridge (spawn_blocking) + the router's bounded round-trip
# (timers); versions unify with dsm_sdk's own tokio.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

# On Android, the USB bridge's LocalPicoTransport does a JNI up-call to Kotlin's opaque
# picoUsbTransceive (mirrors queue_follow_up_chunks' with_env pattern), so it needs dsm_sdk's `jni`
# feature + the jni crate. Host builds/tests don't compile this path (it's target_os="android").
# Match the app's on-device feature set: jni (with_env up-call) + bluetooth (the tropic_relay/BLE
# code paths). Enabling jni WITHOUT bluetooth surfaces dsm_sdk's own conditional warnings-as-errors.
[target.'cfg(target_os = "android")'.dependencies]
dsm_sdk = { path = "../../dsm_client/deterministic_state_machine/dsm_sdk", features = ["jni", "bluetooth"] }
jni = "0.21"

[dev-dependencies]
# Poll the boxed PicoFuture in host tests without a full async runtime.
futures = { version = "0.3", default-features = false, features = ["executor"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

# This crate is workspace-EXCLUDED, so it is its own profile root: mirror the deterministic_state_machine
# workspace release profile — LTO must stay off and symbols unstripped to preserve the JNI exports when
# this cdylib ships as the app's libdsm_sdk.so (H3 packaging).
[profile.release]
opt-level = 3
lto = false
codegen-units = 1
strip = false
