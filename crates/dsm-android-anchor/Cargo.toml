# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "dsm-android-anchor"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "On-device glue for the DSM Software-Authority / Hardware-Identity anchor: installs the sender USB anchor appliance (UsbAnchorAppliance over the opaque Kotlin picoUsbTransceive) into the dsm_sdk bridge seam. The appliance provisions itself over OP_PROVISION; no raw SPI reaches the chip from the phone. Depends on dsm_sdk in ONE direction (no dependency cycle); built in the Android cargo-ndk pipeline."

# Its own workspace root. The repository workspace excludes this crate, and cargo keeps
# climbing past an excluding root: from a checkout nested under another checkout (a git
# worktree under `.claude/worktrees/`) it reaches the outer repository's manifest, which
# neither lists nor excludes this path, and refuses to build. Declaring the root here stops
# the climb wherever the checkout sits.
[workspace]

[lib]
# rlib for host tests; staticlib/cdylib so the Android build can link the on-device JNI shell (H3).
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
# OFF by default. Compiles the ACCEPT-PRODUCING sender appliance-factory install (install.rs) and
# its JNI trigger. A default build cannot produce offline-bearer releases.
on_device_installs = []

[dependencies]
# The firmware's own measurement of the Non-secure app (the monitor's `measurement_ok`), checked
# against a release's digest before the phone burns it.
blake3 = { version = "1.5.0" }
# The SDK whose bridge install seams we fill. One-directional: dsm_sdk never depends back on us.
dsm_sdk = { path = "../../dsm_client/deterministic_state_machine/dsm_sdk" }
# The ApplianceRequest/Response codec — the Phone->Pico USB bridge frames requests and decodes
# responses in Rust so Kotlin stays an opaque byte transport.
dsm-anchor-core = { path = "../dsm-anchor-core" }
# DsmError (the fail-closed error type at every op boundary).
dsm = { path = "../../dsm_client/deterministic_state_machine/dsm" }
log = "0.4"

# On Android, the USB bridge does a JNI up-call to Kotlin's opaque picoUsbTransceive (mirrors
# queue_follow_up_chunks' with_env pattern), so it needs dsm_sdk's `jni` feature + the jni crate.
# Host builds/tests don't compile this path (it's target_os="android"). Match the app's on-device
# feature set: jni (with_env up-call) + bluetooth (the BLE code paths).
[target.'cfg(target_os = "android")'.dependencies]
dsm_sdk = { path = "../../dsm_client/deterministic_state_machine/dsm_sdk", features = ["jni", "bluetooth"] }
jni = "0.21"
# The phone's random source, for a blank board's secret (the board setup's Android port).
getrandom = "0.4.2"
# `USBDEVFS_CLEAR_HALT` on the board link's usbfs descriptor, as libusb clears a halt.
libc = "0.2"

# This crate is workspace-EXCLUDED, so it is its own profile root: mirror the deterministic_state_machine
# workspace release profile — LTO must stay off and symbols unstripped to preserve the JNI exports when
# this cdylib ships as the app's libdsm_sdk.so (H3 packaging).
[profile.release]
opt-level = 3
# Integer overflow stays a panic in the shipped profile (the root workspace sets the same).
overflow-checks = true
lto = false
codegen-units = 1
strip = false
