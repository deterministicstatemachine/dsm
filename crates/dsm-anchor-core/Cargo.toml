[package]
name = "dsm-anchor-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Hardware-free core of the DSM Software-Authority / Hardware-Identity offline anchor: DSM device-SMT root-advance construction, the three-signature release (sigma^DSM seed / sigma^chip resident TROPIC01 Ed25519 / sigma^host RP2350 partition) over one root-advance message, the compact 3-state appliance (prepare/commit/emit/finalize), the software-only receiver acceptance predicate, power-loss recovery, and the protobuf wire protocol."

[lib]
name = "anchor_core"

# BLAKE3: H = BLAKE3-256 and the domain-separated KDF (derive_key mode).
# prost (no_std + alloc): the on-device appliance wire protocol, generated from
# the shared ../proto/dsm_anchor.proto — same tooling/schema family as the DSM
# backend (prost 0.14, proto/dsm_app.proto). Builds for the RP2350 firmware and
# unit-tests on the host with `cargo test -p dsm-anchor-core`.
[dependencies]
blake3 = { version = "1", default-features = false }
prost = { version = "0.14", default-features = false, features = ["derive"] }

# The durable-record tests run the appliance with real keys: the chip's resident Ed25519 key and
# the BLAKE3-SPHINCS+ partition scheme receivers verify sigma^host with.
[dev-dependencies]
dsm-sphincs = { path = "../dsm-sphincs" }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
