# The Secure monitor is TrustZone-M code for the RP2350's Cortex-M33: Arm only. A build names its
# image: `cargo build --release --features production`, or `bench_self_enroll` for the trial image.
# build.rs needs clang, arm-none-eabi-ar and arm-none-eabi-objcopy (the veneer and the NS image).

[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
rustflags = [
  "-C", "link-arg=--nmagic",
  # Custom SRAM-resident Secure linker (replaces cortex-m-rt's link.x, which forces .text into
  # FLASH). Places the whole Secure TCB at an SRAM VMA with a FLASH LMA so the bootrom copies the
  # verified image into SRAM before entry — flash is mutable after boot-time verification.
  "-C", "link-arg=-Tdsm-secure-sram.x",
  "-C", "target-cpu=cortex-m33",
]

[target.riscv32imac-unknown-none-elf]
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
]

[env]
DEFMT_LOG = "off"
