# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "dsm-anchor-bench"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Host-side bench tool for the RP2350/TROPIC01 DSM anchor appliance over USB-CDC: the read-only check, the try-run, the identify image's reading, the owner's board stamp (read the identity, keep the stamp), and the used-chip phases (Phase 1 read-only, Phase 2 prepare/cancel, no COMMIT) on a board running the trial image (bench_self_enroll). RELEASE-only. Excluded from the workspace (native serial dep)."

# Excluded from the root workspace (native serialport dep + hardware-facing bench tool). Build from
# inside this dir: `cargo build --release && ./target/release/used-chip-bench --port <serial>`.

[[bin]]
name = "used-chip-bench"
path = "src/main.rs"

[dependencies]
# The appliance wire protocol (ApplianceRequest/Response, Op, TransitionPackage, encode/decode).
# Package `dsm-anchor-core`, imported as the lib `anchor_core`.
dsm-anchor-core = { path = "../dsm-anchor-core" }
# The owner's scheme (BLAKE3-SPHINCS+ SPX256f): the bench's own owner and rehearsal keys, which
# authorize its prepares and its try-runs on a trial board.
dsm-sphincs = { path = "../dsm-sphincs" }
# Host USB-CDC serial transport to the Pico.
serialport = "4"

# Its own workspace: excluded from the root manifest.
[workspace]
