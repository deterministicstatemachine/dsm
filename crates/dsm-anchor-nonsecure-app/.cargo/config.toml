# RP2350 has dual Cortex-M33 (ARM) and dual Hazard3 (RISC-V). T1 defaults to
# ARM (the most-trodden rp235x-hal path); RISC-V is a one-flag swap.
#   cargo build --release
#   cargo build --release --target riscv32imac-unknown-none-elf
# Pure Rust — no C toolchain / newlib / pico-sdk needed.

[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
rustflags = [
  "-C", "link-arg=--nmagic",
  # The Non-secure image runs in place from its flash region (0x10100000) with its writable memory
  # in NS SRAM. Replaces cortex-m-rt's link.x: this app is embedded in the monitor image, has no
  # boot block, and fills the measured window exactly (dsm-ns-flash.x).
  "-C", "link-arg=-Tdsm-ns-flash.x",
  "-C", "target-cpu=cortex-m33",
]

[target.riscv32imac-unknown-none-elf]
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
]

[env]
DEFMT_LOG = "off"
