# Spike: the economic SMT authentication path (`root_from_path`, 256 levels of
# `econ_node` under BLAKE3) as a Plonky3 AIR, to measure what one leaf's path
# costs to prove on the sender's own device. This is the dominant cost of a
# validity proof for one economic root advance; the rest of
# `advance_validated` (conservation arithmetic, write-set closure) is small by
# comparison.
#
# Plonky3 is taken from git at a pinned commit: the published 0.8.0 `p3-blake3-air`
# generates traces with the row index as the counter and no flags, which is not
# BLAKE3; `generate_trace_rows_with_inputs` (explicit counter, length, flags)
# landed after the release.
#
# Own workspace root: do not attach to the parent DSM workspace.
[package]
name = "dsm_econ_path_air"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Plonky3 AIR for the DSM economic SMT path under BLAKE3 (prover-cost spike)"

[workspace]

[dependencies]
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-blake3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-koala-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-poseidon2 = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-util = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c" }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3", rev = "a4982ec0f2842a0bf3a35ab2f961ddeb2e6d418c", features = ["parallel"] }
blake3 = { version = "1.8", default-features = false }
rand = { version = "0.10", default-features = false }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
