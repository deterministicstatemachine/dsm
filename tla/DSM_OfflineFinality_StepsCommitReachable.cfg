\* ===========================================================================
\* DSM Offline Finality — non-vacuity: StepsCommit is reachable
\*
\* Both steps commit on both devices: the protocol completes, each way.
\*
\* The gate passes only if TLC reports NeverCommittedOnBoth violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    StepsPerDevice = 1
    INITIAL_BALANCE = 1
    FramesAfterDurable = TRUE
    CancelOnlyBeforeConfirm = TRUE
    LinkLossFailsNothing = TRUE
    ReceiverRefusesWhileInFlight = TRUE

INVARIANT
    NeverCommittedOnBoth

CHECK_DEADLOCK FALSE
