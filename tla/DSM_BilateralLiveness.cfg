\* ===========================================================================
\* DSM Bilateral Liveness — TLC Model Checker Configuration
\*
\* Two devices: the relationship is the whole system. One offline session
\* slot; each device begins one step (an online send or an offline
\* proposal), so the two can cross. Safety invariants in every state;
\* liveness under the spec's fairness.
\*
\* Run: cd tla && java -cp tla2tools.jar tlc2.TLC -config DSM_BilateralLiveness.cfg DSM_BilateralLiveness.tla
\* ===========================================================================

SPECIFICATION Spec

CONSTANT
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    s1 = s1
    SessionId = {s1}
    INITIAL_BALANCE = 1
    StepsPerDevice = 1
    NULL = NULL
    JoinCrossingSteps = TRUE

INVARIANT
    TypeOK
    NoFork
    TokenConservation
    ProjectionAgreement
    BarrierHeldDurably
    BalancesNonNegative

PROPERTY
    SessionTermination
    OnlineSendSettles
    RelationshipReturnsToRest

CHECK_DEADLOCK FALSE
