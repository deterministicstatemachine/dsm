\* ===========================================================================
\* DSM Offline Finality — falsification: LinkLossFailsNothing = FALSE
\*
\* Losing the link fails every step in flight, as the removed disconnect
\* handler did. The receiver commits and its ack is lost with the link; the
\* proposer's step fails.
\*
\* The gate passes only if TLC reports NoHalfCommit violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    StepsPerDevice = 1
    INITIAL_BALANCE = 1
    FramesAfterDurable = TRUE
    CancelOnlyBeforeConfirm = TRUE
    LinkLossFailsNothing = FALSE
    ReceiverRefusesWhileInFlight = TRUE

INVARIANT
    NoHalfCommit

CHECK_DEADLOCK FALSE
