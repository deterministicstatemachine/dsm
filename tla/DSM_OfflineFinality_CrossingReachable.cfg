\* ===========================================================================
\* DSM Offline Finality — non-vacuity: Crossing is reachable
\*
\* Both devices' proposals are in flight at once: they cross. NoFork in
\* the model config is checked over these states.
\*
\* The gate passes only if TLC reports NeverCrossed violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    StepsPerDevice = 1
    INITIAL_BALANCE = 1
    FramesAfterDurable = TRUE
    CancelOnlyBeforeConfirm = TRUE
    LinkLossFailsNothing = TRUE
    ReceiverRefusesWhileInFlight = TRUE

INVARIANT
    NeverCrossed

CHECK_DEADLOCK FALSE
