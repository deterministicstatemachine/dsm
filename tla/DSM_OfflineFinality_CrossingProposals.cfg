\* ===========================================================================
\* DSM Offline Finality — falsification: ReceiverRefusesWhileInFlight = FALSE
\*
\* A device with a step in flight still takes the peer's proposal. Two
\* proposals that cross are each accepted and each committed by its
\* receiver: two successors of one tip.
\*
\* The gate passes only if TLC reports NoFork violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    StepsPerDevice = 1
    INITIAL_BALANCE = 1
    FramesAfterDurable = TRUE
    CancelOnlyBeforeConfirm = TRUE
    LinkLossFailsNothing = TRUE
    ReceiverRefusesWhileInFlight = FALSE

INVARIANT
    NoFork

CHECK_DEADLOCK FALSE
