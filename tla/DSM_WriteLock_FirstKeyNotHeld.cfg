\* ===========================================================================
\* DSM_WriteLock — falsification: CheckFixed = FALSE
\*
\* A node takes a write at a first inbox under any key: a second writer's
\* key lands beside the one the first write fixed.
\*
\* The gate passes only if TLC reports FirstInboxOneKey violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    Nodes = {"n1", "n2"}
    Routes = {"r1"}
    Keys = {"L", "K", "X"}
    HonestLocks = {"L"}
    AttackerKeys = {"X"}
    WriterKeys = {"K", "X"}
    Granted <- MCGranted
    CheckLock = TRUE
    CheckFixed = FALSE

INVARIANT
    FirstInboxOneKey
