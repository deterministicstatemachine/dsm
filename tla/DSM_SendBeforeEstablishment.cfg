\* ===========================================================================
\* DSM — falsification: SendChecksEstablished = FALSE
\*
\* A device sends on a relationship both sides opened but neither
\* established: value leaves on a relationship whose first step, the
\* establishment both sides sign, was never made (DSM Amendment A33).
\*
\* The gate passes only if TLC reports NoValueBeforeEstablishment violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANT
    DeviceIds = {d1, d2}
    GenesisIds = {g1}
    MaxDevices = 2
    MaxPayload = 1
    VaultIds = {v1}
    MaxVaults = 1
    ShardDepth = 1
    MaxEmissions = 1
    EmissionAmount = 1
    MaxSupply = 1
    MaxNet = 2
    MaxDupPerMsg = 0
    MaxStep = 5
    UseHarness = FALSE
    RecipientChecksAdmission = TRUE
    RecipientChecksPin = TRUE
    SendChecksEstablished = FALSE

INVARIANT
    NoValueBeforeEstablishment

CONSTRAINT
    StepBound
