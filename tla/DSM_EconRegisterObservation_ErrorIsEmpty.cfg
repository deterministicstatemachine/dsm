SPECIFICATION Spec
INVARIANT
    TypeOK
    EmptinessIsGrounded
    EmptyAtQuorumIsWitnessed
    NoEmptyAtQuorumAfterClaimed
    TwoAtQuorumIsConflict
    VerdictMatchesObservation
CONSTRAINT StateConstraint
CONSTANTS
    Member = {m1, m2, m3}
    Cell = {k1}
