\* ===========================================================================
\* DSM Offline Finality — the model of the code, a step that moves no value
\*
\* Its proposer commits on the ack (finalize_sender_step), not when it
\* confirms. Every other switch as in DSM_OfflineFinality.cfg.
\*
\* Two devices, two steps each way: proposals that cross, steps in sequence,
\* a link that drops at any point, frames delivered again, cancellation and
\* rejection. Every implementation switch is set to what the code does for an
\* offline-bearer step: its proposer commits when its anchor commits.
\*
\* Run: cd tla && java -cp tla2tools.jar tlc2.TLC -workers auto \
\*        -config DSM_OfflineFinality_CommitOnAck.cfg DSM_OfflineFinality.tla
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    StepsPerDevice = 1
    INITIAL_BALANCE = 1
    FramesAfterDurable = TRUE
    CancelOnlyBeforeConfirm = TRUE
    LinkLossFailsNothing = TRUE
    ReceiverRefusesWhileInFlight = TRUE
    SenderCommitsAtRelease = FALSE
    ConfirmOwedWithCommit = TRUE

INVARIANT
    TypeOK
    NoFork
    NoHalfCommit
    TripwireGuaranteesUniqueness
    CommitsExtendTheirParent
    OneStepInFlight
    TokenConservation
    BalancesNonNegative
    ConfirmFollowsDurableConfirm
    AckFollowsDurableCommit

PROPERTY
    ChainsOnlyGrow
    SessionTermination

CHECK_DEADLOCK FALSE
