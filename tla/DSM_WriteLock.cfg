\* ===========================================================================
\* DSM_WriteLock — DSM Amendments A34 and A37's write check, every invariant
\* holding.
\*
\* Two nodes, one route, an honest lock L that granted key K, a writer's
\* first-inbox lock F that grants only itself, and an attacker's key X;
\* writes reach the nodes in any order, each node may miss any of them.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    Nodes = {"n1", "n2"}
    Routes = {"r1"}
    Keys = {"L", "K", "F", "X"}
    HonestLocks = {"L", "F"}
    FirstLocks = {"F"}
    AttackerKeys = {"X"}
    WriterKeys = {"K", "F", "X"}
    Granted <- MCGranted
    CheckLock = TRUE

INVARIANT
    TypeOK
    LockedHoldsOnlyGranted
    FirstInboxOnlyItsWriter
    FirstInboxNeverClosed
