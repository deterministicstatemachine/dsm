\* ===========================================================================
\* DSM_WriteLock — DSM Amendment A34's write check, every invariant holding.
\*
\* Two nodes, one route, an honest lock L that granted key K, and an
\* attacker's key X; writes reach the nodes in any order, each node may miss
\* any of them.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    Nodes = {"n1", "n2"}
    Routes = {"r1"}
    Keys = {"L", "K", "X"}
    HonestLocks = {"L"}
    AttackerKeys = {"X"}
    WriterKeys = {"K", "X"}
    Granted <- MCGranted
    CheckLock = TRUE
    CheckFixed = TRUE

INVARIANT
    TypeOK
    LockedHoldsOnlyGranted
    FirstInboxOneKey
    NodesAgreeAtLocked

PROPERTY
    FixedKeyNeverMoves
