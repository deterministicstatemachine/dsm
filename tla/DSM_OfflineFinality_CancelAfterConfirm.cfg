\* ===========================================================================
\* DSM Offline Finality — falsification: CancelOnlyBeforeConfirm = FALSE
\*
\* A proposer may cancel after its confirm. The receiver commits on the
\* confirm; the proposer has ended the step.
\*
\* The gate passes only if TLC reports NoHalfCommit violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    StepsPerDevice = 1
    INITIAL_BALANCE = 1
    FramesAfterDurable = TRUE
    CancelOnlyBeforeConfirm = FALSE
    LinkLossFailsNothing = TRUE
    ReceiverRefusesWhileInFlight = TRUE

INVARIANT
    NoHalfCommit

CHECK_DEADLOCK FALSE
