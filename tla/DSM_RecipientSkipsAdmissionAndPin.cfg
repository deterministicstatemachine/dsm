\* ===========================================================================
\* DSM — falsification: RecipientChecksAdmission = FALSE, RecipientChecksPin = FALSE
\*
\* The recipient checks neither the sender's admitted debit nor its pin of the
\* sender's head. The sender's transfer and its copy's, from the same parent,
\* are both applied: the sender's lineage forks.
\*
\* The gate passes only if TLC reports TripwireInvariant violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANT
    DeviceIds = {d1, d2}
    GenesisIds = {g1}
    MaxDevices = 2
    MaxPayload = 1
    VaultIds = {v1}
    MaxVaults = 1
    ShardDepth = 1
    MaxEmissions = 1
    EmissionAmount = 1
    MaxSupply = 1
    MaxNet = 2
    MaxDupPerMsg = 0
    MaxStep = 6
    UseHarness = FALSE
    RecipientChecksAdmission = FALSE
    RecipientChecksPin = FALSE

INVARIANT
    TripwireInvariant

CONSTRAINT
    StepBound
