\* ===========================================================================
\* DSM_WriteLock — falsification: CheckLock = FALSE
\*
\* A node takes a write at L's inbox without binding the address to the
\* write's lock: the attacker's write, under its own self-signed grant, is
\* stored at the recipient's inbox.
\*
\* The gate passes only if TLC reports LockedHoldsOnlyGranted violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    Nodes = {"n1", "n2"}
    Routes = {"r1"}
    Keys = {"L", "K", "X"}
    HonestLocks = {"L"}
    AttackerKeys = {"X"}
    WriterKeys = {"K", "X"}
    Granted <- MCGranted
    CheckLock = FALSE
    CheckFixed = TRUE

INVARIANT
    LockedHoldsOnlyGranted
