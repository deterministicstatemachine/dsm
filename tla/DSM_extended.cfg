SPECIFICATION Spec

\* Extended bounded regression profile.
\* This stays out of the default fast gate and exists to cover deeper activation /
\* emission bookkeeping without switching to the unbounded exploratory config.
\* Three devices: the online bag is held to two copies with no duplicates, so
\* the online protocol interleaves with the deeper DJTE runs at a size TLC
\* finishes; DSM_tiny, DSM_small and DSM_system check it with duplicates.

CONSTANT
    DeviceIds = {d1, d2, d3}
    GenesisIds = {g1}
    MaxDevices = 2
    MaxPayload = 1
    VaultIds = {v1}
    MaxVaults = 1
    ShardDepth = 1
    MaxEmissions = 2
    EmissionAmount = 1
    MaxSupply = 2
    MaxNet = 2
    MaxDupPerMsg = 0
    MaxStep = 10
    UseHarness = TRUE
    RecipientChecksAdmission = TRUE
    RecipientChecksPin = TRUE

INVARIANT
    TypeInvariant
    NoDuplicateDevices
    ActiveRelationshipsSymmetric
    VaultsOwnedByCreator
    OfflineSessionsSymmetric
    DJTESafety
    ConcreteRefinesAbstract
    RefinementStrengthening
    SourceVaultBounded
    TripwireInvariant
    TokenConservation
    ProjectionAgreement
    BarrierHeldDurably

PROPERTY
    SpentJapsNeverShrink
    CommitNeverDecreasesConcrete
    SourceRemainingNeverIncreases

CONSTRAINT
    StepBound
