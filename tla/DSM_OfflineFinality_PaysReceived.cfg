\* ===========================================================================
\* DSM Offline Finality — money received offline paid on (falsification)
\*
\* PaysOnlyLoaded = FALSE: a device that has paid out what it loaded and then
\* received offline proposes a payment of its own with what it received.
\* NothingReceivedIsPaidOn must fail, so the switch is what holds it in the
\* model config. Two steps each way, so a device can pay, receive and pay again.
\*
\* Two devices, two steps each way: proposals that cross, steps in sequence,
\* a link that drops at any point, frames delivered again, cancellation and
\* rejection. Every implementation switch is set to what the code does for an
\* offline-bearer step: its proposer commits when its anchor commits.
\*
\* Run: cd tla && java -cp tla2tools.jar tlc2.TLC -workers auto \
\*        -config DSM_OfflineFinality.cfg DSM_OfflineFinality.tla
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    StepsPerDevice = 2
    INITIAL_BALANCE = 1
    FramesAfterDurable = TRUE
    CancelOnlyBeforeConfirm = TRUE
    LinkLossFailsNothing = TRUE
    ReceiverRefusesWhileInFlight = TRUE
    SenderCommitsAtRelease = TRUE
    ConfirmOwedWithCommit = TRUE
    PaysOnlyLoaded = FALSE

INVARIANT
    NothingReceivedIsPaidOn
    TypeOK
    NoFork
    NoHalfCommit
    TripwireGuaranteesUniqueness
    CommitsExtendTheirParent
    OneStepInFlight
    TokenConservation
    BalancesNonNegative
    NothingReceivedIsPaidOn
    ConfirmFollowsDurableConfirm
    AckFollowsDurableCommit
    ConfirmFollowsSenderCommit

PROPERTY
    ChainsOnlyGrow
    SessionTermination

CHECK_DEADLOCK FALSE
