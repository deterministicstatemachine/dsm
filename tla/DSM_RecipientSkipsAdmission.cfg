\* ===========================================================================
\* DSM — falsification: RecipientChecksAdmission = FALSE
\*
\* The recipient applies a transfer whose sender's debit was never admitted.
\* A copy of the sender posts a transfer from a parent the sender already
\* consumed, aimed at the recipient's tip; applied before the sender's own,
\* it credits value no debit stands behind.
\*
\* The gate passes only if TLC reports TokenConservation violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANT
    DeviceIds = {d1, d2}
    GenesisIds = {g1}
    MaxDevices = 2
    MaxPayload = 1
    VaultIds = {v1}
    MaxVaults = 1
    ShardDepth = 1
    MaxEmissions = 1
    EmissionAmount = 1
    MaxSupply = 1
    MaxNet = 2
    MaxDupPerMsg = 0
    MaxStep = 5
    UseHarness = FALSE
    RecipientChecksAdmission = FALSE
    RecipientChecksPin = TRUE

INVARIANT
    TokenConservation

CONSTRAINT
    StepBound
