\* ===========================================================================
\* DSM Offline Finality — falsification: ConfirmOwedWithCommit = FALSE
\*
\* An offline-bearer proposer's commit and its owed confirm are not one
\* write: it commits and restarts still Prepared, then cancels. Its step is
\* committed; the receiver ends the step on the cancellation.
\*
\* The gate passes only if TLC reports NoHalfCommit violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    StepsPerDevice = 1
    INITIAL_BALANCE = 1
    FramesAfterDurable = TRUE
    CancelOnlyBeforeConfirm = TRUE
    LinkLossFailsNothing = TRUE
    ReceiverRefusesWhileInFlight = TRUE
    SenderCommitsAtRelease = TRUE
    ConfirmOwedWithCommit = FALSE

INVARIANT
    NoHalfCommit

CHECK_DEADLOCK FALSE
