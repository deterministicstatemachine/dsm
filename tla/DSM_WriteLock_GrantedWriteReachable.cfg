\* ===========================================================================
\* DSM_WriteLock — reachability: an honest grantee's write is taken
\*
\* Non-vacuity of LockedHoldsOnlyGranted: a node does take a write at the
\* honest lock's inbox. The gate passes only if TLC reports
\* GrantedWriteReachable violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    Nodes = {"n1", "n2"}
    Routes = {"r1"}
    Keys = {"L", "K", "X"}
    HonestLocks = {"L"}
    AttackerKeys = {"X"}
    WriterKeys = {"K", "X"}
    Granted <- MCGranted
    CheckLock = TRUE
    CheckFixed = TRUE

INVARIANT
    GrantedWriteReachable
