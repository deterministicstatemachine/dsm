\* ===========================================================================
\* DSM_WriteLock — reachability: an honest grantee's write is taken
\*
\* Non-vacuity of LockedHoldsOnlyGranted: a node does take a write at the
\* honest lock's inbox under a key it granted. The gate passes only if TLC
\* reports GrantedWriteReachable violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    Nodes = {"n1", "n2"}
    Routes = {"r1"}
    Keys = {"L", "K", "F", "X"}
    HonestLocks = {"L", "F"}
    FirstLocks = {"F"}
    AttackerKeys = {"X"}
    WriterKeys = {"K", "F", "X"}
    Granted <- MCGranted
    CheckLock = TRUE

INVARIANT
    GrantedWriteReachable
