\* ===========================================================================
\* DSM_WriteLock — falsification: CheckLock = FALSE, at a first inbox
\*
\* A node takes a write at the first inbox bound to F without binding the
\* address to the write's lock: a third party, who computes the address from
\* public bytes, stores a write there under its own key (DSM Amendment A37).
\*
\* The gate passes only if TLC reports FirstInboxOnlyItsWriter violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    Nodes = {"n1", "n2"}
    Routes = {"r1"}
    Keys = {"L", "K", "F", "X"}
    HonestLocks = {"L", "F"}
    FirstLocks = {"F"}
    AttackerKeys = {"X"}
    WriterKeys = {"K", "F", "X"}
    Granted <- MCGranted
    CheckLock = FALSE

INVARIANT
    FirstInboxOnlyItsWriter
