\* ===========================================================================
\* DSM Offline Finality — falsification: FramesAfterDurable = FALSE
\*
\* The confirm leaves before ConfirmPending is durable and the proposer
\* restarts before writing it. Still Prepared, it may cancel; the receiver
\* commits on the confirm. One device committed, the other ended the step.
\*
\* The gate passes only if TLC reports NoHalfCommit violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    StepsPerDevice = 1
    INITIAL_BALANCE = 1
    FramesAfterDurable = FALSE
    CancelOnlyBeforeConfirm = TRUE
    LinkLossFailsNothing = TRUE
    ReceiverRefusesWhileInFlight = TRUE

INVARIANT
    NoHalfCommit

CHECK_DEADLOCK FALSE
