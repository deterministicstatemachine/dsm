\* ===========================================================================
\* DSM Offline Finality — non-vacuity: SenderAhead is reachable
\*
\* An offline-bearer proposer commits as it confirms, ahead of its receiver:
\* the half state NoHalfCommit's third clause allows is reached.
\*
\* The gate passes only if TLC reports NeverSenderAhead violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANTS
    d1 = d1
    d2 = d2
    Device = {d1, d2}
    StepsPerDevice = 1
    INITIAL_BALANCE = 1
    FramesAfterDurable = TRUE
    CancelOnlyBeforeConfirm = TRUE
    LinkLossFailsNothing = TRUE
    ReceiverRefusesWhileInFlight = TRUE
    SenderCommitsAtRelease = TRUE
    ConfirmOwedWithCommit = TRUE

INVARIANT
    NeverSenderAhead

CHECK_DEADLOCK FALSE
