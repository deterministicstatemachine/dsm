\* ===========================================================================
\* DSM — non-vacuity: two crossing online sends both settle
\*
\* Two devices, one relationship. Each sends before applying the other's
\* transfer; both apply, both finalize on the joined projection tip, both
\* certificates land, both gates release and both recipients read them:
\* thirteen steps, the search held to the online protocol (OnlineScope).
\*
\* The gate passes only if TLC reports NoCrossingSettles violated.
\* ===========================================================================

SPECIFICATION Spec

CONSTANT
    DeviceIds = {d1, d2}
    GenesisIds = {g1}
    MaxDevices = 2
    MaxPayload = 1
    VaultIds = {v1}
    MaxVaults = 1
    ShardDepth = 1
    MaxEmissions = 1
    EmissionAmount = 1
    MaxSupply = 1
    MaxNet = 2
    MaxDupPerMsg = 0
    MaxStep = 13
    UseHarness = FALSE
    RecipientChecksAdmission = TRUE
    RecipientChecksPin = TRUE

INVARIANT
    NoCrossingSettles

CONSTRAINT
    OnlineScope
