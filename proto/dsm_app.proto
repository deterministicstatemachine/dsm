// SPDX-License-Identifier: Apache-2.0
// DSM Core Protocol — Schema 2.4.0 (2026-02-08) | Envelope wire v3
// Single canonical path: no alternate paths, no wall clocks, no non-deterministic maps in hashed preimages.
// After editing, run `npm --prefix dsm_client/frontend run proto:gen` to keep dsm_app_pb.ts current.
//
// Codegen plugin pin: dsm_client/frontend/package.json holds an EXACT pin
// `"@bufbuild/protoc-gen-es": "1.10.1"`. The v1 plugin emits the class-based
// runtime API that matches @bufbuild/protobuf ^1.7.2 and the existing
// frontend service-layer call sites. v2+ emits a different runtime
// (typeName-keyed schemas, create(Schema, ...)) and requires migrating
// @bufbuild/protobuf to ^2 plus rewriting every proto consumer. Do not
// loosen the pin without doing that migration in lockstep — otherwise
// `proto:gen` silently breaks `npm run type-check`.

syntax = "proto3";
package dsm;

import "google/protobuf/descriptor.proto";

// ====================== DSM FILE/FIELD OPTIONS ======================
// Declare extensions BEFORE use.
extend google.protobuf.FileOptions {
  string dsm_schema_semver  = 52000;
  uint32 dsm_envelope_epoch = 52001;
}
extend google.protobuf.FieldOptions {
  uint32 dsm_fixed_len = 51000; // exact length in bytes
  uint32 dsm_max_len   = 51001; // upper bound in bytes
}

option optimize_for        = SPEED;
option java_multiple_files = true;
option java_package        = "dsm.types.proto";
option csharp_namespace    = "Dsm.Proto";
option go_package          = "github.com/dsm-project/sdk/go/dsmpb";
option swift_prefix        = "DSM";

option (dsm_schema_semver)  = "2.4.0";
option (dsm_envelope_epoch) = 3;

// ============================ WRAPPERS ===============================
message Hash32 { bytes v = 1 [(dsm_fixed_len)=32]; }     // BLAKE3-256 (DSM standard)
message Hash16 { bytes v = 1 [(dsm_fixed_len)=16]; }     // 16-byte opaque id / nonce
message U128   { bytes le = 1 [(dsm_fixed_len)=16]; }    // little-endian u128
message S128   { bytes le = 1 [(dsm_fixed_len)=16]; }    // little-endian two’s-compl. s128

// Acyclic program reference (non–TC DAG root bound to identity).
message ProgramRef {
  string program_id = 1; // e.g., "dex.swap.v3"
  Hash32 dag_root   = 2; // Merkle root of program DAG
}

// ============================== EVIDENCE =============================
enum AttestorType {
  ATTESTOR_UNSPECIFIED = 0;
  ATTESTOR_ORACLE      = 1;
  ATTESTOR_TEE         = 2;
  ATTESTOR_QUORUM      = 3;
  ATTESTOR_CLOCK       = 4;
  ATTESTOR_CHAIN       = 5;
  ATTESTOR_PREIMAGE    = 6;
}

// ============================== TRANSACTION TYPES =============================
enum TransactionType {
  TX_TYPE_UNSPECIFIED      = 0;
  // A faucet claim: ERA released to this device from the native reserve. The
  // row names no sender device (its source is the reserve) and carries the
  // release's operation digest as its hash. Value 1 is deliberately taken
  // back from reserved: it was reserved while no claim wrote a history row.
  TX_TYPE_FAUCET           = 1;
  // 3 was a recovered offline transfer: no history row of that kind is written.
  reserved 3;
  reserved "TX_TYPE_BILATERAL_OFFLINE_RECOVERED";
  TX_TYPE_BILATERAL_OFFLINE = 2; // Offline bilateral transfer
  TX_TYPE_ONLINE           = 4; // Online transfer
  TX_TYPE_DBTC_MINT        = 5; // BTC→dBTC deposit (mint)
  TX_TYPE_DBTC_BURN        = 6; // dBTC→BTC withdrawal (burn)
}

message EvidenceOracle {
  bytes payload    = 1 [(dsm_max_len)=65535];
  bytes signature  = 2 [(dsm_max_len)=65535];
  bytes oracle_key = 3 [(dsm_max_len)=96]; // raw key or key-hash
}
message EvidenceClock {
  uint64 attested_iterations = 1; // clockless iteration proof
  bytes  attestor_sig        = 2 [(dsm_max_len)=65535];
}
message EvidenceTee   { bytes report = 1 [(dsm_max_len)=65535]; bytes cert = 2 [(dsm_max_len)=65535]; }
message EvidenceQuorum{
  uint32 threshold        = 1;
  repeated bytes pubkeys  = 2 [(dsm_max_len)=96];
  repeated bytes sigs     = 3 [(dsm_max_len)=65535];
  Hash32 payload_hash     = 4;
}
message EvidenceChain  { bytes chain_id = 1 [(dsm_max_len)=32]; bytes header = 2 [(dsm_max_len)=65535]; bytes proof = 3 [(dsm_max_len)=65535]; }
message EvidencePreimage { bytes preimage = 1 [(dsm_max_len)=65535]; }

message Evidence {
  oneof kind {
    EvidenceOracle   oracle   = 1;
    EvidenceTee      tee      = 2;
    EvidenceQuorum   quorum   = 3;
    EvidenceClock    clock    = 4;
    EvidenceChain    chain    = 5;
    EvidencePreimage preimage = 6;
  }
}

// ===================== CHOICE-LOCK (XOR PRECOMMIT) ==================
message Guard {
  AttestorType attestor       = 1;
  bytes        attestor_key   = 2 [(dsm_max_len)=96];
  uint64       min_iterations = 3;
  uint64       max_iterations = 4;
}
message PrecommitOption {
  uint32 idx             = 1; // 0..N-1
  Guard  guard           = 2;
  Hash32 post_state_hash = 3;
  bytes  payload         = 4 [(dsm_max_len)=4096]; // app-opaque
}
message PrecommitOneOf {
  Hash32 precommit_id      = 1;
  Hash32 pre_state_hash    = 2; // MUST equal current tip
  repeated bytes cosigners = 3 [(dsm_max_len)=96];
  repeated PrecommitOption options = 4; // >= 2
  bytes   commitment_sig   = 5 [(dsm_max_len)=65535];
  uint32  max_options      = 6; // MUST equal options.size()
}
message ResolvePrecommit {
  Hash32   precommit_id     = 1;
  uint32   chosen_idx       = 2;
  Evidence evidence         = 3; // must satisfy Guard.attestor
  repeated bytes signatures = 4 [(dsm_max_len)=65535]; // includes cosigners
  Hash32   post_state_hash  = 5; // MUST equal option.post_state_hash
}

// ============================ EXTERNAL COMMITS ======================
message ExternalCommit {
  // Canonical source identifier:
  // BLAKE3-256("DSM/external-source-id\0" || source_utf8_bytes)
  Hash32 source_id = 1;
  bytes  payload   = 2 [(dsm_max_len)=65535];
  Evidence evidence= 3;
  reserved 4; // removed field — prevent reuse
  // Canonical commit identifier:
  // BLAKE3-256("DSM/external-commit-id\0" || source_id || payload || evidence_hash)
  // where evidence_hash := BLAKE3-256("DSM/external-evidence\0" || evidence_bytes)
  // and evidence_hash = 32x00 if evidence is absent.
  Hash32 commit_id = 5;
}

// ======= DELEGATED CAPABILITIES & ATTESTED ACTIONS (AUTHZ) =========
message CapabilityConstraint { string key = 1; string value = 2; }
message CapabilityScope {
  string  resource = 1; // e.g., "token/TRANSFER", "kv/WRITE"
  string  action   = 2; // e.g., "invoke", "mint", "set"
  repeated CapabilityConstraint constraints = 3;
  uint64  min_iterations = 4;
  uint64  max_iterations = 5;
}
message DelegatedCapability {
  Hash32  cap_id    = 1; // hash of body (canonical bytes)
  bytes   issuer    = 2 [(dsm_max_len)=96];
  bytes   subject   = 3 [(dsm_max_len)=96];
  repeated CapabilityScope scopes = 4;
  optional Hash32 parent_cap_id = 5;
  bytes   signature = 6 [(dsm_max_len)=65535];
}
message AttestedAction {
  bytes    actor     = 1 [(dsm_max_len)=96];
  string   action    = 2; // canonical verb
  bytes    payload   = 3 [(dsm_max_len)=4096];
  Evidence evidence  = 4;
  bytes    signature = 5 [(dsm_max_len)=65535];
}

// ============ DETERMINISTIC LIMBO VAULTS (DLV) PRIMITIVES ===========
message DlvCreate { Hash32 vault_id = 1; Hash32 policy_hash = 2; Hash32 seed_commit = 3; bytes owner = 4 [(dsm_max_len)=96]; bytes signature = 5 [(dsm_max_len)=65535]; }
message DlvUnlock { Hash32 vault_id = 1; bytes condition_proof = 2 [(dsm_max_len)=65535]; Evidence evidence = 3; bytes signature = 4 [(dsm_max_len)=65535]; }

// ----------------------------- Vault helpers ----------------------------
message FulfillmentMechanism {
  reserved 1; // time-based mechanism removed
  oneof kind {
    Payment payment = 2;
    CryptoCondition crypto_condition = 3;
    MultiSignature multi_signature = 4;
    StateReference state_reference = 5;
    RandomWalkVerification random_walk_verification = 6;
    And and = 7;
    Or or = 8;
    BitcoinHTLC bitcoin_htlc = 9;
    AmmConstantProduct amm_constant_product = 10;
  }
}

// AMM (constant-product) liquidity vault.  The vault holds two token
// reserves and unlocks via a routed swap: a trader puts `input_amount`
// of `token_in` in, the vault releases `expected_output_amount` of
// `token_out` per the constant-product invariant
//   k = reserve_in * reserve_out   (post-fee adjusted at swap time)
//
// Reserves are vault-state, not advertisement state.  When a routed
// unlock is accepted, both reserves advance atomically:
//   reserve_in  += input_after_fee
//   reserve_out -= output
// and the vault republishes its `RoutingVaultAdvertisementV1` with
// `updated_state_number++`.  A stale advertisement causes a mis-quoted
// route, which the chunk-7 re-simulation gate catches at unlock time
// (SoFi spec §3, §8).
//
// `token_a` / `token_b` are stored in canonical lex-sorted order so
// the vault has a single canonical pair identity regardless of trade
// direction; `reserve_a` / `reserve_b` follow the same ordering.
// The PREDICATE only. Reserves used to live here, which made a vault's
// advertised liquidity a number the owner asserted inside its own unlock
// condition — nothing held it, and a settled swap moved no value. Reserves are
// now encumbered in the owner's device SMT (`DSM/vault-reserve/v1`) and PROVED
// to a trader, so a condition no longer carries the quantities it governs.
message AmmConstantProduct {
  // 32-byte CPTA policy commits, lex-sorted. A ticker is NOT an identity —
  // two distinct tokens have shared the ticker RIGB in this repo — so a pair
  // named by label is a pair that can match the wrong asset while every
  // signature on the path still verifies.
  bytes  token_a            = 1 [(dsm_fixed_len)=32];  // lex-lower policy commit
  bytes  token_b            = 2 [(dsm_fixed_len)=32];  // lex-higher policy commit
  reserved 3, 4;                                      // reserve_a_u128 / reserve_b_u128
  reserved "reserve_a_u128", "reserve_b_u128";
  uint32 fee_bps            = 5;                      // basis points (e.g. 30 = 0.30 %)
}

message BitcoinHTLC {
  bytes  hash_lock = 1 [(dsm_fixed_len)=32]; // SHA256(sk_V): fulfill hashlock h_f (path a)
  uint64 refund_iterations = 2; // DSM state iterations before depositor can derive rk_V
  bytes  bitcoin_pubkey = 3 [(dsm_max_len)=33]; // Counterparty's compressed Bitcoin pubkey
  uint64 expected_btc_amount_sats = 4; // Expected Bitcoin amount in satoshis
  uint32 network = 5; // 0=mainnet, 1=testnet, 2=signet
  uint64 min_confirmations = 6; // dBTC §6.4/§12.1.3: min block depth for vault transition (canonical=100)
  bytes  refund_hash_lock = 7 [(dsm_fixed_len)=32]; // SHA256(rk_V): refund hashlock h_r (path b)
}

message BitcoinHTLCProof {
  bytes  preimage = 1 [(dsm_max_len)=32]; // Secret s where SHA256(s) = hash_lock
  bytes  bitcoin_txid = 2 [(dsm_fixed_len)=32]; // Bitcoin transaction ID (little-endian)
  bytes  spv_proof = 3 [(dsm_max_len)=65535]; // Merkle proof of inclusion in Bitcoin block
  bytes  block_header = 4 [(dsm_fixed_len)=80]; // Raw 80-byte Bitcoin block header
  uint64 confirmations = 5; // Number of confirmations (advisory)
  repeated bytes header_chain = 6; // 80-byte headers from checkpoint to block
}

// ===================== BITCOIN TAP (DEPOSIT / WITHDRAWAL) =====================
message DepositRequest {
  string vault_op_id = 1;
  string direction = 2; // "dsm_to_btc" or "btc_to_dsm"
  uint64 dsm_amount = 3;
  string dsm_token_id = 4;
  uint64 btc_amount_sats = 5;
  bytes  hash_lock = 6 [(dsm_fixed_len)=32];
  bytes  btc_pubkey = 7 [(dsm_max_len)=33]; // Counterparty's Bitcoin compressed pubkey
  uint64 refund_iterations = 8; // DSM-side iteration timeout
  string destination_address = 9; // BTC destination for dbtc_to_btc withdrawals (bech32)
  bytes  refund_btc_pubkey = 10 [(dsm_max_len)=33]; // Refund path Bitcoin compressed pubkey
}

message DepositResponse {
  string vault_op_id = 1;
  string status = 2; // "initiated", "awaiting_counterparty", etc.
  string vault_id = 3;
  bytes  external_commitment = 4 [(dsm_fixed_len)=32];
  bytes  hash_lock = 5 [(dsm_fixed_len)=32];
  bytes  htlc_script = 6 [(dsm_max_len)=512]; // Bitcoin HTLC redeem script
  string htlc_address = 7; // Bitcoin P2SH/P2WSH address
  string message = 8;
  string funding_txid = 9; // Resolved funding/sweep tx id (hex, display order)
}

message DepositCompleteRequest {
  string vault_op_id = 1;
  bytes  preimage = 2 [(dsm_max_len)=32];
  bytes  bitcoin_txid = 3 [(dsm_fixed_len)=32];
  bytes  spv_proof = 4 [(dsm_max_len)=65535];
  bytes  block_header = 5 [(dsm_fixed_len)=80];
  uint64 confirmations = 6;
  bytes  bitcoin_tx_raw = 7 [(dsm_max_len)=1048576]; // Raw Bitcoin tx bytes for amount/script verification
  repeated bytes header_chain = 8; // Sequence of 80-byte headers from checkpoint anchor to block_header
  bytes  recipient_device_id = 9 [(dsm_fixed_len)=32]; // Optional mint recipient override (defaults to local device)
  // Burn receipt + sigma are derived internally by the SDK from the applied
  // Burn transition before vault unlock (§6.1–§6.2).
}

message DepositRefundRequest {
  string vault_op_id = 1;
}

message DepositStatusRequest {
  string vault_op_id = 1;
}

// ===================== BITCOIN TAP (dBTC) =====================

message BitcoinAddressRequest {
  uint32 network = 1; // 0=mainnet, 1=testnet, 2=signet
  uint32 index = 2; // BIP84 address index (default 0)
}

message BitcoinAddressResponse {
  string address = 1; // bech32 P2WPKH address (bc1q... / tb1q...)
  uint32 index = 2; // BIP84 address index
  bytes  compressed_pubkey = 3; // 33-byte compressed public key
}

// Select and persist the active receive index for the current Bitcoin account.
message BitcoinAddressSelectRequest {
  uint32 index = 1; // BIP84 address index to set as active (0..N)
}

message BitcoinAddressSelectResponse {
  bool   success          = 1;
  string address          = 2; // bech32 address at the selected index
  uint32 index            = 3; // confirmed active index
  bytes  compressed_pubkey = 4; // 33-byte compressed public key
}

message BitcoinDepositListRequest {}

message BitcoinDepositListResponse {
  repeated BitcoinDepositEntry deposits = 1;
}

message BitcoinDepositEntry {
  string vault_op_id = 1;
  string direction = 2; // "btc_to_dbtc" or "dbtc_to_btc"
  string status = 3; // "initiated", "awaiting_confirmation", "claimable", "completed", "expired", "refunded"
  uint64 btc_amount_sats = 4;
  string htlc_address = 5;
  string vault_id = 6;
  bool   is_fractional_successor = 7; // true when this deposit was created by a fractional exit
  string funding_txid = 8; // on-chain funding transaction ID (hex, set after fund_and_broadcast)
}

message BitcoinClaimTxRequest {
  string vault_op_id = 1;
  string destination_address = 2; // bech32 address to send claimed BTC
  uint64 fee_rate_sat_vb = 3; // fee rate in sat/vbyte
  bytes  outpoint_txid = 4 [(dsm_fixed_len)=32]; // Funding txid containing the HTLC output
  uint32 outpoint_vout = 5; // Funding output index containing the HTLC UTXO
  bytes  preimage = 6 [(dsm_max_len)=64]; // Optional preimage override; falls back to deposit preimage
  uint32 signing_index = 7; // BIP84 receive index used for signing (default: 0)
}

message BitcoinClaimTxResponse {
  bytes  raw_tx = 1; // serialized raw Bitcoin transaction
  string txid = 2; // transaction ID (hex, reversed byte order)
}

// ===================== BITCOIN BROADCAST / AUTO-CLAIM / TX STATUS =====================

message BitcoinBroadcastRequest {
  bytes raw_tx = 1 [(dsm_max_len)=1048576]; // Serialized raw Bitcoin transaction bytes
}

message BitcoinBroadcastResponse {
  bytes txid = 1 [(dsm_fixed_len)=32]; // Transaction ID (32 bytes, internal byte order)
}

message BitcoinAutoClaimRequest {
  string vault_op_id = 1;
  string destination_address = 2; // bech32 address to receive claimed BTC
  bytes  funding_txid = 3 [(dsm_fixed_len)=32]; // HTLC funding transaction ID (internal byte order)
  uint32 funding_vout = 4; // Output index of the HTLC UTXO
  uint64 fee_rate_sat_vb = 5; // Fee rate in sat/vbyte (minimum 1)
  uint32 signing_index = 6; // BIP84 receive index for signing (default: 0)
}

message BitcoinAutoClaimResponse {
  bytes txid = 1 [(dsm_fixed_len)=32]; // Claim transaction ID (internal byte order)
  bytes raw_tx = 2 [(dsm_max_len)=1048576]; // Serialized signed claim transaction
}

message BitcoinTxStatusRequest {
  bytes txid = 1 [(dsm_fixed_len)=32]; // Transaction ID (internal byte order)
}

message BitcoinTxStatusResponse {
  uint32 confirmations = 1; // Number of confirmations (0 = mempool only)
  bool   in_mempool = 2; // True if transaction is in the mempool
}

// ===================== VAULT MONITOR =====================

message BitcoinVaultListRequest {}

message BitcoinVaultListResponse {
  repeated BitcoinVaultSummary vaults = 1;
}

message BitcoinVaultSummary {
  string vault_id = 1;
  string state = 2; // "limbo", "unlocked", "claimed", "invalidated"
  uint64 amount_sats = 3; // BTC amount locked in this vault
  string direction = 4; // "btc_to_dbtc" or "dbtc_to_btc"
  string htlc_address = 5; // Bitcoin P2WSH address
  bytes  entry_header = 6 [(dsm_max_len)=80]; // 80-byte Bitcoin block header at entry (if set)
}

message BitcoinVaultGetRequest {
  string vault_id = 1;
}

message BitcoinVaultGetResponse {
  string vault_id = 1;
  string state = 2;
  uint64 amount_sats = 3;
  string direction = 4;
  string htlc_address = 5;
  bytes  entry_header = 6 [(dsm_max_len)=80];
  uint64 created_at_state = 7;
  bytes  content_commitment = 8 [(dsm_max_len)=64];
  string vault_op_id = 9; // Associated vault operation ID (if known)
}

message BitcoinWalletHealthResponse {
  string network = 1; // "mainnet", "testnet", "signet"
  bool   reachable = 2;
  string source = 3; // "CHAIN" or "UNKNOWN"
  string reason = 4; // empty when reachable
  string rpc_url = 5; // masked RPC URL (scheme + host only)
  uint32 tracked_addresses = 6;
}

// --- Fee estimation (Phase 8.1) ---

message BitcoinFeeEstimateRequest {
  string vault_op_id = 1; // vault operation whose HTLC we're estimating for
  uint64 fee_rate_sat_vb = 2; // fee rate in sat/vbyte
  bool   is_fractional = 3; // true → sweep-and-change, false → full claim
}

message BitcoinFeeEstimateResponse {
  uint64 estimated_fee_sats = 1;
  uint64 estimated_vsize = 2;
  uint64 output_amount_sats = 3;
}

// --- HTLC refund TX builder (Phase 8.3) ---

message BitcoinRefundTxRequest {
  string vault_op_id = 1;
  string refund_address = 2; // where refunded BTC goes
  bytes  outpoint_txid = 3 [(dsm_max_len)=32];
  uint32 outpoint_vout = 4;
  uint64 fee_rate_sat_vb = 5;
  uint32 signing_index = 6;
}

message BitcoinRefundTxResponse {
  bytes  raw_tx = 1;
  string txid = 2;
}

// --- Fractional exit (Phase 8.4) ---

message BitcoinFractionalExitRequest {
  string source_vault_id = 1;
  uint64 exit_amount_sats = 2;
  uint32 successor_locktime = 3;
  uint64 refund_iterations = 4;
  string destination_address = 5; // Native BTC destination for sweep (§6.3)
  string plan_id = 6; // Deterministic withdrawal ID (ρ) from planning phase
}

message BitcoinFractionalExitResponse {
  string source_vault_id = 1;
  string successor_vault_id = 2;
  string successor_vault_op_id = 3;
  uint64 exit_amount_sats = 4;
  uint64 remainder_sats = 5;
  uint32 successor_depth = 6;
  bytes  successor_htlc_script = 7 [(dsm_max_len)=256];
  string successor_htlc_address = 8;
  string exit_vault_op_id = 9;
  // Exit anchor: sweep/claim tx id (dBTC §6.4.3)
  string sweep_txid = 10;
  // Exit anchor: block confirmation depth achieved (dBTC §12.1.3)
  uint32 confirm_depth = 11;
}

message BitcoinWithdrawalPlanRequest {
  uint64 requested_net_sats = 1;
  string destination_address = 2;
}

message BitcoinWithdrawalBlockedVault {
  string vault_id = 1;
  uint64 amount_sats = 2;
  string reason = 3;
}

message BitcoinWithdrawalPlanLeg {
  string vault_id = 1;
  string kind = 2; // "full" or "partial"
  uint64 source_amount_sats = 3;
  uint64 gross_exit_sats = 4;
  uint64 estimated_fee_sats = 5;
  uint64 estimated_net_sats = 6;
  uint64 remainder_sats = 7;
  uint32 successor_depth_after = 8;
}

message BitcoinWithdrawalPlanResponse {
  reserved 10, 11, 12;
  string plan_id = 1;
  string plan_class = 2;
  uint64 requested_net_sats = 3;
  uint64 planned_net_sats = 4;
  uint64 total_gross_exit_sats = 5;
  uint64 total_fee_sats = 6;
  uint64 shortfall_sats = 7;
  repeated BitcoinWithdrawalPlanLeg legs = 8;
  repeated BitcoinWithdrawalBlockedVault blocked_vaults = 9;
  bytes policy_commit = 13 [(dsm_fixed_len)=32];
  uint64 available_dbtc_sats = 14;
}

message BitcoinWithdrawalExecuteRequest {
  reserved 2, 4, 5;
  string plan_id = 1;
  string destination_address = 3;
}

message BitcoinWithdrawalExecutionLeg {
  string vault_id = 1;
  string kind = 2; // "full" or "partial"
  string status = 3; // "completed" or "failed"
  uint64 gross_exit_sats = 4;
  uint64 estimated_fee_sats = 5;
  uint64 estimated_net_sats = 6;
  uint64 actual_remainder_sats = 7;
  string successor_vault_id = 8;
  string successor_vault_op_id = 9;
  string exit_vault_op_id = 10;
  string sweep_txid = 11;
}

message BitcoinWithdrawalExecuteResponse {
  reserved 12, 13;
  string plan_id = 1;
  string plan_class = 2;
  string status = 3;
  string message = 4;
  uint64 requested_net_sats = 5;
  uint64 planned_net_sats = 6;
  uint64 total_gross_exit_sats = 7;
  uint64 total_fee_sats = 8;
  uint64 shortfall_sats = 9;
  repeated BitcoinWithdrawalExecutionLeg executed_legs = 10;
  repeated BitcoinWithdrawalBlockedVault blocked_vaults = 11;
}

message DbtcVaultAdvertisementV1 {
  uint32 version = 1;
  bytes policy_commit = 2 [(dsm_fixed_len)=32];
  string vault_id = 3;
  bytes controller_device_id = 4 [(dsm_fixed_len)=32];
  uint64 amount_sats = 5;
  uint32 successor_depth = 6;
  string lifecycle_state = 7;
  bool routeable = 8;
  string busy_reason = 9;
  uint64 updated_state_number = 10;
  string vault_proto_key = 11;
  bytes vault_proto_digest = 12 [(dsm_fixed_len)=32];
  // Bitcoin txid that funded this vault's HTLC (internal byte order).
  // Published at deposit/sweep time. Withdrawer verifies against Bitcoin
  // directly (UTXO check + SPV from any Bitcoin node). Storage nodes
  // never verify — they just cache the pointer.
  bytes entry_txid = 13 [(dsm_fixed_len)=32];
  // HTLC P2WSH address — withdrawer queries the Bitcoin UTXO set at this address
  // to determine vault liveness and confirm depth (spec §8 Definition 7).
  string htlc_address = 14;
  // BLAKE3("DSM/script-commit" || htlc_script) — commits the spending template
  // without revealing the full script (spec Definition 9: script_commit_k).
  bytes script_commit = 15 [(dsm_fixed_len)=32];
  // Public construction data needed to assemble the Bitcoin spend tx (spec
  // Definition 9: redeem_params_k). Excludes the bearer-derived witness.
  // Encoded as DbtcRedeemParams protobuf.
  bytes redeem_params = 16;
  // Random 32-byte nonce per vault — public, safe without manifold_seed.
  // Bearer derives η = BLAKE3("DSM/dbtc-bearer-eta\0" || manifold_seed || deposit_nonce).
  bytes deposit_nonce = 17 [(dsm_fixed_len)=32];
}

// Public construction data for a vault's HTLC (spec Definition 11).
// Sufficient to assemble a redemption transaction structure but NOT to authorize it.
// The bearer-derived witness (preimage + signature) is computed locally at spend time.
message DbtcRedeemParams {
  // Raw HTLC redeem script bytes.
  bytes htlc_script = 1;
  // Claim public key (33 bytes compressed secp256k1).
  bytes claim_pubkey = 2;
  // Hash lock embedded in the HTLC: SHA256(preimage).
  bytes hash_lock = 3 [(dsm_fixed_len)=32];
  // Refund hash lock for the time-locked refund path.
  bytes refund_hash_lock = 4 [(dsm_fixed_len)=32];
  // Refund iteration count (maps to HTLC locktime).
  uint32 refund_iterations = 5;
}

message DbtcRouteCommitmentLegV1 {
  string vault_id = 1;
  string kind = 2;
  uint64 source_amount_sats = 3;
  uint64 gross_exit_sats = 4;
  uint64 estimated_fee_sats = 5;
  uint64 estimated_net_sats = 6;
  uint64 remainder_sats = 7;
  uint32 successor_depth_after = 8;
}

message DbtcRouteCommitmentV1 {
  uint32 version = 1;
  bytes policy_commit = 2 [(dsm_fixed_len)=32];
  string token_in = 3;
  string token_out = 4;
  uint64 requested_net_sats = 5;
  string destination_address = 6;
  bytes selector_snapshot_hash = 7 [(dsm_fixed_len)=32];
  repeated DbtcRouteCommitmentLegV1 legs = 8;
  string plan_class = 9;
  uint64 planned_net_sats = 10;
  uint64 total_gross_exit_sats = 11;
  uint64 total_fee_sats = 12;
  uint64 shortfall_sats = 13;
  bytes planner_device_id = 14 [(dsm_fixed_len)=32];
}

message BitcoinWalletImportRequest {
  string import_kind  = 1; // "wif" | "xpriv" | "mnemonic"
  string secret       = 2; // user-supplied import material (kept local to device)
  string label        = 3; // user-visible account label
  uint32 network      = 4; // 0=mainnet, 1=testnet, 2=signet
  uint32 start_index  = 5; // BIP84 address index to use as the active receive address (default 0)
}

message BitcoinWalletAccount {
  string account_id           = 1;
  string label                = 2;
  string import_kind          = 3;
  uint32 network              = 4;
  bool   active               = 5;
  string first_address        = 6;
  uint32 active_receive_index = 7; // currently selected BIP84 address index
}

message BitcoinWalletImportResponse {
  bool success = 1;
  string account_id = 2;
  string message = 3;
}

message BitcoinWalletListRequest {}

message BitcoinWalletListResponse {
  repeated BitcoinWalletAccount accounts = 1;
  string active_account_id = 2;
}

message BitcoinWalletSelectRequest {
  string account_id = 1;
}

message BitcoinWalletSelectResponse {
  bool success = 1;
  string active_account_id = 2;
  string message = 3;
}

// Generate a fresh BIP39 wallet — no secret needed, returns mnemonic for backup.
message BitcoinWalletCreateRequest {
  uint32 network    = 1; // 0=mainnet, 1=testnet, 2=signet
  string label      = 2; // user-visible account label (optional)
  uint32 word_count = 3; // 12 or 24 (default 24)
}

message BitcoinWalletCreateResponse {
  bool   success       = 1;
  string account_id    = 2;
  string mnemonic      = 3; // DISPLAY AND BACK UP — not stored in plaintext after this call
  string first_address = 4;
  string message       = 5;
}

message Payment {
  uint64 amount = 1;
  string token_id = 2;
  string recipient = 3;
  bytes verification_state = 4; // opaque state bytes
}

message CryptoCondition {
  bytes condition_hash = 1;
  bytes public_params = 2;
}

message MultiSignature {
  repeated bytes public_keys = 1;
  uint32 threshold = 2;
}

message StateReference {
  repeated bytes reference_states = 1;
  bytes parameters = 2;
}

message RandomWalkVerification {
  bytes verification_key = 1;
  string statement = 2;
}

message And { repeated FulfillmentMechanism conditions = 1; }
message Or  { repeated FulfillmentMechanism conditions = 1; }

// Minimal encrypted content proto for vaults
message EncryptedContentProto {
  bytes encapsulated_key = 1;
  bytes encrypted_data = 2;
  bytes nonce = 3;
  bytes aad = 4;
}

// Vault state (lightweight representation)
message VaultStateProto {
  oneof kind {
    bool limbo = 1; // Limbo state: vault locked, awaiting fulfillment. Standard proto oneof unit variant.
    Unlocked unlocked = 2;
    Claimed claimed = 3;
    Invalidated invalidated = 4;
  }
}
message Unlocked { uint64 unlocked_state_number = 1; bytes fulfillment_proof = 2; }
message Claimed { uint64 claimed_state_number = 1; bytes claimant = 2; bytes claim_proof = 3; }
message Invalidated { uint64 invalidated_state_number = 1; string reason = 2; bytes creator_signature = 3; }

// Limbo vault canonical proto for storage/transport
message LimboVaultProto {
  bytes id = 1 [(dsm_fixed_len)=32];
  uint64 created_at_state = 2;
  bytes creator_public_key = 3;
  FulfillmentMechanism fulfillment_condition = 4;
  optional bytes intended_recipient = 5;
  VaultStateProto state = 6;
  string content_type = 7;
  EncryptedContentProto encrypted_content = 8;
  bytes content_commitment = 9;
  bytes parameters_hash = 10;
  bytes creator_signature = 11;
  repeated bytes verification_positions = 12;
  bytes reference_state_hash = 13;
  optional bytes entry_header = 14; // 80-byte Bitcoin block header cached at entry (Invariant 19, §12.2.3)
  // The vault's DLV-POLICY digest - its behavioural-policy identity, NOT a
  // CPTA/token anchor (the pair's two CPTA commits are separate, independent
  // token-policy authorities carried by the AMM predicate). For an AMM DLV
  // it is BLAKE3("DSM/dlv-policy-digest", CCB(ReleasePolicy) || CCB(FeePolicy)),
  // a deterministic view of the two DLV-layer members the creator-signed
  // VaultStateV2 commits; dlv.create derives it and folds it into the
  // creator-signed parameters_hash. Non-AMM DLVs have no ReleasePolicy/FeePolicy
  // object to derive from; their supplied 32-byte digest remains caller-supplied
  // but creator-signed, and tightening that meaning is follow-up semantic debt.
  // Re-used as the routing advertisement's `unlock_spec_digest`. Optional only
  // because the field post-dates the proto; a vault without it cannot be advertised.
  optional bytes policy_digest = 15;
}

// Vault post wrapper for storage nodes
message VaultPostProto {
  bytes vault_id = 1 [(dsm_fixed_len)=32];
  string lock_description = 2;
  string creator_id = 3;
  bytes commitment_hash = 4;
  string status = 5;
  repeated ParamKV metadata = 6; // sorted by key (deterministic)
  bytes vault_data = 7; // encoded LimboVaultProto
}

// ===================== STORAGE-NODE MIRRORED OBJECTS (V3) ==================
// These objects are mirrored by storage nodes as raw bytes.
// All authenticity/enforcement is device-side; nodes are dumb mirrors.

// ------------------------------- Contacts ---------------------------------
message ContactAddV3 {
  // domain: "DSM/contact/add\0"
  bytes author_device_id  = 1 [(dsm_fixed_len)=32];
  bytes contact_device_id = 2 [(dsm_fixed_len)=32];
  bytes contact_chain_tip = 3 [(dsm_fixed_len)=32];
  bytes parent_digest     = 4 [(dsm_fixed_len)=32]; // optional, empty allowed
}

message ContactAcceptV3 {
  // domain: "DSM/contact/accept\0"
  bytes accepter_device_id = 1 [(dsm_fixed_len)=32];
  bytes add_digest         = 2 [(dsm_fixed_len)=32];
  bytes local_chain_tip    = 3 [(dsm_fixed_len)=32];
}

// ---------------------------- Token Policies ------------------------------
message TokenPolicyV3 {
  // domain: "DSM/policy\0"
  bytes policy_bytes = 1 [(dsm_max_len)=65535];
}

message PolicyAnchorV3 {
  // domain: "DSM/policy/anchor\0"
  bytes policy_digest    = 1 [(dsm_fixed_len)=32];
  bytes author_device_id = 2 [(dsm_fixed_len)=32];
  bytes parent_digest    = 3 [(dsm_fixed_len)=32]; // optional, empty allowed
}

// ---------------------------- Token Creation -----------------------------
// Token creation intent. The client sends only what the USER chose; Rust owns
// every protocol decision downstream — it packs the canonical v3 policy blob,
// derives the content-addressed anchor, publishes it, and creates the token in
// one invoke. The client never packs policy bytes and never supplies an anchor
// (a client-named anchor is precisely the value-safety hole closed earlier:
// the anchor becomes the issuance BalanceDelta's policy_commit).
//
//   5 = policy_anchor — removed; Rust derives it from the bytes it packs.
message TokenCreateRequest {
  string ticker = 1; // 2-8 uppercase
  string alias = 2; // display name
  uint32 decimals = 3; // 0..18
  // The whole supply that will ever exist (SoFi §47, §51). User-created
  // tokens in beta release all of it to the creator at creation.
  bytes genesis_supply_u128 = 4 [(dsm_fixed_len)=16]; // big-endian u128, > 0
  reserved 5, 6, 9;
  reserved "policy_anchor", "initial_alloc_u128", "unlimited_supply", "max_supply_u128";

  bool   burn_enabled           = 7;   // governs burns only (§54)
  bool   transferable           = 8;
  // 1..=n. The signer set itself is filled in by Rust (the creating device),
  // never by the client. It authorizes only what the policy's own rules
  // name, and never issuance.
  uint32 threshold              = 10;
  string description            = 11 [(dsm_max_len)=65535];
  string icon_url               = 12 [(dsm_max_len)=65535];
  // Optional inline allowlist of 32-byte device ids.
  repeated bytes allowlist_device_ids = 13 [(dsm_max_len)=32];
}

// Drop a token's IDENTITY from this device. Canonical balances are not
// touched: forgetting is refused unless the balance is zero, because a device
// must not be able to make an asset it holds unnameable.
message TokenForgetRequest {
  string token_id = 1;   // token id or ticker; either names one identity
}
message TokenForgetResponse {
  bool   success  = 1;
  string token_id = 2;
  string message  = 3 [(dsm_max_len)=1024];
}

// Burn supply the caller holds. Burn ≤ balance is enforced by the conservation
// guard's checked_sub on every advance.
message TokenBurnRequest {
  string token_id  = 1;
  uint64 amount    = 2;
  string message   = 3 [(dsm_max_len)=1024];
}
message TokenBurnResponse {
  bool   success   = 1;
  string token_id  = 2;
  uint64 new_balance = 3;
  string message   = 4;
}

// Authoritative fee schedule. The UI DISPLAYS these values; it never computes
// or assumes them, and it cannot change what is charged — the conservation
// guard validates the fee against a core constant.
message TokenFeeScheduleResponse {
  uint64 token_creation_era = 1;
}

// The payload inside a token-adoption QR, and the reply that carries it.
//
// A peer adopting a token needs the canonical raw anchor. Encoding the anchor
// alone leaves the scanner nothing to check it against, so the payload also
// names the ticker and token id the anchor is expected to resolve to, and the
// adopting device refuses a payload whose claims disagree with the policy it
// actually fetches. The QR is a convenience; the anchor remains the authority.
message TokenAdoptionQrV1 {
  bytes  policy_anchor = 1 [(dsm_fixed_len)=32];
  string ticker        = 2;
  string token_id      = 3;
}

// Reply to `token.adoptionQr`. `uri` is the complete `dsm:token/v1:{base32}`
// string, assembled in Rust so the framing has exactly one implementation.
message TokenAdoptionQrResponse {
  string uri                = 1;
  string ticker             = 2;
  string token_id           = 3;
  string policy_anchor_b32  = 4;
  string anchor_fingerprint = 5;
}

message TokenCreateResponse {
  bool success = 1;
  string token_id = 2; // deterministic token id
  bytes policy_anchor = 3 [(dsm_fixed_len)=32];
  string message = 4;
  string ticker = 5; // the token's ticker as its policy names it
}

// ------------------------- DLV Lifecycle Objects --------------------------
// Device-neutral vault template. The creator-signed binding of a spec is
// LimboVault.parameters_hash (creator key, vault id, reference state,
// fulfillment, recipient, content commitment, DLV-policy digest); there is
// no separate spec_id — the derivation once described here was never
// implemented and is not a link in any authority chain.

// Anchor enforcement posture for an AMM vault.
//
// REQUIRED: every routed unlock against this vault MUST carry
//   `(vault_state_anchor_seq, vault_state_reserves_digest,
//   vault_state_anchor_digest)` on its `RouteCommitHopV1`.  The
//   chunks #7 gate verifies these against the vault's local
//   `DLVManager` state (NOT against storage).  Missing fields or
//   mismatch ⇒ typed reject.
//
// OPTIONAL: anchor fields are accepted if present but not required.
//   When absent, gate falls through to the existing reserves-value
//   check.  The unlock response surfaces a flag indicating identity-
//   binding was not enforced.
//
// UNSPECIFIED: grandfathered behaviour for vaults predating Tier 2
//   Foundation.  Treated as OPTIONAL by the gate.  New vaults SHOULD
//   set REQUIRED.
enum AnchorEnforcement {
  ANCHOR_ENFORCEMENT_UNSPECIFIED = 0;
  ANCHOR_ENFORCEMENT_OPTIONAL    = 1;
  ANCHOR_ENFORCEMENT_REQUIRED    = 2;
}

message DlvSpecV1 {
  // The DLV-POLICY digest, NOT a CPTA anchor: the vault's own behavioural-
  // policy identity, distinct from the two token policies the AMM predicate
  // names. For an AMM DLV it is DERIVED by dlv.create:
  // BLAKE3("DSM/dlv-policy-digest", CCB(ReleasePolicy) || CCB(FeePolicy)).
  // Leave it EMPTY for AMM creation; a supplied value that is not the derivation
  // is refused. For non-AMM DLVs there is no ReleasePolicy/FeePolicy object, so
  // the supplied 32-byte digest remains caller-supplied but creator-signed.
  // That non-AMM meaning is follow-up semantic debt.
  bytes policy_digest       = 1 [(dsm_fixed_len)=32];
  bytes content_digest      = 2 [(dsm_fixed_len)=32];  // H("DSM/dlv-content", content)
  bytes fulfillment_digest  = 3 [(dsm_fixed_len)=32];  // H("DSM/dlv-fulfillment", fulfillment_bytes)
  bytes intended_recipient  = 4 [(dsm_max_len)=1568];  // Kyber pk, optional (empty = self-encrypted)
  bytes fulfillment_bytes   = 5 [(dsm_max_len)=65535]; // canonical FulfillmentMechanism proto
  bytes content             = 6 [(dsm_max_len)=65535]; // plaintext for local; sender-encrypted for posted
  AnchorEnforcement anchor_enforcement = 7;
}

// Instance creation.  Carries everything Operation::DlvCreate needs.
// The creator's chain_tip enters via execute_on_relationship, not this proto.
// One asset to encumber. Amounts are u64 base units, matching
// `DeviceState::balances` — a u128 here would put a narrowing conversion at the
// settlement boundary, which is where a silent truncation mints money.
message DlvFundingLegV1 {
  // 32-byte CPTA policy commit — the asset's IDENTITY, not its ticker.
  //
  // This carried a UTF-8 ticker that `dlv.create` resolved to a commit via the
  // local registry. That resolution is the ambiguity: a ticker can name more
  // than one token (two distinct RIGB tokens have existed here), so the lookup
  // could encumber a different asset than the caller meant while every
  // downstream signature still verified. There is no fallback — a caller that
  // does not know the commit does not know which asset it is funding.
  bytes  policy_commit = 1 [(dsm_fixed_len)=32];
  uint64 amount        = 2;
}

message DlvInstantiateV1 {
  DlvSpecV1 spec            = 1;
  bytes creator_public_key  = 2 [(dsm_max_len)=65535]; // SPHINCS+ pk
  reserved 3, 4;                                       // single-asset token_id + locked_amount_u128
  reserved "token_id", "locked_amount_u128";
  bytes signature           = 5 [(dsm_max_len)=65535]; // SPHINCS+ over canonical Operation::DlvCreate bytes
  // Assets to encumber into this vault. Zero legs = a content-only vault. An
  // AMM vault MUST carry exactly two, whose token ids are the spec's pair in
  // lex order and whose amounts are both non-zero — the single-asset lock this
  // replaces could not express a two-sided vault at all, which is why AMM
  // vaults were created holding nothing.
  repeated DlvFundingLegV1 funding_legs = 6;
}

message DlvOpenV3 {
  // domain: "DSM/dlv/open\0"
  bytes device_id       = 1 [(dsm_fixed_len)=32];
  bytes vault_id        = 2 [(dsm_fixed_len)=32];
  bytes reveal_material = 3 [(dsm_max_len)=65535];
}

// Whether a vault's birth publication set has reached quorum on its birth
// storage set (see `AmmVaultSummaryV1.publication_state`).
enum VaultPublicationState {
  VAULT_PUBLICATION_STATE_UNSPECIFIED = 0;
  // Frozen in the funding transaction; not every birth object has reached
  // quorum yet. Not market-active.
  VAULT_PUBLICATION_STATE_PENDING     = 1;
  // Every birth object accepted by a quorum of the vault's birth storage set.
  VAULT_PUBLICATION_STATE_PUBLISHED   = 2;
}

// Per-vault signed state anchor.  Owner publishes one at vault
// creation (sequence=0) and one after every accepted routed unlock
// (sequence=N+1).  Stored at `sofi/vault-state/{vault_id_b32}/latest`
// for off-device traders to read at quote time.  The chunks #7 gate
// does NOT read this — it verifies against the local DLVManager.
//
// `reserves_digest` =
//   BLAKE3("DSM/amm-reserves\0" || token_a || token_b ||
//          reserve_a_u128_be || reserve_b_u128_be || fee_bps_be)
//
// `owner_signature` is SPHINCS+ over
//   BLAKE3("DSM/vault-state-anchor\0" || vault_id || sequence_be ||
//          reserves_digest)
// VaultStateAnchorV1 is DELETED by the state-identity cut. The message name
// is burned and never reused; no implementation decodes it. Its replacement
// is AnchorPresentationV3 below — the anchor signs c_n and nothing else, and
// every fact the V1 anchor restated (sequence, reserves digest, storage set)
// is a field of the V_n that c_n identifies.

// One signed root-progression object as it travels: the CCB bytes (class
// 0x0019 or 0x001A) plus the signature that is NEVER a CCB field (§2.9).
message SignedAuthorityObjectV1 {
  bytes ccb       = 1 [(dsm_max_len)=4096];
  bytes signature = 2 [(dsm_max_len)=65535]; // SPHINCS+ SPX256f
}

// Step 2: the 0x0029 (AuthorizedIssuance) evidence bundle — transport proto,
// no CCB class, frozen at `issuance_authorization_addr` under namespace
// DSM/issuance-authorization-evidence/v1.
//
// It CARRIES the canonical policy bytes rather than addressing them, because
// the policy commit IS their content hash (policy_anchor =
// H(DSM/policy, TokenPolicyV3 bytes)) — so a verifier re-hashes what it was
// given against a commit the OPERATION names, and needs nothing fetched.
// Addressing them instead would make issuance depend on mutable availability:
// token.create warns and proceeds when the policy reaches ZERO storage nodes,
// so a fetch-only design would fail closed on honest tokens.
//
// The signatures live HERE and never inside the Mint operation whose digest
// they authorize. Putting them in the operation would have no fixed point:
// the signature would change the operation digest that the signed body
// commits to.
message PolicySignerSignatureV1 {
  bytes signer_public_key = 1 [(dsm_max_len)=65535];
  bytes signature         = 2 [(dsm_max_len)=65535];
}

message IssuanceAuthorizationEvidenceV1 {
  // Exact TokenPolicyV3 bytes; must re-hash to the operation's policy_commit.
  bytes canonical_policy_bytes = 1 [(dsm_max_len)=65535];
  // Exact CCB of the 0x0029 IssuanceAuthorizationBody the signers signed.
  bytes authorization_body_ccb = 2 [(dsm_max_len)=4096];
  // k-of-N: keys are MATCHED against the policy's signer set, never trusted
  // from here.
  repeated PolicySignerSignatureV1 signatures = 3;
}

message AuthorityEvidenceV1 {
  bytes  genesis_params_ccb   = 1 [(dsm_max_len)=4096];   // class 0x0018
  repeated SignedAuthorityObjectV1 delegations = 2;        // class 0x0019 + GRK sig
  repeated SignedAuthorityObjectV1 transitions = 3;        // class 0x001A + delegate sig
  bytes  inclusion_proof      = 4 [(dsm_max_len)=16384];   // DevTreeProof::to_bytes
  bytes  ak_public_key        = 5 [(dsm_max_len)=65535];
  bytes  atta                 = 6 [(dsm_fixed_len)=32];
}

// Replayable accepted-successor evidence for ECONOMIC lineage validation —
// the manifest's `dsm_successor_evidence_addr` points at the exact bytes of
// this object (namespace DSM/economic-dsm-successor-evidence/v1). Carries the
// BALANCE-FREE v2 chain-tip preimage fields (succession facts only — R_econ
// is the sole authenticated balance representation), the resulting C_dsm+,
// and sigma_dsm: the owner-AK signature over
// H(DSM/economic-substrate-sign/v1, G ‖ DevID ‖ C_dsm+ ‖ operation_digest).
// A foreign verifier recomputes C_dsm+ from the preimage, recomputes the
// operation digest from the embedded operation bytes, and checks sigma_dsm
// under the P0-P6-proven AK — "this identity accepted this successor
// carrying this operation" becomes checkable, not asserted.
// One per-device per-step EK certificate step, content-addressed by its
// PREDECESSOR (namespace DSM/ek-cert-step/v1). Certificate ancestry follows
// the SIGNER (the device, within a relationship), not the A/B role of any
// one receipt: role reversal and BLE steps both advance the same device
// chain, so the acceptance bundle references each side's predecessor by
// signer identity through these objects. `prior_step_addr` absent means
// relationship genesis: the expected certifying key is the signer's
// P0-P6-proven AK.
message EkCertStepV1 {
  bytes  ek_pk           = 1 [(dsm_max_len)=65535];
  bytes  ek_cert         = 2 [(dsm_max_len)=65535]; // Sign(prev, H(TAG_DSM_EK_CERT, ek_pk ‖ h_n))
  bytes  h_n             = 3 [(dsm_fixed_len)=32];
  optional bytes prior_step_addr = 4 [(dsm_fixed_len)=32];
}

// Portable bilateral-acceptance evidence for a peer-funded economic credit —
// what `CreditSourceValidatedPeerDebit.acceptance_evidence_addr` names
// (namespace DSM/peer-transfer-acceptance/v1). The recipient-produced
// countersignature is the acceptance FACT; the A-side material alone is a
// proposal. Each side's EK certificate ancestry is referenced through
// EkCertStepV1 predecessors (by signer, see above).
message PeerTransferAcceptanceEvidenceV1 {
  bytes transfer_request_bytes      = 1 [(dsm_max_len)=262144]; // exact OnlineTransferRequest
  bytes receipt_evidence_a_bytes    = 2 [(dsm_max_len)=262144]; // exact full ReceiptCommit wire
  bytes receipt_countersign_b_bytes = 3 [(dsm_max_len)=262144]; // exact ReceiptCountersignB wire
  optional bytes a_prior_step_addr  = 4 [(dsm_fixed_len)=32];   // sender EK ancestry
  optional bytes b_prior_step_addr  = 5 [(dsm_fixed_len)=32];   // recipient EK ancestry
}

// The recipient's post-admission RELEASE — the TRANSPORT-ONLY finalization
// authority (3.5b PR4; no CCB class). `sig_b` inside the published acceptance
// bundle is acceptance PROVENANCE and becomes discoverable when the evidence
// DAG publishes, BEFORE ECON_ADMITTED — so bare sig_b is insufficient to
// finalize the sender. The release exists only once the recipient's credit is
// admitted into validated R_econ: it is constructed and frozen in the accept
// transaction (every field is an output of the build), HELD, and promoted to
// deliverable in the SAME terminal transaction that records ECON_ADMITTED.
// Sender finalization requires this release AND an independent quorum read of
// the recipient's register cell at the named position (post-root + manifest
// address must match) — never the recipient's private "admitted" flag.
message RecipientEconomicReleaseBodyV1 {
  bytes  receipt_commitment          = 1 [(dsm_fixed_len)=32];
  bytes  acceptance_evidence_addr    = 2 [(dsm_fixed_len)=32];
  bytes  recipient_genesis           = 3 [(dsm_fixed_len)=32];
  bytes  recipient_devid             = 4 [(dsm_fixed_len)=32];
  uint64 recipient_economic_position = 5;
  bytes  post_economic_root          = 6 [(dsm_fixed_len)=32];
  bytes  admission_manifest_addr     = 7 [(dsm_fixed_len)=32];
}

message RecipientEconomicReleaseV1 {
  bytes body                = 1 [(dsm_max_len)=4096];  // exact encoded body (sign target)
  bytes recipient_signature = 2 [(dsm_max_len)=65535]; // SPX256f over H(release-sign-tag, body)
}

message DsmSuccessorEvidenceV1 {
  bytes  rel_key              = 1 [(dsm_fixed_len)=32];
  bytes  embedded_parent      = 2 [(dsm_fixed_len)=32];
  bytes  counterparty_devid   = 3 [(dsm_fixed_len)=32];
  bytes  operation_bytes      = 4 [(dsm_max_len)=1048576]; // Operation::to_bytes (canonical)
  bytes  entropy              = 5 [(dsm_max_len)=65535];
  optional bytes encapsulated_entropy = 6 [(dsm_max_len)=65535];
  bytes  c_dsm_plus           = 7 [(dsm_fixed_len)=32];
  bytes  sigma_dsm            = 8 [(dsm_max_len)=65535];   // SPX256f under the owner AK
}

message AnchorPresentationV3 {
  bytes  state_commitment       = 1 [(dsm_fixed_len)=32];  // c_n
  bytes  candidate_public_key   = 2 [(dsm_max_len)=65535];
  bytes  anchor_signature       = 3 [(dsm_max_len)=65535]; // over H(DSM/vault-state-anchor/v3 ‖ c_n)
  bytes  genesis_params_ccb     = 4 [(dsm_max_len)=4096];  // class 0x0018
  repeated SignedAuthorityObjectV1 delegations = 5;         // class 0x0019, chain order
  repeated SignedAuthorityObjectV1 transitions = 6;         // class 0x001A, chain order
  bytes  inclusion_proof        = 7 [(dsm_max_len)=16384];  // DevTreeProof::to_bytes
  bytes  ak_public_key          = 8 [(dsm_max_len)=65535];
  bytes  atta                   = 9 [(dsm_fixed_len)=32];
}

// Request wrapper for `route.publishExternalCommitment`. The handler
// accepts either this wrapper OR a bare ExternalCommitmentV1 (legacy
// callers). When `signed_route_commit_bytes` is non-empty, the handler
// additionally derives and publishes one VaultPendingPointerV1 per hop
// (composition discovery aid; see VaultPendingPointerV1 docs).
//
// Decode discriminator: try this wrapper first; if it fails to decode
// or `anchor` is unset, fall back to decoding the body as bare
// ExternalCommitmentV1. This keeps the old wire shape working for any
// non-SoFi external-commitment users.
// REMOVED: PublishExternalCommitmentRequest.
//
// It existed so a caller could hand `route.publishExternalCommitment` the
// signed RouteCommit and have pending pointers published alongside the anchor.
// That put protocol state in the caller's hands, and it made pointers
// conditional: with the bytes absent the route published the anchor alone and
// still reported success, so a trader could anchor a commitment that could
// never settle. On hardware that is exactly what happened — the frontend sent
// the bare anchor, no pointer was ever written, and settlement failed at the
// slot claim.
//
// `route.signRouteCommit` retains the signed RouteCommit in Rust against its
// own X, and `route.publishExternalCommitment` resolves it there. The request
// is a bare ExternalCommitmentV1 and pointer publication is mandatory.

// Def 6.14's SettlementBundle has NO proto form. It is the CCB object 0x000E
// (`dsm::ccb::settlement`), encoded by the frozen canonical encoder and hashed
// as b = H(DSM/settlement-bundle || CCB(B)) — registry §2.10, amendment 2c-A.1.

// A trader's claim on one cell of the economic root register: the write-once
// value at K_root = H("DSM/trader-economic-root-register-key/v1" || 0x00 || G
// || DevID || u64_be(economic_position)).
//
// Registering establishes NON-EQUIVOCATION and nothing else: this identity
// named one root at this position and can never name a second. It does NOT
// establish that the root resulted from a valid transition — a malicious
// trader registers an arbitrary root perfectly consistently. accepted_root is
// not valid_root, and nodes never judge which it is.
//
// The body travels as its EXACT CCB bytes (object class 0x001B, schema 1),
// NOT as a nested proto mirror. Canonicalization for the body already exists
// and is what the signature covers; a proto mirror would be a second canonical
// form of one object, and the two could disagree. So this envelope is a
// carrier, not a re-description.
//
// The signature covers the BODY only (you cannot sign bytes containing the
// signature): SPHINCS+(sk, BLAKE3("DSM/economic-root-claim-sign/v1" || 0x00 ||
// body_ccb)). Members verify claimant ATTRIBUTION only — the body's
// claimant_public_key must be the authenticated caller's device key, the
// body's trader_devid must be the caller's device, the signature must verify,
// and the body's storage_set_id must be this member's own set. Attribution is
// not politeness: the register is write-once, so without it anyone could
// preempt a victim's next position and permanently burn it.
//
// Strict: decode -> re-encode equality. The client encodes ONCE and retains
// the exact envelope bytes for every retry, because a byte-different re-encode
// is a different value at a write-once cell.
message EconomicRootClaimV1 {
  bytes body_ccb           = 1 [(dsm_max_len)=65535];
  bytes claimant_signature = 2 [(dsm_max_len)=65535];
}

// A release from the network's ONE canonical native ERA reserve (Part IX
// §51: fixed genesis supply, emission is release, no minting after genesis).
//
// The reserve is a state lineage: R_0 is the genesis state (the whole
// distributable supply, generation 0) and every release is the successor
// object at the cell K(reserve_id, parent_root) — leader first over the
// committed set, first recognized occupant wins, Final once the leader and
// two other members hold it. Core recomputes the successor state from the
// bytes: remaining' = remaining − amount, generation' = generation + 1. A
// release that does not fit its parent (wrong root, wrong generation, zero,
// more than remains) is not an object naming the cell and counts as nothing.
//
// The body names its recipient directly. Under `faucet_claimant` the
// recipient IS the claimant: the signature over the body under
// `claimant_public_key` is the whole source of the release, and the verifier
// checks that key is the recipient's proven AK. `claimant_att_a` is the
// recipient device's birth attestation digest: the recognizer at the reserve
// cell requires `derive_devid(claimant_public_key, claimant_att_a) ==
// recipient_devid`, so only the device the release names can sign one that
// occupies a cell — decided from the bytes, never by a fetch (owner ruling
// 2026-09-25). It binds the key to the DEVICE; that the device belongs to
// `recipient_genesis` is P0-P6's question, answered when a credit consumes it. Other sources (an emission
// lottery, later) add arms to `source`; the reserve mechanics do not change.
//
// Signature covers the BODY only:
// SPHINCS+(sk, BLAKE3("DSM/native-reserve-release-sign/v1" || 0x00 ||
// canonical_body_bytes)). Strict: decode -> re-encode equality; the client
// signs ONCE per parent root and replays the exact bytes on every retry.
message FaucetClaimantRecipientV1 {
  bytes claimant_public_key = 1 [(dsm_max_len)=65535];
  bytes claimant_att_a      = 2 [(dsm_fixed_len)=32];
}

message NativeReserveReleaseBodyV1 {
  bytes  reserve_id                  = 1 [(dsm_fixed_len)=32];
  bytes  parent_root                 = 2 [(dsm_fixed_len)=32];
  uint64 generation                  = 3;
  uint64 amount                      = 4;
  bytes  recipient_genesis           = 5 [(dsm_fixed_len)=32];
  bytes  recipient_devid             = 6 [(dsm_fixed_len)=32];
  uint64 recipient_economic_position = 7;
  bytes  recipient_operation_digest  = 8 [(dsm_fixed_len)=32];
  bytes  storage_set_id              = 9 [(dsm_fixed_len)=32];
  oneof source {
    FaucetClaimantRecipientV1 faucet_claimant = 10;
  }
}

message NativeReserveReleaseV1 {
  NativeReserveReleaseBodyV1 body = 1;
  bytes signature                  = 2 [(dsm_max_len)=65535];
}

// Storage-node-mirrored advertisement for a SoFi routing vault.
//
// Keyed under `sofi/vault/{token_a_b32}/{token_b_b32}/{vault_id_b32}` —
// PUBLIC discovery by ordered token pair, no recipient scoping.  The
// router enumerates all vaults matching `(tokenA, tokenB)` (or its
// reverse, in which case reserves swap roles) and feeds the result
// into a fee-weighted Dijkstra over the resulting liquidity graph
// (SoFi spec §3.3, §8.3).
//
// Storage nodes are dumb mirrors.  Authenticity for routing purposes
// is rooted in `vault_proto_digest` binding the ad to a full vault
// proto under `sofi/vault-proto/{..}/{..}` — exactly the same pattern
// as DbtcVaultAdvertisementV1 and PostedDlvAdvertisementV1, mounted
// in a different keyspace.
//
// Token-pair canonicalisation: `token_a` and `token_b` are the
// LEXICOGRAPHICALLY LOWER and HIGHER token-id bytes respectively.
// Reserves are reported in the matching order (reserve_a is the
// reserve of token_a).  This collapses the "A→B" and "B→A" entries
// for a single vault into one canonical advertisement; the router
// flips reserve roles based on the requested trade direction.
message RoutingVaultAdvertisementV1 {
  uint32 version                 = 1;
  bytes  vault_id                = 2 [(dsm_fixed_len)=32];
  // 32-byte policy commits. The storage prefix is built from these, so pair
  // identity IS the discovery index — a label here would collide two markets.
  bytes  token_a                 = 3 [(dsm_fixed_len)=32];  // lex-lower policy commit
  bytes  token_b                 = 4 [(dsm_fixed_len)=32];  // lex-higher policy commit
  reserved 5, 6;                                          // were big-endian u128 reserves
  reserved "reserve_a_u128", "reserve_b_u128";
  // Advertised reserves in u64 base units, sourced from the owner's encumbered
  // reserve leaves — never from a caller-supplied number.
  uint64 reserve_a               = 17;
  uint64 reserve_b               = 18;
  // Fee in basis points (e.g. 30 = 0.30 %).  Full-fixed integer keeps
  // the routing graph weights deterministic and clockless.
  uint32 fee_bps                 = 7;
  // The AMM DLV-policy digest, echoed from the vault record (which holds the
  // value dlv.create derived and the creator signed). The publisher fills it
  // from the record; a caller may leave it empty or repeat the record's value,
  // never choose one. Not a CPTA anchor.
  bytes  unlock_spec_digest      = 8 [(dsm_fixed_len)=32];
  string unlock_spec_key         = 9;
  bytes  vault_proto_key         = 10; // not [(dsm_fixed_len)] — string blob
  bytes  vault_proto_digest      = 11 [(dsm_fixed_len)=32]; // BLAKE3("DSM/routing-vault-ad", proto_bytes)
  // Vault owner's SPHINCS+ pk.  Used by the router to compute the
  // expected per-hop unlock receipt commit; not used for ad
  // authenticity (see vault_proto_digest above).
  bytes  owner_public_key        = 12 [(dsm_max_len)=65535];
  string lifecycle_state         = 13; // "active" | "exhausted" | "withdrawn"
  uint64 updated_state_number    = 14; // dedup signal; matches dBTC + posted-dlv pattern
  // Inner digest of the owner's published `AnchorPresentationV3`
  // (`H(DSM/anchor-presentation/v1 ‖ proto_bytes)`). DISCOVERY ONLY: the ad
  // locates the presentation; the presentation authenticates itself through
  // P0–P6 and the c_n it carries resolves the exact `CCB(V_n)` bytes. A
  // trader quotes against NOTHING from this ad — reserves here are hints.
  bytes  anchor_presentation_digest = 19 [(dsm_fixed_len)=32];
  // The vault's IMMUTABLE birth anchor (amendment 2c-G, G3 blocker ruling):
  // the inner digest of the AnchorPresentationV3 its birth published. Set
  // once, never moved. Discovery metadata, not authority: the historical
  // fallback a verifier composes from when the current anchor (field 19) is
  // newer than the generation it must reconstruct. The verifier still
  // authenticates the anchor and refuses one that is not a birth state.
  bytes  birth_anchor_presentation_digest = 20 [(dsm_fixed_len)=32];
  // WHERE THE OWNER'S RESERVE PROOF LIVES: the content address of the
  // `EconomicProofArtifactV1` published by the admission that wrote this
  // vault's reserve leaves, and the economic position whose registered root
  // it names.
  //
  // A LOCATOR, on an ad that authenticates nothing and is unsigned. A reader
  // resolves the position's root from the owner's own write-once register
  // cell and re-derives every inclusion path against it, so a wrong address
  // or position here can only make the lookup FAIL — never succeed against a
  // root the owner did not register — and the reserve amounts it yields are
  // re-checked against the composed `V_n` afterwards.
  bytes  economic_proof_addr      = 15 [(dsm_fixed_len)=32];
  uint64 economic_proof_position  = 16;
}

// =================== UNIVERSAL ARG/RESULT PACKS =====================
enum Codec { CODEC_UNSPECIFIED = 0; CODEC_PROTO = 1; }   // canonical: PROTO only
// No artifact body may exceed the storage node's 128 KiB envelope cap; the largest
// b0x carriers are the ADR 0003 A-side evidence (~118 KB) and the B-side
// countersign delta (~101 KB). A full countersigned StitchedReceiptV2 (~218 KB)
// never rides in a body — that is exactly the shape ADR 0003 split.
message ArgPack    { Hash32 schema_hash = 1; Codec codec = 2; bytes body = 3 [(dsm_max_len)=131072]; }
message ResultPack { Hash32 schema_hash = 1; Codec codec = 2; bytes body = 3 [(dsm_max_len)=65535]; }

// ============================ KV (binary) ===========================
message KvGetRequest  { bytes key = 1 [(dsm_max_len)=1024]; }
message KvGetResponse { bool found = 1; bytes value = 2 [(dsm_max_len)=65535]; }
message KvSetRequest  { bytes key = 1 [(dsm_max_len)=1024]; bytes value = 2 [(dsm_max_len)=65535]; }
message KvSetResponse { bool ok = 1; }

// =================== App State (non-canonical/local) =================
message AppStateRequest  { string key = 1; string operation = 2; string value = 3; }
message AppStateResponse { string key = 1; optional string value = 2; }

// Native-owned runtime snapshot pushed into the WebView as a protobuf event.
message AppSessionLockStatusProto {
  bool enabled = 1;
  bool locked = 2;
  string method = 3;
  bool lock_on_pause = 4;
}

message AppSessionBleHardwareStatusProto {
  bool enabled = 1;
  bool permissions_granted = 2;
  bool scanning = 3;
  bool advertising = 4;
}

message AppSessionQrHardwareStatusProto {
  bool available = 1;
  bool active = 2;
  bool camera_permission = 3;
}

message AppSessionBatteryHardwareStatusProto {
  bool charging = 1;
  uint32 level_percent = 2;
}

message AppSessionHardwareStatusProto {
  bool app_foreground = 1;
  AppSessionBleHardwareStatusProto ble = 2;
  AppSessionQrHardwareStatusProto qr = 3;
  AppSessionBatteryHardwareStatusProto battery = 4;
}

message AppSessionStateProto {
  string phase = 1;
  string identity_status = 2;
  string env_config_status = 3;
  AppSessionLockStatusProto lock_status = 4;
  AppSessionHardwareStatusProto hardware_status = 5;
  string fatal_error = 6;
  uint64 wallet_refresh_hint = 7;
}

// Kotlin → Rust: hardware facts subset sent via JNI.
// Kotlin is the sole producer; Rust decodes and folds into SessionManager.
message SessionHardwareFactsProto {
  bool app_foreground = 1;
  bool ble_enabled = 2;
  bool ble_permissions = 3;
  bool ble_scanning = 4;
  bool ble_advertising = 5;
  bool qr_available = 6;
  bool qr_active = 7;
  bool camera_permission = 8;
  bool battery_charging = 9;
  uint32 battery_level_percent = 10;
}

// Frontend -> Rust: lock policy configuration. Secret verification remains app-local.
message SessionConfigureLockRequest {
  bool enabled = 1;
  string method = 2;
  bool lock_on_pause = 3;
}

// State introspection summary (QueryOp: state.info)
message StateInfoResponse {
  bool has_genesis = 1;
  bool has_wallet = 2;
  uint64 contacts_count = 3;
  uint64 transactions_count = 4;
  uint64 preferences_count = 5;
}

// Non-hashed, device-local storage (maps allowed: not part of canonical commitments).
message AppStateStorage {
  bool has_identity = 1;
  bool sdk_initialized = 2;
  optional bytes device_id = 3 [(dsm_fixed_len)=32];   // Canonical 32-byte device identifier
  optional bytes public_key = 4 [(dsm_max_len)=512];
  optional bytes genesis_hash = 5 [(dsm_fixed_len)=32];
  optional bytes smt_root = 6 [(dsm_fixed_len)=32];
  map<string,string> recovery_sessions = 7;
  map<string,string> key_value_store   = 8;
  
  // (§2.3.1) Device Tree root R_G — current concrete authenticated commitment
  // used for receipt paths that verify π_dev: DevID ∈ R_G.
  // Computed at genesis via: R_G = DeviceTree::single(device_id).root()
  // Persisted IMMEDIATELY after genesis, device addition, or recovery.
  // If None: build_bilateral_receipt_with_smt() → None → proof_data=None → the affected
  // receipt path rejects during settlement.
  // INVARIANT: any local acceptance path carrying π_dev must have R_G or an equivalent
  // authenticated persisted device-tree commitment available.
  optional bytes device_tree_root = 9 [(dsm_fixed_len)=32];
  
  // (§2.3.1) Contact-side authenticated device-tree commitments — indexed by contact
  // device_id (base32 Crockford). Used during bilateral settlement to verify
  // counterparty receipt proofs relationship-locally.
  // Each device maintains its own unique R_G; devices do not share roots.
  map<string, bytes> contact_device_tree_roots = 10;
}

// Binary serialization for sensitive app data (replaces manual length-prefixed format).
message SensitiveAppDataProto {
  bytes device_id = 1 [(dsm_fixed_len)=32];
  bytes public_key = 2 [(dsm_max_len)=512];
  bytes genesis_hash = 3 [(dsm_fixed_len)=32];
  bytes smt_root = 4 [(dsm_fixed_len)=32];
}

// =================== Canonical State & Transition ===================
message TokenBalanceEntry { string token_id = 1; U128 amount = 2; } // ordered lexicographically by token_id

message StateWire {
  uint64 state_number     = 1;
  bytes  prev_state_hash  = 2 [(dsm_fixed_len)=32];
  repeated TokenBalanceEntry token_balances = 3;
  string operation        = 4;
  bytes  device_id        = 5 [(dsm_fixed_len)=32];
}

message BalanceDeltaEntry { string token_id = 1; S128 delta = 2; } // ordered by token_id

message StateTransitionProto {
  bytes  device_id           = 1 [(dsm_fixed_len)=32];
  bytes  counterparty_id     = 2 [(dsm_fixed_len)=32];
  string bilateral_chain_id  = 3;
  bytes  prev_state_hash     = 4 [(dsm_fixed_len)=32];
  bytes  new_state_hash      = 5 [(dsm_fixed_len)=32];
  uint64 state_number        = 6;
  string operation           = 7;
  repeated BalanceDeltaEntry balance_delta = 8;
  bytes  signature           = 9 [(dsm_max_len)=65535];
  string transaction_direction = 10;
}

// Deterministic params (no maps in canonical preimages).
message ParamKV { string key = 1; string value = 2; }
message TransactionParamsProto { repeated ParamKV kv = 1; } // sorted by key before hashing

// Canonical token metadata.
message MetadataField { string key = 1; string value = 2; }
message TokenMetadataProto {
  string token_id = 1;
  string name     = 2;
  string symbol   = 3;
  uint32 decimals = 4;
  string token_type = 5;
  string owner_id   = 6;
  optional string metadata_uri = 7;
  optional string description  = 8;
  optional string icon_url     = 9;
  optional string policy_anchor= 10;
  repeated MetadataField fields= 11;
  reserved 12;
  reserved "creation_index";
}

// Canonical mnemonic-rooted Genesis v2 wallet-creation request (system.createGenesisV2).
// The BIP39 mnemonic is the sole root: the SDK derives wallet_seed, caches it in the unlocked
// session, and runs create_genesis_v2 (no storage nodes, no silicon, no random genesis entropy).
message WalletCreateGenesisV2Request {
  string mnemonic   = 1;
  // 2 was a locale nothing consumed; Rust echoed it back.
  reserved 2;
  reserved "locale";
  // The network is the one this build's root register is pinned for, never
  // the caller's choice.
  reserved 3;
  reserved "network_id";
}
message GenesisCreated {
  bytes  device_id     = 1 [(dsm_fixed_len)=32];
  Hash32 genesis_hash  = 2;
  bytes  public_key    = 3 [(dsm_max_len)=512];
  Hash32 smt_root      = 4;
  bytes  genesis_nonce = 5 [(dsm_fixed_len)=32]; // the PUBLIC nonce G commits
  reserved 6, 7, 8;
  reserved "session_id", "threshold", "storage_nodes";
  string network_id    = 9;
  reserved 10;
  reserved "locale";
}

// Additional-device admission (§16.3). Gate-only, two-signature, co-present. An already-authorized
// device admits a new device into an EXISTING genesis Device Tree by signing this with its NORMAL
// device signing key (the gate — only a key already in the tree can authorize the insert). The new
// device co-signs with its own Genesis v2 device signing key (AK, rooted in the device's wallet
// seed) to prove possession of that key. The gate signer's pubkey comes from
// the QR the new device scanned (co-present) — NOT a storage-node quorum or any external verifier.
// Verifier: (a) signer_device_id is in the CURRENT tree (root case signer_device_id==genesis_hash);
// (b) signature_by_signer_device verifies under the scanned-QR signer pubkey; (c)
// signature_by_new_device verifies under new_device_signing_pubkey; (d) parent root/version match
// the current accepted frontier; (e) inserting new_device_id yields the next root. Replay is
// prevented by the monotonic version (an admission only applies at the frontier it was signed for).
message AddDeviceAdmissionV1 {
  bytes  genesis_hash               = 1 [(dsm_fixed_len)=32];
  bytes  signer_device_id           = 2 [(dsm_fixed_len)=32];
  bytes  new_device_id              = 3 [(dsm_fixed_len)=32];
  bytes  new_device_signing_pubkey  = 4 [(dsm_max_len)=4096];  // new device SPHINCS+ signing pubkey
  bytes  parent_device_tree_root    = 5 [(dsm_fixed_len)=32];
  uint64 parent_device_tree_version = 6;
  bytes  signature_by_signer_device = 7 [(dsm_max_len)=65535]; // existing device — the gate
  bytes  signature_by_new_device    = 8 [(dsm_max_len)=65535]; // new device — Genesis v2 AK possession
}

// The new (joining) device's half of an admission, sent to the existing authorized device over the
// co-present BLE link. The existing device verifies the self-attestation, then gate-signs an
// AddDeviceAdmissionV1 and inserts. (genesis_hash comes from the existing device's QR the new
// device scanned.)
message AddDeviceAdmissionRequestV1 {
  bytes genesis_hash              = 1 [(dsm_fixed_len)=32];
  bytes new_device_id             = 2 [(dsm_fixed_len)=32];
  bytes new_device_signing_pubkey = 3 [(dsm_max_len)=4096];
  bytes signature_by_new_device   = 4 [(dsm_max_len)=65535]; // Genesis v2 AK self-attestation
}

// ============================ AUTH / REGISTRATION ==========================
// Device registration request/response for storage node authentication.
// Binary-only: raw 32-byte identifiers, no text encoding on the wire.
message RegisterDeviceRequest {
  bytes device_id    = 1 [(dsm_fixed_len)=32];
  bytes pubkey       = 2 [(dsm_fixed_len)=32];
  bytes genesis_hash = 3 [(dsm_fixed_len)=32];
  // ML-KEM-768 encapsulation public key (the recipient key online per-step-EK
  // sends encapsulate against). MANDATORY — DSM beta has no legacy path; a
  // registration/lookup without it is invalid.
  bytes kyber_public_key  = 4 [(dsm_fixed_len)=1184];
  // SPHINCS+ (device AK) signature binding kyber_public_key to the device
  // identity: sign( domain_hash("DSM/kyber-identity-binding\0",
  //   device_id || genesis_hash || kyber_public_key) ). MANDATORY.
  bytes kyber_binding_sig = 5 [(dsm_max_len)=51200];
}

// ================= Bilateral Operations (binary IDs) =================
message BilateralPrepareRequest {
  bytes  counterparty_device_id = 1 [(dsm_fixed_len)=32];
  bytes  operation_data         = 2 [(dsm_max_len)=4096];
  // A prepare carries no expiry: DSM has no clock to measure one against.
  reserved 3;
  reserved "validity_iterations";
  Hash32 expected_genesis_hash  = 4;
  Hash32 expected_counterparty_state_hash = 5;
  string ble_address            = 6; // BLE MAC address of recipient device
  bytes  sender_signing_public_key = 7 [(dsm_fixed_len)=64]; // Sender's SPHINCS+ SPX256s public key for offline verification
  bytes  sender_device_id       = 8 [(dsm_fixed_len)=32]; // Sender's device ID for relationship binding
  Hash32 sender_genesis_hash    = 9; // Sender's genesis hash for relationship anchor
  // The relationship tip travels once, as expected_counterparty_state_hash.
  reserved 10;
  reserved "sender_chain_tip";
  // Transfer intent fields. Rust builds canonical operation_data from these
  // when operation_data is empty.
  uint64 transfer_amount         = 11; // amount in token base units
  string token_id_hint           = 12; // token ID (e.g. "ERA")
  string memo_hint               = 13; // optional transfer memo
  string transfer_amount_display = 14; // decimal display amount; backend scales via token decimals
  reserved 15; // removed: legacy Safe-7 sender_anchor_identity (fused anchor is pinned out-of-band)
  // Sender's ML-KEM-768 encapsulation key (1184 bytes). The device Kyber keypair is
  // derived from the wallet master secret ("DSM/kyber\0"). The receiver refuses the
  // prepare unless it equals the key pinned on the sender's contact record; nothing
  // sent is stored.
  bytes  sender_kyber_public_key = 16 [(dsm_max_len)=1184];
  // Detached SPHINCS+ (device AK) signature over
  // binding_digest(device_id, genesis, sender_kyber_public_key), per ADR 0002, verified
  // against the PINNED peer AK (never the wire signing key). Required.
  bytes  sender_kyber_binding_sig = 17 [(dsm_max_len)=51200];
  // The proposer's SPHINCS+ signature (σ_A) over
  // "DSM/bilateral-sign\0" || the proposal's commitment, under its pinned AK:
  // the receiver puts to its user only a proposal the sender signed.
  bytes  sender_signature = 18 [(dsm_max_len)=65535];
}
// A -> B, rides BilateralConfirmRequest (Software-Authority / Hardware-Identity receiver-admit).
// A discloses its fused-anchor pin material so B can PIN it under the ALREADY-verified contact,
// bound to THIS transfer's state transition (never a standalone/implicit pin). pk_chip is the
// resident TROPIC01 ECC public key that verifies the release's σ^chip; a disclosure without it is
// rejected (no partial v2 pin).
message AnchorDisclosure {
  bytes  bundle                = 1 [(dsm_fixed_len)=32];
  bytes  anchor_id             = 2 [(dsm_fixed_len)=32];
  uint64 enrolled_counter      = 3;                        // H0
  bytes  partition_pk          = 4 [(dsm_max_len)=4096];
  bytes  policy_hash           = 5 [(dsm_fixed_len)=32];   // policy the anchor is admitted under
  reserved 6, 7, 8; // removed v1 counter-era fields: verifier_slot(+present), chip_static_pubkey
  bytes  pk_chip               = 9 [(dsm_fixed_len)=32];   // resident chip Ed25519 key (σ^chip)
}

message BilateralPrepareResponse {
  Hash32 commitment_hash        = 1;
  bytes  local_signature        = 2 [(dsm_max_len)=65535];
  // A prepare carries no expiry: DSM has no clock to measure one against.
  reserved 3;
  reserved "expires_iterations";
  Hash32 counterparty_state_hash= 4;
  Hash32 local_state_hash       = 5;
  // SPHINCS+ SPX256s public key for bilateral verification (64 bytes)
  // CRITICAL: This allows the sender to update their contact's signing key
  // when receiving the accept response, enabling session registration for future transfers.
  bytes  responder_signing_public_key = 6 [(dsm_fixed_len)=64];
  // Fresh receiver challenge r_R (fused-anchor release binding). The receiver
  // generates this per offline-bearer transfer; it rides the prepare response
  // (which precedes the sender's confirm) so the sender can bind it into the
  // anchor appliance PREPARE. Empty for ordinary (non-bearer) transfers.
  bytes  receiver_challenge = 7 [(dsm_fixed_len)=32];
  reserved 8; // removed v1 counter-era AnchorEnrollRequest (verifier-slot pairing)
  // Responder's ML-KEM-768 encapsulation key (1184 bytes). The sender refuses the
  // response unless it equals the key pinned on the responder's contact record; nothing
  // sent is stored.
  bytes  responder_kyber_public_key = 9 [(dsm_max_len)=1184];
  // Detached SPHINCS+ (device AK) signature over
  // binding_digest(device_id, genesis, responder_kyber_public_key), per ADR 0002, verified
  // against the PINNED peer AK (never the wire signing key). Required.
  bytes  responder_kyber_binding_sig = 10 [(dsm_max_len)=51200];
}

enum RelationshipSendCheckState {
  RELATIONSHIP_SEND_CHECK_STATE_UNSPECIFIED = 0;
  RELATIONSHIP_SEND_CHECK_STATE_CHECKING = 1;
  RELATIONSHIP_SEND_CHECK_STATE_READY = 2;
  RELATIONSHIP_SEND_CHECK_STATE_BLOCKED = 3;
}

enum RelationshipSendBlockReason {
  RELATIONSHIP_SEND_BLOCK_REASON_UNSPECIFIED = 0;
  RELATIONSHIP_SEND_BLOCK_REASON_PENDING_CATCHUP = 1;
  RELATIONSHIP_SEND_BLOCK_REASON_STATE_DIVERGENCE = 2;
  RELATIONSHIP_SEND_BLOCK_REASON_INTERNAL_ERROR = 3;
}

message RelationshipSendStatus {
  bool send_ready = 1;
  RelationshipSendCheckState send_check_state = 2;
  RelationshipSendBlockReason send_block_reason = 3;
  string send_block_message = 4;
}

message BilateralPrepareReject {
  Hash32 commitment_hash        = 1;
  string reason                 = 2;
  bytes  rejector_device_id     = 3 [(dsm_fixed_len)=32];
  RelationshipSendStatus send_status = 4;
  // SPHINCS+ signature of the rejector's AK over
  // "DSM/bilateral-reject\0" || commitment_hash || rejector_device_id || reason.
  // The proposer abandons its proposal only for a rejection its counterparty
  // signed under the key the contact pins.
  bytes  rejector_signature     = 5 [(dsm_max_len)=65535];
}

message BilateralTransferRequest {
  bytes  counterparty_device_id      = 1 [(dsm_fixed_len)=32];
  Hash32 commitment_hash             = 2;
  bytes  counterparty_sig            = 3 [(dsm_max_len)=65535];
  bytes  operation_data              = 4 [(dsm_max_len)=4096];
  Hash32 expected_genesis_hash       = 5;
  Hash32 expected_counterparty_state_hash = 6;
  Hash32 expected_local_state_hash   = 7;
}

// One bilateral step this device holds a session for, as the SDK reads it from
// its own session store (transport/UI only; not hashed).
enum OfflineBilateralPhase {
  OFFLINE_PHASE_UNSPECIFIED = 0;
  OFFLINE_PHASE_PREPARING = 1;
  OFFLINE_PHASE_PREPARED = 2;
  OFFLINE_PHASE_PENDING_USER_ACTION = 3;
  OFFLINE_PHASE_ACCEPTED = 4;
  OFFLINE_PHASE_REJECTED = 5;
  OFFLINE_PHASE_CONFIRM_PENDING = 6;
  OFFLINE_PHASE_COMMITTED = 7;
  OFFLINE_PHASE_FAILED = 8;
}
enum OfflineBilateralDirection {
  OFFLINE_DIRECTION_UNSPECIFIED = 0;
  OFFLINE_DIRECTION_INCOMING = 1;
  OFFLINE_DIRECTION_OUTGOING = 2;
}
message OfflineBilateralTransaction {
  string id = 1;
  bytes sender_id = 2 [(dsm_fixed_len)=32];
  bytes recipient_id = 3 [(dsm_fixed_len)=32];
  bytes commitment_hash = 4 [(dsm_fixed_len)=32];
  // 5, 6 carried state hashes the SDK never had and filled with zeros.
  reserved 5, 6;
  reserved "sender_state_hash", "recipient_state_hash";
  // 7 folded four phases into one status; 8 was a string map whose keys the
  // writer and the readers spelled differently, so every reader fell back to
  // defaults it made up. The typed fields below replace both.
  reserved 7, 8;
  reserved "status", "metadata";
  OfflineBilateralPhase phase = 9;
  OfflineBilateralDirection direction = 10;
  // The transfer's amount in base units, as its operation states it.
  uint64 amount = 11;
  // Rendered by the SDK from the token's decimals; absent when this device
  // does not know them, and then only the base-unit amount is known.
  optional string display_amount = 12;
  string token_id = 13;
  // The counterparty's contact alias, when the contact has one.
  optional string counterparty_alias = 14;
  optional string sender_ble_address = 15;
  // Whether this device may cancel the step now: the rule the SDK's cancel
  // enforces, stated where the UI reads it.
  bool cancellable = 16;
}
message OfflineBilateralPendingListResponse {
  repeated OfflineBilateralTransaction transactions = 1;
}
message BilateralTransferResponse { bool success = 1; Hash32 transaction_hash = 2; string message = 3; }
message BilateralAcceptRequest {
  bytes  counterparty_device_id      = 1 [(dsm_fixed_len)=32];
  Hash32 commitment_hash             = 2;
  bytes  local_signature             = 3 [(dsm_max_len)=65535];
  Hash32 expected_counterparty_state_hash = 4;
  Hash32 expected_local_state_hash   = 5;
}
message BilateralAcceptResponse { bool accepted = 1; bytes counterparty_sig = 2 [(dsm_max_len)=65535]; string message = 3; }
message BilateralCommitRequest {
  bytes  counterparty_device_id      = 1 [(dsm_fixed_len)=32];
  Hash32 commitment_hash             = 2;
  bytes  local_signature             = 3 [(dsm_max_len)=65535];
  bytes  counterparty_sig            = 4 [(dsm_max_len)=65535];
  Hash32 expected_local_state_hash   = 5;
  Hash32 expected_counterparty_state_hash = 6;
  Hash32 sender_post_finalize_chain_tip  = 7;
}
message BilateralCommitResponse {
  // A receiver that does not commit sends no acknowledgment: an ack is its
  // counter-signed receipt, and nothing else in it is authority.
  reserved 1, 2, 3, 4;
  reserved "success", "post_state_hash", "transaction_hash", "message";
  Hash32 commitment_hash  = 5;
  // §11.1 receiver counter-sign: receiver's locally-built copy of the
  // stitched receipt with B-side per-step EK signing artifacts
  // (ek_pk_b / ek_cert_b / kyber_ct_b / sig_b) stamped on top of the
  // sender's A-side fields. Sender verifies this on receipt and persists
  // a fully co-signed copy to its own archive. This field is required for
  // offline receipt authorization.
  bytes  counter_signed_receipt = 6 [(dsm_max_len)=131072];
}

// 3-step BLE protocol: Step 3 — Sender confirms (A→B), both finalize.
// Per §18.2: neither party finalizes until this message arrives.
message BilateralConfirmRequest {
  Hash32 commitment_hash             = 1;
  bytes  sender_signature            = 2 [(dsm_max_len)=65535]; // σ_A
  // 3, 4, 5, 9 carried the sender's roots and relationship proofs beside the
  // receipt. The receipt states both roots and the one relationship path (§4.2);
  // the receiver verifies them there.
  reserved 3, 4, 5, 9;
  reserved "sender_smt_root", "rel_proof_parent", "rel_proof_child", "sender_smt_root_before";
  bytes  stitched_receipt            = 6 [(dsm_max_len)=131072]; // complete receipt, both sigs; enforced ≤128 KiB (§11.1)
  Hash32 shared_chain_tip_new        = 7; // h_{n+1}
  bytes  pre_entropy                 = 8 [(dsm_max_len)=32]; // entropy used to derive h_{n+1}; receiver re-derives for independent verification (§4.1 / §C1)
  reserved 10, 11; // removed: legacy Safe-7 island_attestation / anchor_expiry_tick (replaced by field 12)
  // Canonical offline-bearer release (Software-Authority / Hardware-Identity v2): the prost-encoded
  // dsm.anchor.OfflineRelease (Δ + Π_i/Π_{i+1} anchor-state inclusion proofs + the v2 certificate
  // carrying σ^chip + σ^host), carried as opaque bytes so the dsm.anchor namespace stays decoupled
  // from dsm_app. The receiver decodes it and applies anchor_core::accept::accept_offline. Empty
  // for ordinary transfers; an absent or invalid release fails closed to online recovery — no value
  // is released on it.
  bytes offline_release = 12 [(dsm_max_len)=262144];
  reserved 13, 14; // removed v1 counter-era anchor_state_prev/next_proof (Π now rides IN the release)
  // Receiver-admit fold: A's fused-anchor pin disclosure, present iff this confirm carries a bearer
  // release. B pins it TOFU on the first transfer (already-verified contact, bound to this
  // transfer) and verifies same-anchor on every subsequent one. Absent for ordinary transfers.
  AnchorDisclosure anchor_disclosure = 15;
}

// Canonical receipt commit form for hashing/signing (whitepaper Sec. 4.2.1)
message ReceiptCommit {
  bytes genesis         = 1 [(dsm_fixed_len)=32]; // G
  bytes devid_a         = 2 [(dsm_fixed_len)=32]; // DevID_A
  bytes devid_b         = 3 [(dsm_fixed_len)=32]; // DevID_B
  bytes parent_tip      = 4 [(dsm_fixed_len)=32]; // h_n
  bytes child_tip       = 5 [(dsm_fixed_len)=32]; // h_{n+1}
  bytes parent_root     = 6 [(dsm_fixed_len)=32]; // r_A
  bytes child_root      = 7 [(dsm_fixed_len)=32]; // r_A'
  // Proof fields are capped to enforce the 128 KiB strict-fail invariant end-to-end.
  // pi_rel: the ONE relationship path. It authenticates h_n under r_A, and the
  // same siblings folded with h_{n+1} are r_A' — there is no second proof.
  bytes rel_proof_parent= 8 [(dsm_max_len)=131072];
  bytes dev_proof       = 10 [(dsm_max_len)=131072]; // pi_dev(DevID_A in R_G)
  // 9 was a child inclusion proof and 11 a separate replace witness: both were
  // second encodings of the path field 8 already carries.
  reserved 9, 11;
  // Dual SPHINCS+ signatures. These are the receipt challenge responses.
  // The challenge is the proposed transition context carried by fields 1-8, 10 and 21
  // plus the bilateral session binding. Each response signs that context with
  // the fresh EK key derived from Smaster, chain_id, h_n, C_pre, and k_step.
  // NOT part of canonical commit preimage.
  // Proto3 omits empty bytes fields, so canonical encode_to_vec() skips these.
  bytes sig_a = 12 [(dsm_max_len)=65535]; // SPHINCS+ sig from party A
  bytes sig_b = 13 [(dsm_max_len)=65535]; // SPHINCS+ sig from party B
  // Per-step ephemeral-key certificates (whitepaper §11.1).
  // cert_{n+1} = Sign_{SK_n}( BLAKE3("DSM/ek-cert\0" || EK_pk_{n+1} || h_n) )
  // Carried in the envelope alongside sig_a/sig_b. NOT in canonical commit
  // preimage (§4.2.1 freezes the 10-field commit form). The cert binds the
  // per-step EK to the prior chain head (AK at n=0, else EK_n) and lets a
  // verifier walk the chain back to the device-attested AK_pk.
  bytes ek_cert_a = 14 [(dsm_max_len)=65535];
  bytes ek_cert_b = 15 [(dsm_max_len)=65535];
  // Per-step ephemeral SPHINCS+ public keys (whitepaper §11.1/§12). Each receipt
  // is signed by a freshly-derived EK_pk_{n+1} = SPHINCS+.KeyGen(E_{n+1}),
  // where E_{n+1} = keyed-BLAKE3(Smaster, "DSM/ek/v1\0" || alg_id || chain_id
  //                               || h_n || C_pre || k_step).
  // The verifier uses these to verify sig_a/sig_b without needing them
  // out-of-band; ek_cert_a/b chain them back to AK_pk. Wire-only, with the
  // same placement rationale as ek_cert_a/b.
  // A copied database carries old public EK material but cannot derive the next
  // EK without the wallet seed (Smaster is re-derived on demand, never serialized
  // in the DB). Note: the EK chain binds AUTHORSHIP, not anti-clone — anti-clone
  // is the Boot Fenced Fused Anchor (a seed copy holds Smaster).
  bytes ek_pk_a = 16 [(dsm_max_len)=65535];
  bytes ek_pk_b = 17 [(dsm_max_len)=65535];
  // Per-step Kyber/ML-KEM ciphertexts (whitepaper §11/§12). The sender derives
  // deterministic Kyber coins from
  //   coins = keyed-BLAKE3(Smaster, "DSM/kyber-coins/v1\0" || kyber_alg_id
  //                         || H(recipient_kem_pub) || h_n || C_pre || DevID_sender)
  // encapsulates against the recipient's Kyber public key, and the
  // resulting ciphertext travels here. The recipient decapsulates with
  // their local Kyber secret key to recover the same shared secret `ss`,
  // then derives k_step = BLAKE3("DSM/kyber-ss\0" || ss). Both parties
  // arrive at identical k_step, which is then mixed into the per-step
  // EK derivation alongside Smaster. Wire-only — not part of canonical
  // commit form (§4.2.1).
  bytes kyber_ct_a = 18 [(dsm_max_len)=2048];
  bytes kyber_ct_b = 19 [(dsm_max_len)=2048];
  // 20 was a fork-aware finalization witness: no producer made one, and the
  // receiver checked the sender's candidate set only against itself.
  reserved 20;
  reserved "fork_witness";
  // The sender's transition entropy e_{n+1} (Part VII step 3, §39.3): the one
  // value Core derived inside DeviceState::advance for this step. CANONICAL —
  // part of the commit preimage, so sig_a binds it. The recipient cannot
  // derive it (e_n is the sender's own tip entropy); it feeds it into C_pre
  // and the symmetric tip and recomputes child_tip from it. Required.
  bytes transition_entropy = 21 [(dsm_fixed_len)=32];
}

// Bilateral event notifications for frontend
enum BilateralEventType {
  BILATERAL_EVENT_UNSPECIFIED     = 0;
  BILATERAL_EVENT_PREPARE_RECEIVED = 1; // Receiver: incoming transfer request
  BILATERAL_EVENT_ACCEPT_SENT      = 2; // Receiver: accepted transfer
  BILATERAL_EVENT_COMMIT_RECEIVED  = 3; // Receiver: commit finalization
  BILATERAL_EVENT_TRANSFER_COMPLETE= 4; // Both: transaction finalized
  BILATERAL_EVENT_REJECTED         = 5; // Receiver: rejected transfer
  BILATERAL_EVENT_FAILED           = 6; // Either: transaction failed
  BILATERAL_EVENT_ANCHOR_PINNED    = 7; // Receiver: first-transfer TOFU anchor pin admitted (trust established)
  BILATERAL_EVENT_ANCHOR_CHANGED   = 8; // Receiver: a pinned anchor's identity changed on a later transfer (SECURITY warning; transfer refused, pinned anchor kept)
}

enum BilateralFailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  FAILURE_REASON_BLE_GATT_ERROR = 1; // Transport failure (connection dropped, MTU, write failed)
  FAILURE_REASON_CRYPTO_INVALID = 2; // Signature mismatch, hash mismatch, invalid proof
  FAILURE_REASON_SECURITY_LOCKOUT = 3; // Hardware binding key missing/locked
  FAILURE_REASON_REJECTED_BY_PEER = 4; // Explicit rejection by counterparty logic
  FAILURE_REASON_PROTOCOL_VIOLATION = 5; // Malformed envelope, wrong version, precommit violation
  FAILURE_REASON_TIMEOUT = 6; // Operation timed out
}

message BilateralEventNotification {
  BilateralEventType event_type           = 1;
  bytes              counterparty_device_id = 2 [(dsm_fixed_len)=32];
  bytes              commitment_hash        = 3 [(dsm_fixed_len)=32];
  optional bytes     transaction_hash       = 4 [(dsm_fixed_len)=32];
  optional uint64    amount                 = 5;  // transfer amount (if applicable)
  optional string    token_id               = 6;  // token identifier
  string             status                 = 7; // human-readable status
  string             message                = 8; // optional details
  optional string    sender_ble_address     = 9;  // BLE MAC address for response routing
  optional BilateralFailureReason failure_reason = 10;
  // Display form of `amount`, rendered by Rust from the token's registry
  // decimals. `amount` stays canonical base units.
  optional string    display_amount         = 11;
}

// Read-only offline-bearer anchor status (signal (c)): the `anchor.status` query response.
// A pure diagnostics snapshot of the sender's anchor appliance (RP2350/TROPIC01) — never
// mutates the appliance or the device state. `anchor_connected=false` means no appliance could
// attach (no device / fail-closed); the identity/counter fields are then zero.
message AnchorStatusResponse {
  bool   anchor_connected = 1;                      // appliance attached and OP_STATUS read OK
  bytes  anchor_id        = 2 [(dsm_fixed_len)=32]; // enrolled anchor identity (AnchorPin.anchor_id)
  bytes  pk_chip          = 3 [(dsm_max_len)=64];   // resident Ed25519 pubkey (σ^chip)
  bytes  partition_pk     = 4 [(dsm_max_len)=128];  // RP2350 partition pubkey pk_host (σ^host)
  uint64 anchor_counter   = 5;                      // live counter floor u_i (OP_STATUS)
  bytes  frontier_root    = 6 [(dsm_fixed_len)=32]; // current offline frontier h_i (OP_STATUS)
  uint64 enrolled_counter = 7;                      // counter floor at enrollment (AnchorPin)
  bytes  bundle           = 8 [(dsm_fixed_len)=32]; // anchor bundle B (AnchorPin.bundle)
  string status           = 9;                      // human-readable status line
}

// ── Offline-cash (two-regime money model) ──────────────────────────────────
// Deliberately load online balance into a device-bound offline-bearer allocation
// ("cash in hand"), spend it offline, reconcile it back. Request bodies ride
// inside ArgPack.body for wallet.loadOffline / wallet.unloadOffline.
message OfflineCashRequest {
  string token_id = 1;   // asset to move between regimes (resolved to a CPTA policy_commit)
  uint64 amount   = 2;   // base units to load (online -> allocation) or unload (allocation -> online)
}

message OfflineCashResponse {
  bool   success        = 1;
  uint64 online_balance = 2;                       // online available AFTER the move
  uint64 allocation_balance   = 3;                       // device-bound offline allocation AFTER the move
  bytes  device_root    = 4 [(dsm_fixed_len)=32];  // new device SMT root r_A
  string message        = 5;
}

// =========================== Bluetooth Transport ====================
enum BtMessageType {
  BTMSG_TYPE_UNSPECIFIED = 0;
  BTMSG_TYPE_TX_PROPOSAL  = 1;
  BTMSG_TYPE_TX_ACCEPT    = 2;
  BTMSG_TYPE_TX_REJECT    = 3;
  BTMSG_TYPE_STATE_SYNC   = 4;
  BTMSG_TYPE_STATE_ACK    = 5;
  BTMSG_TYPE_PING         = 6;
  BTMSG_TYPE_PONG         = 7;
  BTMSG_TYPE_ERROR        = 8;
  BTMSG_TYPE_DATA         = 9;
}
message DsmBtMessage {
  string         message_id        = 1; // opaque message id
  BtMessageType  message_type      = 2;
  bytes          sender_id         = 3 [(dsm_fixed_len)=32];
  bytes          recipient_id      = 4 [(dsm_fixed_len)=32];
  bytes          payload           = 5 [(dsm_max_len)=4096];
  uint64         sequence          = 6; // ordered per-connection
  bool           requires_ack      = 7;
  uint32         checksum          = 8; // CRC32 over core fields
  string         ack_for           = 9; // message_id being acknowledged
  uint64         received_sequence = 10; // observed sequence
}
// BLE UI events (protobuf-only; no JSON)
message BleTransactionError        { bytes device_id = 1 [(dsm_fixed_len)=32]; int32  error_code = 2; string message = 3; }
message BleTransactionSent         { bytes device_id = 1 [(dsm_fixed_len)=32]; uint64 data_size  = 2; }
message BleTransactionRequest      { bytes device_id = 1 [(dsm_fixed_len)=32]; uint64 data_size  = 2; }
message BleTransactionResponseSent { bytes device_id = 1 [(dsm_fixed_len)=32]; uint64 data_size  = 2; }
message BtAck { string ack_for = 1; uint64 received_sequence = 2; }
message BilateralTransactionReceived {
  bytes  counterparty_device_id = 1 [(dsm_fixed_len)=32];
  bytes  operation_data         = 2 [(dsm_max_len)=4096];
  bytes  commitment_hash        = 3 [(dsm_fixed_len)=32];
}
// Platform events
message BleDeviceInfo         { string address = 1; string name = 2; int32 rssi = 3; }
message BleCharacteristicData { string address = 1; bytes  data = 2 [(dsm_max_len)=1024]; }
message BlePairingRequest     { string address = 1; bytes genesis_hash = 2 [(dsm_fixed_len)=32]; bytes device_id = 3 [(dsm_fixed_len)=32]; string alias = 4; }
message BlePairingAccept      { string address = 1; bytes genesis_hash = 2 [(dsm_fixed_len)=32]; bytes device_id = 3 [(dsm_fixed_len)=32]; }
// Phase 3 confirmation: scanner → advertiser after receiving BlePairingAccept.
// Neither side persists ble_address until this round-trip completes (atomic pairing).
message BlePairingConfirm     { string address = 1; bytes device_id = 2 [(dsm_fixed_len)=32]; }
// Identity observed implicitly via GATT identity characteristic read (not an explicit pairing handshake)
message BleIdentityObserved   { string address = 1; bytes genesis_hash = 2 [(dsm_fixed_len)=32]; bytes device_id = 3 [(dsm_fixed_len)=32]; }

// Protobuf-encoded identity value carried on the BLE GATT identity characteristic
// (UUID 8e7f00ff-7c07-4f3f-9b32-7bf3ba6c2a01). Replaces raw 64-byte concatenation.
// Kotlin MUST NOT parse or split identity bytes — all encoding/decoding is Rust-side.
message BleIdentityCharValue {
  bytes genesis_hash = 1 [(dsm_fixed_len)=32];
  bytes device_id    = 2 [(dsm_fixed_len)=32];
}

// Response from processGattIdentityRead JNI call.
// Rust decodes the BleIdentityCharValue from GATT, dispatches identity events, and
// returns the write-back envelope for the peer's PAIRING characteristic.
message BleGattIdentityReadResult {
  bool   success             = 1;
  bytes  write_back_envelope = 2 [(dsm_max_len)=4096]; // Framed Envelope to write to PAIRING char
  string error_message       = 3;
  bytes  peer_device_id      = 4 [(dsm_fixed_len)=32]; // Peer's deviceId (for Kotlin identity anchoring)
  bytes  peer_genesis_hash   = 5 [(dsm_fixed_len)=32]; // Peer's genesisHash
}

// Protobuf value carried on the BLE relationship-status GATT characteristic.
// The advertiser computes the status in Rust for the connected peer relationship.
message BleRelationshipStatusCharValue {
  bytes counterparty_device_id = 1 [(dsm_fixed_len)=32];
  RelationshipSendStatus send_status = 2;
}

// Response from processIncomingBleData JNI call.
// Rust decides internally whether to route as chunk or Envelope v3, runs any
// frame-type detection, and returns pre-chunked follow-up bytes for Kotlin to
// write verbatim over the BLE characteristic. Kotlin MUST NOT inspect content.
message BleIncomingDataResponse {
  repeated bytes response_chunks = 1 [(dsm_max_len)=1024]; // BLE chunks to write back (may be empty)
  reserved 2, 4;
  bool use_reliable_write        = 3; // true = send via requestGattWriteChunks (bilateral follow-ups)
}

// Status update emitted by PairingOrchestrator during the pairing loop.
// Wrapped in a BleEvent envelope (0x03 framing) and dispatched to the frontend.
message PairingStatusUpdate {
  bytes  device_id   = 1; // 32-byte contact device ID being paired
  string status      = 2; // "scanning", "found", "connected", "paired", "failed", "timeout"
  string message     = 3; // human-readable detail
  string ble_address = 4; // peer BLE MAC if known
}

// Genesis/bootstrap lifecycle events — authored by Rust and transported via
// canonical Envelope v3 payloads and async ingress event drain.
message GenesisLifecycleEvent {
  enum Kind {
    GENESIS_KIND_UNSPECIFIED        = 0;
    GENESIS_KIND_STARTED            = 1;
    GENESIS_KIND_OK                 = 2;
    GENESIS_KIND_ERROR              = 3;
    GENESIS_KIND_SECURING_DEVICE    = 4;
    GENESIS_KIND_SECURING_PROGRESS  = 5;
    GENESIS_KIND_SECURING_COMPLETE  = 6;
    GENESIS_KIND_SECURING_ABORTED   = 7;
  }
  Kind   kind     = 1;
  uint32 progress = 2; // 0–100, only meaningful for SECURING_PROGRESS
}

// Host-side measurement report forwarded into Rust bootstrap control.
message BootstrapMeasurementReport {
  enum Phase {
    BOOTSTRAP_PHASE_UNSPECIFIED = 0;
    BOOTSTRAP_PHASE_STARTED = 1;
    BOOTSTRAP_PHASE_PROGRESS = 2;
    BOOTSTRAP_PHASE_FINALIZE = 3;
    BOOTSTRAP_PHASE_ABORTED = 4;
    BOOTSTRAP_PHASE_ERROR = 5;
    BOOTSTRAP_PHASE_RESUME_FINALIZE = 6;
  }

  enum TrustLevel {
    BOOTSTRAP_TRUST_LEVEL_UNSPECIFIED = 0;
    BOOTSTRAP_TRUST_LEVEL_FULL_ACCESS = 1;
    BOOTSTRAP_TRUST_LEVEL_PIN_REQUIRED = 2;
    BOOTSTRAP_TRUST_LEVEL_READ_ONLY = 3;
    BOOTSTRAP_TRUST_LEVEL_BLOCKED = 4;
  }

  Phase phase = 1;
  bytes device_id = 2 [(dsm_fixed_len)=32];
  bytes genesis_hash = 3 [(dsm_fixed_len)=32];
  uint32 progress_percent = 4;
  TrustLevel trust_level = 8;
  string error_message = 9;
}

message BootstrapFinalizeResponse {
  enum Result {
    BOOTSTRAP_RESULT_UNSPECIFIED = 0;
    BOOTSTRAP_RESULT_READY = 1;
    BOOTSTRAP_RESULT_REJECTED = 2;
    BOOTSTRAP_RESULT_READ_ONLY = 3;
    BOOTSTRAP_RESULT_BLOCKED = 4;
    BOOTSTRAP_RESULT_ABORTED = 5;
    BOOTSTRAP_RESULT_ERROR = 6;
  }

  Result result = 1;
  bytes device_id = 2 [(dsm_fixed_len)=32];
  bytes genesis_hash = 3 [(dsm_fixed_len)=32];
  string message = 4;
}

// BLE permission denied notification — authored by Rust, transport via BleEvent.
message BlePermissionEvent {
  string operation = 1; // "scan" | "advertise"
}

// NFC recovery capsule payload — raw NdefRecord bytes wrapped in Envelope v3.
message NfcRecoveryCapsule {
  bytes payload = 1 [(dsm_max_len)=65535];
}

message BleEvent {
  oneof ev {
    BleDeviceInfo device_found            = 1;
    BleDeviceInfo device_connected        = 2;
    BleDeviceInfo device_disconnected     = 3;
    BleCharacteristicData characteristic_written = 4;
    BleCharacteristicData characteristic_read    = 5;
    bool   scan_started        = 6;
    bool   scan_stopped        = 7;
    bool   advertising_started = 8;
    bool   advertising_stopped = 9;
    BleConnectionFailed connection_failed = 10; // human text (transport only)
    BlePairingRequest pairing_request = 11;
    BlePairingAccept  pairing_accept  = 12;
    BleIdentityObserved identity_observed = 13;
    PairingStatusUpdate pairing_status    = 14;
    BlePairingConfirm   pairing_confirm  = 15;
    BlePermissionEvent    ble_permission     = 17;
  }
}
// Android BLE bridge commands
message BleStartScan          { reserved 1; }
message BleStopScan           {}
message BleStartAdvertising   { string device_name = 1; }
message BleStopAdvertising    {}
message BleConnectDevice      { string address = 1; }
message BleDisconnectDevice   { string address = 1; }
message BleWriteCharacteristic{ string address = 1; bytes data = 2 [(dsm_max_len)=1024]; }
message BleReadCharacteristic { string address = 1; }
message BleCommand {
  oneof cmd {
    BleStartScan           start_scan          = 1;
    BleStopScan            stop_scan           = 2;
    BleStartAdvertising    start_advertising   = 3;
    BleStopAdvertising     stop_advertising    = 4;
    BleConnectDevice       connect_device      = 5;
    BleDisconnectDevice    disconnect_device   = 6;
    BleWriteCharacteristic write_characteristic= 7;
    BleReadCharacteristic  read_characteristic = 8;
  }
}
message BleCommandResponse { bool ok = 1; string message = 2; bytes payload = 3 [(dsm_max_len)=65535]; }

// ====================== Bilateral Bluetooth Wire (proto only) ======================
message BilateralDeviceInfo {
  bytes device_id = 1 [(dsm_fixed_len)=32];
  bytes genesis_hash = 2 [(dsm_fixed_len)=32];
  bytes current_state_hash = 3 [(dsm_fixed_len)=32];
  uint64 state_number = 4;
  bytes public_key = 5 [(dsm_max_len)=65535];
  optional string bluetooth_address = 6;
  string device_name = 7;
}

message BilateralSessionInit {
  bytes session_id = 1 [(dsm_fixed_len)=16];
  BilateralDeviceInfo initiator = 2;
  bytes proposed_transaction = 3 [(dsm_max_len)=4096];
}

message BilateralSessionAccept {
  bytes session_id = 1 [(dsm_fixed_len)=16];
  BilateralDeviceInfo responder = 2;
}

message BilateralSessionReject {
  bytes session_id = 1 [(dsm_fixed_len)=16];
  string reason = 2;
}

message BilateralStateSync {
  bytes session_id = 1 [(dsm_fixed_len)=16];
  bytes state_hash = 2 [(dsm_fixed_len)=32];
  uint64 state_number = 3;
}

enum BilateralSignerRole {
  BILATERAL_SIGNER_ROLE_UNSPECIFIED = 0;
  BILATERAL_SIGNER_ROLE_INITIATOR = 1;
  BILATERAL_SIGNER_ROLE_RESPONDER = 2;
}

message BilateralTransactionSign {
  bytes session_id = 1 [(dsm_fixed_len)=16];
  bytes signature = 2 [(dsm_max_len)=65535];
  BilateralSignerRole role = 3;
}

message BilateralSessionComplete {
  bytes session_id = 1 [(dsm_fixed_len)=16];
  bytes final_state_hash = 2 [(dsm_fixed_len)=32];
}

message BilateralError {
  bytes session_id = 1 [(dsm_fixed_len)=16];
  string error_code = 2;
  string message = 3;
}

// ================= BILATERAL STATE RECONCILIATION (Task 2: Beta Readiness) =================
// Per beta readiness critique: "actively checks for transactions that are committed on one device,
// but still pending on the other" when BLE sessions end abruptly.

message BilateralState {
  bytes state_bytes = 1 [(dsm_max_len)=131072]; // Encoded bilateral state/receipt (protobuf bytes)
  SmtProof smt_proof = 2; // Per-Device SMT inclusion proof (protobuf)
  DeviceTreeProof device_tree_proof = 3; // Device Tree inclusion proof (protobuf)
  bytes chain_tip = 4 [(dsm_fixed_len)=32]; // Relationship tip for this state
  uint64 state_number = 5; // Monotonic relationship state number
  bytes smt_root = 6 [(dsm_fixed_len)=32]; // Per-Device SMT root for proof verification
  bytes device_tree_root = 7 [(dsm_fixed_len)=32]; // Device Tree root for proof verification
  bytes relationship_key = 8 [(dsm_fixed_len)=32]; // Canonical SMT key for this relationship (must equal smt_proof.key)
}

message BilateralChainHistoryRequest {
  bytes remote_device_id = 1 [(dsm_fixed_len)=32]; // Device requesting history
  bytes from_tip = 2 [(dsm_max_len)=32]; // Optional: start from this tip
  uint32 max_states = 3; // Max states to return (pagination)
}

message BilateralChainHistoryResponse {
  repeated BilateralState states = 1; // Chain history in order
  bytes current_tip = 2 [(dsm_fixed_len)=32]; // Remote's current chain tip
  bool is_complete = 3; // True if entire chain returned
}

message BilateralReconciliationRequest {
  bytes remote_device_id = 1 [(dsm_fixed_len)=32];
  bytes local_tip = 2 [(dsm_fixed_len)=32]; // Our view of the relationship tip
  bool force_reconcile = 3; // Force reconciliation even if no mismatch
  bool include_peer_status = 4; // Offline UI may request peer advisory status
  string ble_address = 5; // Optional peer BLE address for advisory status read
}

message BilateralReconciliationResponse {
  bool mismatch_detected = 1;
  bool reconciled = 2;
  bytes remote_tip = 3 [(dsm_fixed_len)=32]; // Remote's actual tip
  string error_message = 4;
  RelationshipSendStatus local_status = 5;
  RelationshipSendStatus peer_status = 6;
}

message BilateralMessageEnvelope {
  oneof msg {
    BilateralSessionInit session_init = 1;
    BilateralSessionAccept session_accept = 2;
    BilateralSessionReject session_reject = 3;
    BilateralStateSync state_sync = 4;
    BilateralTransactionSign transaction_sign = 5;
    BilateralSessionComplete session_complete = 6;
    BilateralError error = 7;
    BilateralChainHistoryRequest chain_history_request = 8;
    BilateralChainHistoryResponse chain_history_response = 9;
    BilateralReconciliationRequest reconciliation_request = 10;
    BilateralReconciliationResponse reconciliation_response = 11;
  }
}

// ============================ BLE CHUNK FRAMING ============================
enum BleFrameType {
  BLE_FRAME_TYPE_UNSPECIFIED               = 0;
  BLE_FRAME_TYPE_BILATERAL_PREPARE         = 1; // Envelope with BilateralPrepareRequest
  BLE_FRAME_TYPE_BILATERAL_PREPARE_RESPONSE= 2; // Envelope with BilateralPrepareResponse
  BLE_FRAME_TYPE_BILATERAL_PREPARE_REJECT  = 3; // Envelope with BilateralPrepareReject
  BLE_FRAME_TYPE_BILATERAL_COMMIT          = 4; // Envelope with BilateralCommitRequest
  BLE_FRAME_TYPE_BILATERAL_COMMIT_RESPONSE = 5; // Envelope with BilateralCommitResponse
  BLE_FRAME_TYPE_ACK                       = 6; // transport ack only
  BLE_FRAME_TYPE_NACK                      = 7; // transport negative ack only
  BLE_FRAME_TYPE_CHAIN_HISTORY_REQUEST     = 8; // BilateralChainHistoryRequest (Task 2: reconciliation)
  BLE_FRAME_TYPE_CHAIN_HISTORY_RESPONSE    = 9; // BilateralChainHistoryResponse (Task 2: reconciliation)
  BLE_FRAME_TYPE_RECONCILIATION_REQUEST    = 10; // BilateralReconciliationRequest (Task 2: reconciliation)
  BLE_FRAME_TYPE_RECONCILIATION_RESPONSE   = 11; // BilateralReconciliationResponse (Task 2: reconciliation)
  BLE_FRAME_TYPE_BILATERAL_CONFIRM         = 12; // Step 3: Sender confirms (BilateralConfirmRequest)
  BLE_FRAME_TYPE_DEVICE_ADMISSION_REQUEST  = 13; // Envelope w/ AddDeviceAdmissionRequestV1 (new→existing)
  BLE_FRAME_TYPE_DEVICE_ADMISSION_RESPONSE = 14; // Envelope w/ AddDeviceAdmissionV1 (existing→new, gate-signed)
  reserved 15, 16, 17; // removed v1 counter-era frames: TROPIC_SPI_RELAY, BILATERAL_BEARER_PREPARED/PROCEED
}

message BleFrameHeader {
  reserved 1; // removed field — prevent reuse
  BleFrameType frame_type       = 2; // transport-level kind
  uint32       total_chunks     = 3; // constant across chunks
  uint32       chunk_index      = 4; // zero-based
  uint32       payload_len      = 5; // full unchunked payload length
  uint32       checksum         = 6; // per-chunk BLAKE3 CRC32
  bytes        frame_commitment = 7 [(dsm_fixed_len)=32]; // BLAKE3("DSM/ble-frame\0" || payload || frame_type_u8)
}

message BleChunk {
  BleFrameHeader header = 1;
  bytes          data   = 2 [(dsm_max_len)=1024];
}

// Phase-1 BLE transport framing: session/message scoped chunk delivery below Envelope v3.
// These messages are transport-only. They MUST NOT alter protocol semantics.
message BleTransportHeader {
  uint32 version     = 1; // transport framing version (currently 1)
  uint32 flags       = 2; // bitmask: DATA/SYN/ACK/NACK/FIN/KEEPALIVE
  fixed64 session_id = 3; // random per transport session
  fixed64 message_id = 4; // monotonic within session
  uint32 chunk_index = 5; // zero-based
  uint32 chunk_count = 6; // total chunks for the message
  uint32 payload_len = 7; // bytes carried in this chunk's payload field
  uint32 checksum    = 8; // CRC32 of the payload bytes
}

message BleTransportChunk {
  BleTransportHeader header  = 1;
  bytes              payload = 2 [(dsm_max_len)=1024];
}

message BleTransportAck {
  fixed64 session_id     = 1;
  fixed64 message_id     = 2;
  uint32  ack_base_chunk = 3; // highest contiguous received chunk index + 1 base for bitmap
  bytes   ack_bitmap     = 4 [(dsm_max_len)=256];
}

// Resumable BLE chunk transfer — receiver reports persisted chunk progress
message BleResumeRequest {
  bytes frame_commitment = 1 [(dsm_fixed_len)=32];
}

message BleResumeResponse {
  bytes  frame_commitment = 1 [(dsm_fixed_len)=32];
  uint32 have_count       = 2; // contiguous chunks 0..have_count-1 already received
}

// ============== GENERIC INVOKE / QUERY / VAULT UNIVERSAL OPS ===============
message Invoke {
  ProgramRef program        = 1;
  string     method         = 2; // e.g., "token.transfer"
  ArgPack    args           = 3;
  // 4 and 5 were a pre/post tip pair no receiver verified: the pre tip was
  // always written as zeros and the post tip was read into nothing.
  reserved 4, 5;
  reserved "pre_state_hash", "post_state_hash";
  repeated bytes cosigners  = 6 [(dsm_max_len)=96]; // optional required parties
  Evidence   evidence       = 7; // optional attestation
  Hash16     nonce          = 8; // replay protection
}
message VaultOp { oneof kind { DlvCreate create = 1; DlvUnlock unlock = 2; } }
message QueryOp { string path = 1; ArgPack params = 2; bool include_proofs = 3; }

// ====================== UNIVERSAL OP/TX/RX TYPES ====================
message UniversalOp {
  Hash32  op_id        = 1; // client-assigned match id
  bytes   actor        = 2 [(dsm_max_len)=96]; // initiator (genesis/key)
  // 3 was the actor's genesis: nothing read it, and one producer sent zeros.
  reserved 3;
  reserved "genesis_hash";
  reserved 18, 19, 27, 28; // Bilateral ops removed
  oneof kind {
    Invoke                  invoke                 = 10;
    PrecommitOneOf          precommit_oneof        = 11;
    ResolvePrecommit        resolve_precommit      = 12;
    ExternalCommit          external_commit        = 13;
    DelegatedCapability     delegated_capability   = 14;
    AttestedAction          attested_action        = 15;
    VaultOp                 vault                  = 16;
    QueryOp                 query                  = 17;
    RecoveryCapsuleDecryptRequest recovery_capsule_decrypt = 22;
    RecoveryTombstoneRequest     recovery_tombstone       = 23;
    RecoverySuccessionRequest    recovery_succession      = 24;
    RecoveryResumeRequest        recovery_resume          = 25;
    FaucetClaimRequest           faucet_claim             = 26;
  }
}
message UniversalTx { repeated UniversalOp ops = 1; bool atomic = 2; }
// NOTE: `source_tag` is a stable category tag for programmatic client handling.
// It is intentionally separate from `code` (which may be a finer-grained error code).
//
// Tag mapping is owned by the Rust SDK boundary (see `dsm_sdk::wire`); clients should
// switch on this value rather than string-matching `message`.
message Error {
  uint32 code = 1;
  string message = 2;
  bytes context = 3 [(dsm_max_len)=4096];
  uint32 source_tag = 4;
  bool is_recoverable = 5;
  // Base32-Crockford debug string encoding of the canonical Error bytes
  // Useful for human-readable diagnostics without introducing JSON.
  string debug_b32 = 6 [(dsm_max_len)=4096];
}
message OpResult {
  Hash32 op_id = 1;
  bool accepted = 2;
  // 3 was a post-state hash no router produced.
  reserved 3;
  reserved "post_state_hash";
  ResultPack result = 4;
  Error error = 5;
}
message UniversalRx { repeated OpResult results = 1; }

// ================================ BATCH ==============================
message BatchEnvelope {
  repeated Envelope envelopes = 1;
  bytes   batch_signature     = 2 [(dsm_max_len)=65535];
  bool    atomic_execution    = 3; // deterministic local ordering
}

// One spool entry: the bytes submitted, exactly as the node holds them. The
// node never opens an envelope (storage spec §8); the reader decodes it.
message SequencedEnvelope {
  bytes  envelope = 1;
  uint64 seq_num  = 2; // the entry's position in the spool
}

message SequencedBatchEnvelope {
  repeated SequencedEnvelope envelopes = 1;
  uint64 next_seq = 2; // next sequence number to request
}

// =============================== ENVELOPE ============================
// The sender of an addressed envelope. A local answer (this device's Core or
// SDK answering its own caller) makes no sender claim and carries no Headers.
message Headers {
  bytes device_id    = 1 [(dsm_fixed_len)=32]; // REQUIRED: 32 bytes
  // 2 was a chain tip and 4 a sequence counter. The relationship tip is the
  // inbox address itself (storage node spec §8) and DSM keeps no counter;
  // neither was verified by anything that received it.
  reserved 2, 4;
  reserved "chain_tip", "seq";
  bytes genesis_hash = 3 [(dsm_fixed_len)=32]; // REQUIRED: genesis anchor (mandatory per DSM spec)
}
message Envelope {
  uint32  version   = 1; // MUST be 3 (strict-fail if != 3)
  Headers headers   = 2;
  bytes   message_id= 3 [(dsm_fixed_len)=16]; // 16-byte opaque transport id (MUST NOT be derived from wall-clock)
  oneof payload {
    UniversalTx  universal_tx    = 10;
    UniversalRx  universal_rx    = 11;
    BatchEnvelope batch_envelope = 12;

    RecoveryCapsuleDecryptResponse   recovery_capsule_decrypt_response = 15;
    RecoveryTombstoneResponse        recovery_tombstone_response       = 16;
    RecoverySuccessionResponse       recovery_succession_response      = 17;
    RecoveryResumeResponse           recovery_resume_response          = 18;

    BilateralPrepareResponse         bilateral_prepare_response        = 19;
    BilateralPrepareReject           bilateral_prepare_reject          = 23;
    BilateralTransferResponse        bilateral_transfer_response       = 20;
    AppStateRequest                  app_state_request                 = 21;
    AppStateResponse                 app_state_response                = 22;
    FaucetClaimResponse              faucet_claim_response             = 24;
    GenesisCreated                   genesis_created_response          = 25;
    BilateralAcceptResponse          bilateral_accept_response         = 27;
    BilateralCommitResponse          bilateral_commit_response         = 28;
    DsmBtMessage                     dsm_bt_message                    = 29;

    // SDK init/status responses
    InitFailed                       init_failed                       = 31;

    // BLE events
    BleEvent                         ble_event                        = 32;

    // Additional response types
    BalancesListResponse              balances_list_response           = 34;
    StorageSyncResponse               storage_sync_response            = 35;
    OfflineBilateralPendingListResponse offline_bilateral_pending_list_response = 36;
    InboxResponse                     inbox_response                   = 37;
    WalletHistoryResponse             wallet_history_response          = 38;
    ContactsListResponse              contacts_list_response           = 39;
    OnlineTransferResponse            online_transfer_response         = 40;
    OnlineMessageResponse             online_message_response          = 41;
    StateInfoResponse                 state_info_response              = 42;
    ContactQrV3                       contact_qr_response              = 44;
    BalanceGetResponse                balance_get_response             = 45;
    ContactAddResponse                contact_add_response             = 46;
    StorageStatusResponse             storage_status_response          = 47;
    BleCommandResponse                ble_command_response             = 48;

    // Token policy operations (now on canonical Envelope v3 path)
    TokenCreateRequest                token_create_request             = 49;
    TokenCreateResponse               token_create_response            = 50;

    // Bitcoin Tap (deposit) operations
    DepositRequest                 deposit_request              = 51;
    DepositResponse                deposit_response             = 52;
    DepositCompleteRequest         deposit_complete_request     = 53;
    DepositRefundRequest           deposit_refund_request       = 54;
    DepositStatusRequest           deposit_status_request       = 55;

    // Bitcoin Tap (dBTC) address and deposit management
    BitcoinAddressRequest             bitcoin_address_request          = 56;
    BitcoinAddressResponse            bitcoin_address_response         = 57;
    BitcoinDepositListRequest            bitcoin_deposit_list_request        = 58;
    BitcoinDepositListResponse           bitcoin_deposit_list_response       = 59;
    BitcoinClaimTxRequest             bitcoin_claim_tx_request         = 60;
    BitcoinClaimTxResponse            bitcoin_claim_tx_response        = 61;
    BitcoinWalletImportRequest        bitcoin_wallet_import_request    = 62;
    BitcoinWalletImportResponse       bitcoin_wallet_import_response   = 63;
    BitcoinWalletListResponse         bitcoin_wallet_list_response     = 64;
    BitcoinWalletSelectRequest        bitcoin_wallet_select_request    = 65;
    BitcoinWalletSelectResponse       bitcoin_wallet_select_response   = 66;

    // Bitcoin broadcast, auto-claim, and tx status
    BitcoinBroadcastRequest           bitcoin_broadcast_request        = 67;
    BitcoinBroadcastResponse          bitcoin_broadcast_response       = 68;
    BitcoinAutoClaimRequest           bitcoin_auto_claim_request       = 69;
    BitcoinAutoClaimResponse          bitcoin_auto_claim_response      = 70;
    BitcoinTxStatusRequest            bitcoin_tx_status_request        = 71;
    BitcoinTxStatusResponse           bitcoin_tx_status_response       = 72;

    // Bitcoin vault monitor
    BitcoinVaultListRequest           bitcoin_vault_list_request       = 73;
    BitcoinVaultListResponse          bitcoin_vault_list_response      = 74;
    BitcoinVaultGetRequest            bitcoin_vault_get_request        = 75;
    BitcoinVaultGetResponse           bitcoin_vault_get_response       = 76;

    // Bitcoin wallet health (replaces JSON-in-AppStateResponse)
    BitcoinWalletHealthResponse       bitcoin_wallet_health_response   = 77;

    // Fee estimation
    BitcoinFeeEstimateRequest         bitcoin_fee_estimate_request     = 78;
    BitcoinFeeEstimateResponse        bitcoin_fee_estimate_response    = 79;

    // Fractional exit
    BitcoinFractionalExitRequest      bitcoin_fractional_exit_request  = 80;
    BitcoinFractionalExitResponse     bitcoin_fractional_exit_response = 81;

    // HTLC refund TX builder
    BitcoinRefundTxRequest            bitcoin_refund_tx_request        = 82;
    BitcoinRefundTxResponse           bitcoin_refund_tx_response       = 83;

    // Bitcoin address index selection
    BitcoinAddressSelectRequest       bitcoin_address_select_request   = 84;
    BitcoinAddressSelectResponse      bitcoin_address_select_response  = 85;

    // Bitcoin wallet creation (fresh mnemonic)
    BitcoinWalletCreateRequest        bitcoin_wallet_create_request    = 86;
    BitcoinWalletCreateResponse       bitcoin_wallet_create_response   = 87;

    BitcoinWithdrawalPlanRequest     bitcoin_withdrawal_plan_request  = 91;
    BitcoinWithdrawalPlanResponse     bitcoin_withdrawal_plan_response = 92;
    BitcoinWithdrawalExecuteRequest   bitcoin_withdrawal_execute_request = 93;
    BitcoinWithdrawalExecuteResponse  bitcoin_withdrawal_execute_response = 94;

    // Session state snapshot (session.status query response)
    AppSessionStateProto              session_state_response           = 95;
    NfcRecoveryCapsule                nfc_recovery_capsule             = 96;
    TokenPolicyListResponse           token_policy_list_response       = 97;

    Error                             error                            = 99;
    GenesisLifecycleEvent             genesis_lifecycle                = 100;
    BootstrapMeasurementReport        bootstrap_measurement_report     = 101;
    BootstrapFinalizeResponse         bootstrap_finalize_response      = 102;


    // Secondary-device admission (§16.3) — co-present BLE handshake (request → gate-signed
    // admission). New device → existing device, then existing → new device.
    AddDeviceAdmissionRequestV1       device_admission_request         = 108;
    AddDeviceAdmissionV1              device_admission                 = 109;

    // Offline-bearer anchor status (signal (c)) — read-only `anchor.status` diagnostics.
    AnchorStatusResponse              anchor_status_response           = 112;

    // Offline-cash load/unload (two-regime money model): device-bound allocation balance.
    OfflineCashResponse               offline_cash_response            = 113;
    // Local-only responses: never routed through a storage node, so they sit
    // above the nodes' compiled-in payload allowlist without needing a redeploy.
    TokenBurnResponse                 token_burn_response              = 116;
    TokenFeeScheduleResponse          token_fee_schedule_response      = 117;
    // SoFi routes (SoFi §27), local-only like the token responses.
    SofiVaultCreatedResponse          sofi_vault_created_response      = 120;
    SofiSetupResponse                 sofi_setup_response              = 121;
    SofiFindRouteResponse             sofi_find_route_response         = 122;
    SofiPositionResponse              sofi_position_response           = 123;
    SofiRelayResponse                 sofi_relay_response              = 124;
    // A sealed spool payload (DSM Amendment A7). The envelope that carries it
    // has a message id and nothing else a node could read: no headers.
    SealedEnvelopeV1                  sealed                           = 125;


    // Reply to `token.forget`.
    TokenForgetResponse token_forget_response = 118;

    // Reply to `token.adoptionQr`.
    TokenAdoptionQrResponse token_adoption_qr_response = 119;
  }
  reserved 110, 111; // removed v1 counter-era bearer round-trip (BilateralBearerPrepared/Proceed)
  // 114 was a §16.6 reply-window payload variant; the return leg rides inside
  // UniversalTx (tag 10) as an explicit `receipt.countersign.b` invoke
  // (ReceiptCountersignB). Reserved so the number is never silently reused. The
  // device's strict envelope validator reads this oneof and these reservations
  // from the compiled proto; storage nodes do not open envelopes.
  reserved 114;
  reserved 115; // was token_mint_response: there is no minting after genesis (SoFi §48)
  reserved 98; // was reconciliation_response: bilateral.reconcile had no caller
  // 88 and 89 were storage_node_stats_response and storage_node_manage_response:
  // node counters the nodes never exposed, and a client-edited node list
  // nothing on a protocol path read (storage spec §10: the set is committed).
  reserved 88, 89;
  // 43 was secondary_device_response and 107 device_tree_snapshot_response:
  // no route produced either (the device tree store is not built).
  reserved 43, 107;
}

// ===================== Sealed spool payloads (DSM Amendment A7) =====================
// Everything a relationship sends through the spool is sealed end to end. The
// recipient decapsulates `kem_ciphertext` with its own Kyber secret; the shared
// secret and the envelope's message id give the one key the inner envelope is
// sealed under (`dsm::crypto::spool_seal`). For a transfer step the Kyber
// exchange is the step's own; for a message it is one made for it.
message SealedEnvelopeV1 {
  bytes kem_ciphertext = 1 [(dsm_fixed_len)=1088]; // ML-KEM-768 ciphertext to the recipient
  bytes ciphertext     = 2 [(dsm_max_len)=262144]; // XChaCha20-Poly1305 over the inner envelope bytes
}

// ===================== Device directory (owner, 2026-09-23) =====================
// Each device writes its own entry, signed with its AK, to the keyed cell
// H(DSM/device-directory-key/v1, genesis, device_id) under the namespace
// DSM/device-directory/v1. Nodes store every entry and check nothing; a reader
// keeps the entry whose AK hashes (with AttA) to the device id and whose
// signature verifies, highest counter first (dsm::core::identity::directory).
message DeviceDirectoryEntryBodyV1 {
  bytes  genesis          = 1 [(dsm_fixed_len)=32];
  bytes  device_id        = 2 [(dsm_fixed_len)=32];
  bytes  ak_public_key    = 3 [(dsm_fixed_len)=64];
  bytes  att_a            = 4 [(dsm_fixed_len)=32];
  bytes  kyber_public_key = 5 [(dsm_fixed_len)=1184];
  uint64 counter          = 6;
}
message DeviceDirectoryEntryV1 {
  DeviceDirectoryEntryBodyV1 body = 1;
  bytes signature                 = 2 [(dsm_max_len)=65536]; // SPHINCS+ by AK over the body digest
}

// ===================== SoFi routes (SoFi §27) =====================
// The app reaches SoFi only through these routes (handlers/sofi_routes.rs).
// Requests carry the user's intent; producers assemble, Core decides, and a
// route never interprets a storage read (SoFi §26). Token commits are 32-byte
// policy_commits; vault ids are 32 bytes; amounts are base units.

// sofi.createVault (§28). The beta market family is constant product with
// exact input and the beta release family is the owner's full close, so the
// owner chooses the pair, the reserves and the fee. The storage set is the
// network's pinned set, never chosen (DSM Amendment A5).
message SofiCreateVaultRequest {
  bytes  token_a_policy_commit = 1 [(dsm_fixed_len)=32]; // token_a < token_b, bytewise
  bytes  token_b_policy_commit = 2 [(dsm_fixed_len)=32];
  uint64 reserve_a             = 3;                      // > 0
  uint64 reserve_b             = 4;                      // > 0
  uint32 fee_bps               = 5;                      // < 10000
}
message SofiVaultCreatedResponse {
  bytes  vault_id = 1 [(dsm_fixed_len)=32];
  uint64 position = 2; // the owner's economic position that carries the creation
}

// sofi.setup (§29): set up with a vault once, before trading against it.
message SofiSetupRequest {
  bytes vault_id = 1 [(dsm_fixed_len)=32];
}
message SofiSetupResponse {
  bytes  setup_ref = 1 [(dsm_fixed_len)=32]; // ρ
  uint64 position  = 2;
}

// sofi.findRoute (§30, §27): path search over walked vault heads. A hop list
// carries no authority.
message SofiFindRouteRequest {
  bytes  token_in_policy_commit  = 1 [(dsm_fixed_len)=32];
  bytes  token_out_policy_commit = 2 [(dsm_fixed_len)=32];
  uint64 amount_in               = 3;
}
message SofiHopV1 {
  bytes  vault_id                = 1 [(dsm_fixed_len)=32];
  bytes  parent_root             = 2 [(dsm_fixed_len)=32]; // the walked head the hop prices against
  bytes  token_in_policy_commit  = 3 [(dsm_fixed_len)=32];
  bytes  token_out_policy_commit = 4 [(dsm_fixed_len)=32];
  uint64 amount_in               = 5;
  uint64 amount_out              = 6;
}
message SofiFindRouteResponse {
  repeated SofiHopV1 hops = 1; // empty when no route exists
}

// sofi.trade (§31): one hop against one vault.
message SofiTradeRequest {
  bytes  vault_id               = 1 [(dsm_fixed_len)=32];
  bytes  token_in_policy_commit = 2 [(dsm_fixed_len)=32];
  uint64 amount_in              = 3;
  uint64 min_amount_out         = 4;
}

// sofi.route (§31): a multihop route, all or none, through distinct vaults in
// hop order (at most ROUTE_MAX_LEGS).
message SofiRouteRequest {
  repeated bytes vault_ids      = 1 [(dsm_fixed_len)=32];
  bytes  token_in_policy_commit = 2 [(dsm_fixed_len)=32];
  uint64 amount_in              = 3;
  uint64 min_amount_out         = 4;
}

// sofi.close (§32): the owner closes its own vault under its release policy.
message SofiCloseRequest {
  bytes vault_id = 1 [(dsm_fixed_len)=32];
}

// sofi.resolve (§27): resolve and advance the device's pending position.
message SofiResolveRequest {}

// Where a trade, route, close or resolve left the device's position.
// Predicates are Valid or Invalid only; RETRIES_EXHAUSTED is the separate
// network status (the predicates held, the network retries ran out).
enum SofiPositionState {
  SOFI_POSITION_STATE_UNSPECIFIED       = 0;
  SOFI_POSITION_STATE_REALIZED          = 1;
  SOFI_POSITION_STATE_VOID              = 2; // nothing executed, no balance moved
  SOFI_POSITION_STATE_INVALID           = 3; // the predicates failed
  SOFI_POSITION_STATE_RETRIES_EXHAUSTED = 4; // the network retries ran out
}
message SofiPositionResponse {
  uint64            position = 1;
  SofiPositionState state    = 2;
}

// sofi.relay (§33): complete any registered fulfillment whose hops are not all
// final. Needs nothing from the trader beyond naming the position.
message SofiRelayRequest {
  bytes  trader_genesis   = 1 [(dsm_fixed_len)=32];
  bytes  trader_device_id = 2 [(dsm_fixed_len)=32];
  uint64 position         = 3;
}
message SofiRelayResponse {
  uint32 cells_written = 1;
}

// ===================== §16.6 REPLY WINDOW =====================
// Online finalization is driven by the recipient's countersignature, NOT by
// storage-node message deletion (which is best-effort GC). The return leg is the
// ADR 0003 B-side DELTA — `ReceiptCountersignB`, defined beside `ReceiptEvidenceA`
// below — carried as the ArgPack body of a `receipt.countersign.b` invoke on the
// same b0x spool the forward transfer used, addressed to the tip the SENDER polls
// (its projection parent). Discrimination is by that explicit method name — never a
// trial-decode of the forward transfer. The sender matches the delta to its ONE
// persisted proposal by `commitment`, overlays it onto the A-side receipt it froze
// at send, verifies against that proposal's CANONICAL pair, then finalizes.

// ===================== SDK INIT / STATUS =====================
// Returned when the app attempts to mark the SDK/wallet "initialized" but a
// mandatory prerequisite is missing.
message InitFailed {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    PLATFORM_CONTEXT_MISSING = 2;
    INVALID_INPUT = 3;
  }
  Reason reason = 1;
  string message = 2;
}

// ============ RECOVERY OPERATIONS (binary IDs) ==============

message ArchitectureInfoProto {
  string status = 1;
  string device_arch = 2;
  string supported_abis = 3;
  string message = 4;
  string recommendation = 5;
}
message RecoveryCapsuleDecryptRequest { bytes encrypted_capsule = 1 [(dsm_max_len)=4096]; bytes mnemonic_key = 2 [(dsm_fixed_len)=32]; }
message RecoveryCapsuleDecryptResponse{
  bool   success          = 1;
  Hash32 global_root      = 2;
  repeated ChainTip chain_tips = 3;
  Hash32 receipt_rollup   = 4;
  bytes  meta_data        = 5 [(dsm_max_len)=256]; // version/flags/counters only
}
message SmtLeaf     { uint64 index = 1; Hash32 value = 2; }
message SmtSnapshot { uint32 height = 1; uint64 leaf_count = 2; repeated SmtLeaf leaves = 3; }
message PersistedRelationshipState {
  bytes  device_id = 1 [(dsm_fixed_len)=32];
  SmtSnapshot tree_snapshot = 2;
  Hash32 last_head = 3;
  uint64 local_counter_confirmed = 4;
  uint64 pending_counter = 5; // 0 == none
  uint64 remote_counter_confirmed = 6;
}
message ReceiptGuardSnapshotProto { uint64 capacity = 1; repeated uint64 sequence = 2; }
message PersistedOfflineState { uint32 version = 1; repeated PersistedRelationshipState relationships = 2; ReceiptGuardSnapshotProto guard_snapshot = 3; }
message ChainTip { bytes counterparty_device_id = 1 [(dsm_fixed_len)=32]; uint64 height = 2; Hash32 head_hash = 3; }
message RecoveryTombstoneRequest { Hash32 global_root = 1; uint64 counter = 2; Hash32 rollup_hash = 3; bytes device_entropy = 4 [(dsm_max_len)=4096]; bytes environment_data = 5 [(dsm_max_len)=4096]; }
message RecoveryTombstoneResponse{ bool success = 1; Hash32 tombstone_hash = 2; bytes tombstone_receipt = 3 [(dsm_max_len)=4096]; }
message RecoverySuccessionRequest { Hash32 tombstone_hash = 1; bytes device_entropy = 2 [(dsm_max_len)=4096]; bytes environment_data = 3 [(dsm_max_len)=4096]; }
message RecoverySuccessionResponse{ bool success = 1; Hash32 succession_hash = 2; bytes succession_receipt = 3 [(dsm_max_len)=4096]; Hash32 new_genesis_hash = 4; }
message RecoveryResumeRequest  { bytes counterparty_device_id = 1 [(dsm_fixed_len)=32]; Hash32 last_head_hash = 2; uint64 last_height = 3; }
message RecoveryResumeResponse { bool success = 1; Hash32 new_transaction_hash = 2; bytes transaction_receipt = 3 [(dsm_max_len)=4096]; }

// Internal codec for `dsm::recovery::tombstone::TombstoneReceipt` — the
// SPHINCS+-signed device-invalidation receipt. Replaces prior bincode
// serialization so recovery state stays on the protobuf-only wire.
message TombstoneReceiptProto {
  string device_id       = 1;
  bytes  old_smt_root    = 2 [(dsm_fixed_len)=32];
  uint64 old_counter     = 3;
  bytes  old_rollup_hash = 4 [(dsm_fixed_len)=32];
  reserved 5;
  reserved "tick";
  bytes  signature       = 6 [(dsm_max_len)=65535]; // SPX256f = 49_856 bytes
  bytes  tombstone_hash  = 7 [(dsm_fixed_len)=32];
}

// Internal codec for `dsm::recovery::tombstone::ContactTombstoneAck` — a
// contact's acknowledgement that it recorded a device's tombstone, signed by
// the contact's AK over H(DSM/recovery-ack; tombstone_hash || device_id).
message ContactTombstoneAckProto {
  bytes tombstone_hash          = 1 [(dsm_fixed_len)=32];
  bytes acknowledging_device_id = 2 [(dsm_fixed_len)=32];
  bytes signature               = 3 [(dsm_max_len)=65535]; // SPX256f = 49_856 bytes
}

// Wire codec for `dsm::recovery::authority_anchor::RecoveryAuthorityAnchor`
// (spec §0.5 step 5) — the genesis-chained declaration anchoring a device's
// recovery-authority SPHINCS+ pubkey. `device_signature` is by the genesis
// signing key (genesis binding); `authority_signature` is by K_A (possession).
message RecoveryAuthorityAnchorProto {
  bytes genesis_id              = 1 [(dsm_fixed_len)=32];
  bytes device_id               = 2 [(dsm_fixed_len)=32];
  bytes authority_pubkey_commit = 3 [(dsm_fixed_len)=32]; // H(K_A_pub)
  bytes device_signature        = 4 [(dsm_max_len)=65535]; // SPX256f genesis-key sig
  bytes authority_signature     = 5 [(dsm_max_len)=65535]; // SPX256f K_A sig
}

// Authenticated Enumerable Per-Device SMT posting (spec §0.5, gap 13) — the
// signed HEAD of a device's posted PDSMT snapshot used for recovery gate-set
// enumeration. DUAL-KEYED: addressed by `device_id` (the PDSMT and rel_key are
// device-scoped) but carries `genesis_id` and is signed by the genesis-anchored
// recovery authority (`authority_pubkey_commit` == H(K_A_pub), bound via the
// RecoveryAuthorityAnchor). `signature` covers all other fields (BLAKE3
// domain-separated digest). Device selects the PDSMT; genesis authenticates the
// authority. Storage is availability-only; clients verify.
message PostedPdsmtHeadV1 {
  bytes  genesis_id              = 1 [(dsm_fixed_len)=32];
  bytes  device_id               = 2 [(dsm_fixed_len)=32];
  bytes  pd_smt_root             = 3 [(dsm_fixed_len)=32];
  bytes  leaf_index_root         = 4 [(dsm_fixed_len)=32];
  bytes  snapshot_id             = 5 [(dsm_fixed_len)=32];
  bytes  authority_pubkey_commit = 6 [(dsm_fixed_len)=32]; // H(K_A_pub)
  // Append-only head chain (R4 layer 1): each head links its predecessor and
  // carries a monotone position. The genesis head uses parent_head_hash = 32 zero
  // bytes and head_number = 0. head_hash (not stored) = the signing digest().
  bytes  parent_head_hash        = 7 [(dsm_fixed_len)=32];
  uint64 head_number             = 8;
  bytes  signature               = 9 [(dsm_max_len)=65535]; // SPX256f K_A sig over the head digest
  // Raw recovery-authority pubkey (K_A_pub) that produced `signature`. A third party can
  // verify the head WITHOUT a separate pubkey source: require H(authority_pubkey) ==
  // authority_pubkey_commit AND that commit == the genesis-anchored commit (from the
  // RecoveryAuthorityAnchor), then verify the signature under authority_pubkey. Presence
  // alone is NOT authority — trust still flows from the bind-once anchored commit.
  bytes  authority_pubkey        = 10 [(dsm_max_len)=4096]; // SPX256f pk
}

// Canonical value-capability (R4 anti-shrink) — the ONLY representation; there is no
// legacy bool. UNSPECIFIED(0) is invalid and MUST be rejected on decode (never read as
// NO). YES/UNKNOWN include in the recovery gate; only proven NO excludes.
enum ValueCapabilityV1 {
  VALUE_CAPABILITY_V1_UNSPECIFIED = 0; // invalid sentinel — decode rejects
  VALUE_CAPABILITY_V1_YES         = 1;
  VALUE_CAPABILITY_V1_NO          = 2;
  VALUE_CAPABILITY_V1_UNKNOWN     = 3;
}

// One enumerable, committed leaf/index record of a posted PDSMT snapshot.
// `value_capability` is part of the SIGNED/COMMITTED record (committed under
// `leaf_index_root`) — NOT server metadata. `counterparty_genesis_id` is optional
// context (empty if unknown): it cannot compute `rel_key` (device-pair derived) but
// is useful once C's device membership under its own genesis is verified.
message PostedPdsmtLeafRecordV1 {
  bytes            genesis_id                         = 1 [(dsm_fixed_len)=32];
  bytes            owner_device_id                    = 2 [(dsm_fixed_len)=32];
  bytes            rel_key                            = 3 [(dsm_fixed_len)=32];
  bytes            counterparty_device_id             = 4 [(dsm_fixed_len)=32];
  bytes            counterparty_genesis_id            = 5 [(dsm_max_len)=32]; // optional (empty if unknown)
  bytes            current_tip                        = 6 [(dsm_fixed_len)=32];
  ValueCapabilityV1 value_capability                  = 7;
  string           value_capability_reason            = 8;
  bytes            inclusion_proof_to_pd_smt_root     = 9  [(dsm_max_len)=65535];
  bytes            inclusion_proof_to_leaf_index_root = 10 [(dsm_max_len)=65535];
}

// The enumerable leaf set posted alongside a PDSMT head (availability-only; the head's
// signed `leaf_index_root` is the authority — a verifier checks every leaf against it).
message PostedPdsmtLeafSetV1 {
  repeated PostedPdsmtLeafRecordV1 leaves = 1;
}

// Wire codec for `dsm::recovery::tombstone::SuccessionReceipt` (mirrors
// TombstoneReceiptProto) — the SPHINCS+-signed new-device succession receipt.
message SuccessionReceiptProto {
  string device_id             = 1;
  bytes  tombstone_hash        = 2 [(dsm_fixed_len)=32];
  bytes  new_device_commitment = 3 [(dsm_max_len)=512];
  reserved 4;
  reserved "tick";
  bytes  signature             = 5 [(dsm_max_len)=65535]; // SPX256f
  bytes  succession_hash       = 6 [(dsm_fixed_len)=32];
}

// Wire codec for `dsm::recovery::activation::RecoveryActivationSeal` (§0.5) — the
// gate-set seal validated by validate_recovery_activation.
message RecoveryActivationSealProto {
  bytes  genesis_id                = 1 [(dsm_fixed_len)=32];
  bytes  old_device_id             = 2 [(dsm_fixed_len)=32];
  bytes  new_device_id             = 3 [(dsm_fixed_len)=32];
  bytes  recovery_intent_digest    = 4 [(dsm_fixed_len)=32];
  bytes  tombstone_proposal_digest = 5 [(dsm_fixed_len)=32];
  bytes  contact_set_commit        = 6 [(dsm_fixed_len)=32];
  bytes  evidence_root             = 7 [(dsm_fixed_len)=32];
  uint64 synced_contact_count      = 8;
  bytes  final_per_device_smt_root = 9 [(dsm_fixed_len)=32];
  bytes  final_receipt_roll        = 10 [(dsm_fixed_len)=32];
}

// The recovery bundle (§0.5 Phase C) — the transmitted succession artifacts. It carries
// the genesis-anchored recovery authority pubkey, the tombstone/succession pair, and the
// activation seal. It deliberately does NOT inline per-counterparty evidence: that is
// re-derived + re-verified from each counterparty's OWN posted, genesis-authenticated
// state (its PDSMT head + relationship state history) — the §0.5 posted-state authority,
// fetched not bundled. Sub-objects are nested canonical bytes (each via its own codec).
message RecoveryBundleV1 {
  bytes authority_pubkey = 1 [(dsm_max_len)=4096];  // K_A_pub (SPHINCS+ pk)
  bytes tombstone        = 2 [(dsm_max_len)=65535]; // TombstoneReceipt.to_bytes
  bytes succession       = 3 [(dsm_max_len)=65535]; // SuccessionReceipt.to_bytes
  bytes activation_seal  = 4 [(dsm_max_len)=4096];  // RecoveryActivationSeal.to_bytes
}

// ── Relationship-state evidence postings (spec §0.5 Phase D prerequisite) ──────────────
// PDSMT heads/leaves prove "what the current tip IS" plus value-capability; they do NOT
// prove HOW a relationship reached that tip. Recovery succession needs each counterparty's
// actual relationship-state material so the verifier can prove ancestry (h_cap ->* current)
// and successor establishment (the (A_new,C) first state binding the carry-forward
// commitment). These objects are AVAILABILITY-ONLY and CONTENT-ADDRESSED; the client
// recomputes every state's chain tip and the ancestry walk locally. Storage never attests.

// Faithful wire codec for `dsm::types::device_state::RelationshipChainState`. Round-trips
// EVERY field that feeds the v2 chain-tip preimage (rel_key, embedded_parent,
// counterparty_devid, canonical operation bytes, entropy, optional encapsulated_entropy)
// plus the two optional signatures (NOT hashed — they sign the digest). proto3 `optional`
// distinguishes None from an empty Some, which the chain-tip hash treats differently; a
// faithful round-trip is REQUIRED so a decoder can recompute the tip and assert equality.
message RelationshipChainStateProto {
  bytes  rel_key             = 1 [(dsm_fixed_len)=32];
  bytes  embedded_parent     = 2 [(dsm_fixed_len)=32];
  bytes  counterparty_devid  = 3 [(dsm_fixed_len)=32];
  bytes  operation           = 4 [(dsm_max_len)=1048576]; // Operation::to_bytes (canonical)
  bytes  entropy             = 5 [(dsm_max_len)=65535];
  optional bytes encapsulated_entropy = 6 [(dsm_max_len)=65535]; // None vs Some(empty) preserved
  reserved 8; // removed: balance_witness — the relationship chain-tip commitment is
              // balance-free (DSM/relationship-chain-tip/v2); R_econ is the sole
              // authenticated online balance representation
  optional bytes entity_sig       = 9  [(dsm_max_len)=65535]; // SPX256f
  optional bytes counterparty_sig = 10 [(dsm_max_len)=65535]; // SPX256f
  reserved 11; // removed: legacy Safe-7 island_attestation (no longer folded into compute_chain_tip)
}

// A contiguous forward-ancestry segment of ONE relationship chain (rel_key), covering a
// counterparty's states from the capsule floor `floor_tip` (h_cap, EXCLUSIVE) up to
// `current_tip` (T_old_current). Content-id = BLAKE3("DSM/recovery/rel-chain-segment/v1" ||
// canonical-bytes). The verifier recomputes each state's chain tip, checks adjacency
// floor ->* current via embedded_parent, and that rel_key is uniform. An EMPTY `states` is
// valid iff floor_tip == current_tip (the no-divergence common case).
message RelationshipChainSegmentV1 {
  bytes rel_key     = 1 [(dsm_fixed_len)=32];
  bytes floor_tip   = 2 [(dsm_fixed_len)=32]; // h_cap (segment starts AFTER this)
  bytes current_tip = 3 [(dsm_fixed_len)=32]; // T_old_current (segment ends here)
  repeated RelationshipChainStateProto states = 4;
}

// The new (A_new,C) bilateral establishment receipt (rel_key = new_rel_key) — the FIRST
// state of the successor relationship whose CreateRelationship op binds the carry-forward
// commitment. Content-id = BLAKE3("DSM/recovery/establish-receipt/v1" || canonical-bytes).
// The verifier checks it is a first-state establishment and that the carry-forward
// commitment is bound INTO the signed state hash (see verify_succession_semantics).
message RecoveryEstablishmentReceiptV1 {
  bytes rel_key                     = 1 [(dsm_fixed_len)=32]; // new_rel_key
  RelationshipChainStateProto state = 2;
}

// A device's K_A-signed dBTC vault index (P5 dBTC enumeration). The healthy device posts the
// list of its dBTC vault ids; a recovering device fetches it as the CANDIDATE set to
// reconcile. Authenticated like PostedPdsmtHeadV1 (carries authority_pubkey; H(it) ==
// authority_pubkey_commit == the genesis-anchored commit; signature over the digest).
// Enumeration completeness is NOT a safety property — per-vault Bitcoin backing verification
// is the gate — so a forged/partial index only yields Bitcoin-verify-out or a locked deadlock,
// never a double-spend. Availability-only storage; clients verify.
message PostedDbtcVaultIndexV1 {
  bytes  genesis_id              = 1 [(dsm_fixed_len)=32];
  bytes  device_id               = 2 [(dsm_fixed_len)=32];
  repeated string vault_ids      = 3; // Base32 Crockford vault ids
  bytes  authority_pubkey_commit = 4 [(dsm_fixed_len)=32]; // H(K_A_pub)
  bytes  authority_pubkey        = 5 [(dsm_max_len)=4096]; // SPX256f pk (carried; checked vs commit)
  bytes  signature               = 6 [(dsm_max_len)=65535]; // SPX256f K_A sig over the digest
}

// Lightweight recovery succession proof (spec §0.5 — bilateral re-establish). A_new posts the
// minimal artifacts a counterparty C needs to run its re-establish accept-guard BEFORE
// co-signing: the genesis-anchored recovery authority pubkey (K_A_pub) plus the
// tombstone/succession pair proving A_new succeeds A_old. Distinct from RecoveryBundleV1 (which
// also carries the activation seal — produced only AFTER all re-establishes, so unavailable at
// re-establish time). Sub-objects are nested canonical bytes via their own codecs. Availability
// -only; C genesis-anchors authority_pubkey via A_new's RecoveryAuthorityAnchor before trusting.
message RecoverySuccessionProofV1 {
  bytes authority_pubkey = 1 [(dsm_max_len)=4096];  // K_A_pub (SPHINCS+ pk)
  bytes tombstone        = 2 [(dsm_max_len)=65535]; // TombstoneReceipt.to_bytes
  bytes succession       = 3 [(dsm_max_len)=65535]; // SuccessionReceipt.to_bytes
}

// ==================== Minimal deterministic identity =================
// A device's contact card. Its text form, the contact code, is written by
// `identity.contact_code` and read by `contacts.readContactCode`. The card
// names no nodes: the reader resolves the device's directory entry on the
// pinned set of the network the card names.
message ContactQrV3 {
  reserved 3, 4;
  reserved "storage_nodes", "sdk_fingerprint";
  bytes  device_id       = 1 [(dsm_fixed_len)=32]; // raw 32-byte device identifier
  string network         = 2; // the network the device's genesis committed; a reader on another network refuses the card
  bytes  genesis_hash    = 5 [(dsm_fixed_len)=32]; // raw 32-byte genesis hash
  bytes  signing_public_key = 6 [(dsm_fixed_len)=64]; // SPHINCS+ SPX256s public key for bilateral verification
  string preferred_alias = 7; // Optional alias the card's owner suggests
}

message ContactManualAddRequest {
  string alias = 1;
  bytes  device_id = 2 [(dsm_fixed_len)=32];
  bytes  genesis_hash = 3 [(dsm_fixed_len)=32];
  bytes  signing_public_key = 4 [(dsm_fixed_len)=64];
}

// ==================== Contacts (canonical results) ==================
message ContactAddResponse {
  string alias = 1;
  bytes  device_id = 2 [(dsm_fixed_len)=32];
  Hash32 genesis_hash = 3;
  optional Hash32 chain_tip = 4;
  // 5 carried an SMT proof of the chain tip that no producer ever set.
  reserved 5;
  reserved "chain_tip_smt_proof";
  optional bytes alias_binding = 6 [(dsm_max_len)=4096];
  bool   genesis_verified_online = 7;
  // A contact carries no verification or addition time.
  reserved 8, 9;
  reserved "verify_counter", "added_counter";
  repeated string verifying_storage_nodes = 10;
  string ble_address = 11; // BLE MAC address for offline bilateral transfers
  bytes  signing_public_key = 12 [(dsm_fixed_len)=64]; // SPHINCS+ SPX256s public key for bilateral verification
  RelationshipSendStatus send_status = 13;
}

// ======================== Faucet Operations =========================
message FaucetClaimRequest  { bytes device_id = 1 [(dsm_fixed_len)=32]; }
message FaucetClaimResponse {
  bool success = 1;
  uint64 tokens_received = 2;
  // A claim has no cooldown, so there is no next claim index.
  reserved 3;
  reserved "next_available_index";
  string message = 4;
}

// ======================= Online Transfer Messages ====================
message OnlineTransferRequest {
  string token_id = 1;
  bytes to_device_id = 2 [(dsm_fixed_len)=32];
  uint64 amount = 3;
  string memo = 4;
  bytes signature = 5 [(dsm_max_len)=65535]; // optional sender signature (crypto proof)
  // Deterministic 32-byte nonce signed by sender to prevent replays (AF-2)
  bytes nonce = 6 [(dsm_fixed_len)=32];
  // Envelope v3 signing context (AF-2 remediation)
  bytes from_device_id = 7 [(dsm_fixed_len)=32]; // REQUIRED: sender identity for key selection
  // The SDK derives the relationship tip itself; a caller never supplies it.
  // DSM keeps no counter: a transfer is ordered by its chain tip alone.
  reserved 8, 9;
  reserved "chain_tip", "seq";
  // 10 was `receipt_commit`: the inline full-receipt composition (168,400 B
  // against the node's 128 KiB cap, failing every send with 413). Deleted under
  // ADR 0003 — the A-side receipt travels as its own artifact, referenced by
  // `receipt_evidence_digest` (12). Reserved so the number is never reused.
  reserved 10;
  // §4.2.1 Canonical unsigned Operation bytes (signing preimage).
  // Sender populates with signing_op.to_bytes() (signature field empty).
  // Receiver MUST use these bytes directly for SPHINCS+ verification and
  // h_{n+1} tip computation — no reconstruction from individual fields.
  bytes canonical_operation_bytes = 11 [(dsm_max_len)=65535];
  // ADR 0003: content address of the A-side receipt-evidence artifact this
  // transfer refers to. Role-domain-separated
  // (BLAKE3("DSM/receipt-evidence/A/v1" ‖ full_wire_bytes)) and computed over
  // the FULL wire bytes, never ReceiptCommit::compute_commitment(), which
  // hard-zeroes fields 12-20 — a commitment-addressed object could be served
  // with substituted signatures.
  //
  // A dedicated field rather than reusing 10: the two carry different semantic
  // types (a 32-byte address vs a full object), and encoding both in one field
  // would make "which form is this?" a runtime guess.
  bytes receipt_evidence_digest = 12 [(dsm_fixed_len)=32];
  // ── Sender economic locators (3.5b) ──────────────────────────────────────
  // Sender economic coordinates on OnlineTransferRequest are untrusted
  // locators, never authority; the verifier accepts them only after the
  // resolved ValidatedEconomicRoot proves that the named debit belongs to the
  // exact signed online Transfer addressed to this consuming identity.
  // The values are OUTPUTS of the sender's built admission (the admitted
  // position and THE debit mutation index of the exact write set), populated
  // in the same staged build phase that freezes this envelope — never
  // predicted beside it.
  uint64 sender_economic_position = 13;
  uint32 sender_debit_mutation_index = 14;
}

// ADR 0003: the A-side receipt evidence, carried as its OWN b0x artifact
// rather than inline in the transfer. Its own message and its own invoke
// method -- it is not an Operation and must not be threaded through one.
//
// INVARIANT:
//   receipt_evidence_digest == BLAKE3("DSM/receipt-evidence/A/v1\0" || full_receipt_bytes)
//
// The digest here is cryptographically redundant (the recipient can recompute
// it) but structurally useful: the artifact can identify itself before the
// recipient has paired it with a transfer. The AUTHORITATIVE binding remains
// the digest in field 12 of the transfer.
message ReceiptEvidenceA {
  // The transfer artifact this evidence belongs to, for correlation while
  // staging. Not authority -- the digest is.
  string transfer_submission_id = 1;
  bytes  receipt_evidence_digest = 2 [(dsm_fixed_len)=32];
  // The FULL ReceiptCommit wire object: canonical fields plus sig_a,
  // ek_cert_a, ek_pk_a and Kyber material. ~118 KB with production-sized
  // SPHINCS+ material, against the node's 128 KiB envelope cap.
  bytes  full_receipt_bytes = 3 [(dsm_max_len)=131072];
}

// ADR 0003 return leg: the B-side countersign DELTA. The sender retains the
// full A-side receipt it authored (sender_outbox_artifacts, role evidence_a);
// the recipient returns ONLY what the sender lacks. Carried as the ArgPack body
// of a `receipt.countersign.b` invoke on the sender's projection-parent b0x
// address. The sender reconstructs the countersigned receipt = ITS OWN retained
// A bytes + these four fields, then runs the unchanged acceptance verifier.
// That reconstruction is the load-bearing binding: B material can only ever be
// judged against the A side the sender itself authored. `receipt_evidence_digest_a`
// is advisory consistency evidence naming which A bytes the recipient
// countersigned (nothing B signs covers it); a mismatch parks the step, it
// does not authenticate anything.
//
// NORMATIVE (ADR 0003 wire budget): exactly TWO SPHINCS+ signature-sized
// objects, sig_b and ek_cert_b. ~101 KB with production material against
// the node's 128 KiB envelope cap; a third signature-sized field breaks it.
//
// receipt_evidence_digest_a == BLAKE3("DSM/receipt-evidence/A/v1\0" || A-side full_receipt_bytes)
// A full ReceiptCommit body on this method is refused at the wire (unknown field 7+).
message ReceiptCountersignB {
  bytes commitment                = 1 [(dsm_fixed_len)=32]; // receipt/proposal commitment: the sender's lookup key
  bytes receipt_evidence_digest_a = 2 [(dsm_fixed_len)=32]; // which A bytes B countersigned (advisory; see above)
  bytes sig_b                     = 3 [(dsm_max_len)=65535];
  bytes ek_cert_b                 = 4 [(dsm_max_len)=65535];
  bytes ek_pk_b                   = 5 [(dsm_max_len)=65535];
  bytes kyber_ct_b                = 6 [(dsm_max_len)=2048];
  // The recipient's own canonical relationship pair for the applied step: its
  // local lineage head before this apply (parent) and after it (child) — the
  // exact parent the recipient will sign under when IT next originates.
  // Authenticated: `sig_b` is computed over
  // BLAKE3("DSM/receipt-b-canonical/v1" || standard_target || b_parent_tip || b_child_tip),
  // so a substituted pair fails the sender's countersignature check. The
  // sender CASes its counterparty-canonical-head record from parent to child.
  bytes b_parent_tip              = 7 [(dsm_fixed_len)=32];
  bytes b_child_tip               = 8 [(dsm_fixed_len)=32];
  // 3.5b PR4: the CONTENT ADDRESS of the recipient's post-admission RELEASE
  // (namespace DSM/recipient-economic-release/v1; the ~50KB SPHINCS+ release
  // inline would exceed the reply-envelope cap). The countersign DELTA must
  // carry it and the sender finalizes only after fetching + verifying the
  // exact release bytes AND independently validating the registered root the
  // release names — bare sig_b is acceptance provenance, insufficient to
  // finalize. Left EMPTY inside acceptance bundles (the provenance object),
  // which never carry finalization authority. The release object is frozen
  // in the ADMIT transaction, never earlier.
  bytes recipient_economic_release_addr = 9 [(dsm_fixed_len)=32];
}

// Bilateral finality certificate (finality barrier). The SENDER issues it after
// finalizing on the recipient's countersignature: it names the exact
// transition and both sides' canonical heads for it, signed by the sender's
// per-step EK for that transition (the same key the recipient chained
// `ek_pk_a` for). The sender's gate is released only once this artifact
// reaches storage quorum; the recipient's next origination is released only
// once it verifies it. Method `relationship.finalized.v1`; deterministic id
// derived from the artifact digest; frozen route = the recipient's route.
message RelationshipFinalizedV1 {
  bytes relationship_key       = 1 [(dsm_fixed_len)=32];
  bytes transition_commitment  = 2 [(dsm_fixed_len)=32]; // the receipt commitment
  bytes sender_device_id       = 3 [(dsm_fixed_len)=32];
  bytes recipient_device_id    = 4 [(dsm_fixed_len)=32];
  bytes sender_child_tip_a     = 5 [(dsm_fixed_len)=32]; // the sender's signed child (proposal.canonical_child)
  bytes recipient_parent_tip_b = 6 [(dsm_fixed_len)=32]; // the recipient's pair from the delta
  bytes recipient_child_tip_b  = 7 [(dsm_fixed_len)=32];
  bytes signature_a            = 8 [(dsm_max_len)=65535]; // SPHINCS+ by the sender's per-step EK over the v1 target
}

message OnlineTransferSmartRequest {
  string recipient = 1; // Alias or Base32 ID
  string amount = 2; // Decimal string
  string token_id = 3;
  string memo = 4;
}

message OnlineTransferResponse {
  bool success = 1;
  Hash32 transaction_hash = 2;
  string message = 3;
  optional uint64 new_balance = 4; // absent when the post-send balance could not be read
}

// ======================= Online Message Messages ====================
message OnlineMessageRequest {
  bytes to_device_id = 1 [(dsm_fixed_len)=32];
  bytes payload = 2 [(dsm_max_len)=4096];
  string memo = 3;
  bytes signature = 4; // optional sender signature
  bytes nonce = 5 [(dsm_fixed_len)=32];
  bytes from_device_id = 6 [(dsm_fixed_len)=32];
  bytes chain_tip = 7 [(dsm_fixed_len)=32];
  // DSM keeps no counter: a message is ordered by its chain tip alone.
  reserved 8;
  reserved "seq";
}

message OnlineMessageResponse {
  bool success = 1;
  string message = 2;
  bytes message_id = 3 [(dsm_fixed_len)=16];
}


message TokenPolicyCacheEntry {
  bytes  policy_commit = 1 [(dsm_fixed_len)=32];
  bytes  policy_bytes  = 2 [(dsm_max_len)=131072];
  string ticker        = 3;
  string alias         = 4;
  uint32 decimals      = 5;
  string max_supply    = 6;
}

message TokenPolicyListResponse { repeated TokenPolicyCacheEntry policies = 1; }

// ======================= Query Result Messages ======================
message BalanceGetResponse {
  string token_id = 1;
  uint64 available = 2;   // CANONICAL base units
  uint64 locked = 3;      // CANONICAL base units
  string symbol = 4;
  uint32 decimals = 5;
  string token_name = 6;
  // Display form of `available`, rendered by Rust.
  //
  // Rust owns amount conversion in BOTH directions: it parses display input to
  // base units on the way in, and renders base units to display form on the way
  // out. A client that computes this itself is a second implementation of the
  // unit rule, and two implementations disagree — which is exactly how a token
  // holding 100,000 base units at 2 decimals came to be shown as "100000".
  string display_amount = 7;
  // The token's CPTA policy anchor, Base32 Crockford, rendered by Rust.
  //
  // A device that ADOPTS a token is shown its anchor; a device that CREATED one
  // had no way to see it at all, so a creator could not hand a peer the value a
  // peer needs. Carrying it here rather than joining a policy list by ticker
  // keeps ONE identity mapping: the registry's, resolved server-side. A ticker
  // join would be a second one, and two tokens can share a ticker.
  string policy_anchor_b32 = 8;
  // Short head of `policy_anchor_b32`, for visual comparison against the value
  // a peer is about to adopt. Never an identifier on its own.
  string anchor_fingerprint = 9;
  // The token's canonical id, BLAKE3(TAG_DSM_TOKEN_ID, anchor ‖ ticker).
  //
  // `token_id` (field 1) is the TICKER on this message — the key balances are
  // projected under — and a ticker is not an identity: two different tokens can
  // claim the same one, which is why adoption refuses a ticker collision. A
  // screen that labels the ticker "token id" is telling the user something
  // false, so carry the real value.
  string canonical_token_id = 10;
  // The icon field of the token's anchored policy, as Rust read it.
  //
  // Presentation only. A token created with coin artwork carries its canonical
  // silhouette here ("dsm:coin:v1:" + Base32 Crockford) and the wallet draws the
  // coin from it in its own theme; without artwork the wallet cuts the ticker
  // through the coin. Empty for protocol assets and for policies that name no
  // icon. Rust never interprets it and nothing resolves a token by it.
  string icon_url = 11;
}
// Multi-token enumeration (ordered lexicographically by token_id on server side)
message BalancesListResponse { repeated BalanceGetResponse balances = 1; }
message TransactionInfo {
  string id            = 1;
  bytes  from_device_id= 2 [(dsm_fixed_len)=32];
  bytes  to_device_id  = 3 [(dsm_fixed_len)=32];
  string token_id      = 4;
  uint64 amount        = 5;
  // 6 was a fee: a transfer carries none, and the field was always 0.
  reserved 6;
  reserved "fee";
  // No history ordinal or time: the history is returned in order.
  reserved 7;
  reserved "logical_index";
  bytes  tx_hash       = 8 [(dsm_fixed_len)=32];
  sint64 amount_signed = 9; // signed amount for DLV/faucet: positive=incoming, negative=outgoing
  TransactionType tx_type = 10; // enumerated transaction type
  string status        = 11; // "completed", "confirmed", "pending", etc.
  string recipient     = 12; // alias or device ID text for UI display
  bytes  stitched_receipt = 13 [(dsm_max_len)=131072]; // canonical stitched receipt bytes (if available)
  reserved 14;
  reserved "created_at";
  string memo = 15; // optional memo/note
  bool   receipt_verified = 16; // true iff stitched_receipt passes cryptographic verification (SMT roots, tripwire, proofs)
  // Display form of `amount_signed`, rendered by Rust from the token's
  // registry decimals. `amount`/`amount_signed` stay canonical base units.
  string display_amount = 17;
}
message WalletHistoryResponse { repeated TransactionInfo transactions = 1; }
message ContactsListResponse  { repeated ContactAddResponse contacts = 1; }

// ========================= Geo Emissions (transport only) =========================
// Transport messages for clockless geo-claim submission and acknowledgment.
// Verification (spawn proof + SPHINCS+ signature over canonical bytes)
// is implemented in the Rust core; these are I/O envelopes only.
message MerkleInclusionProof {
  Hash32 root         = 1; // 32B Merkle root
  repeated bytes siblings = 2 [(dsm_fixed_len)=32]; // ordered root→leaf or leaf→root per implementation; see verifier notes
  uint32 leaf_index   = 3; // zero-based index of leaf
}

// ========================= B0x Inbox =========================
message InboxItem {
  string id              = 1;
  string preview         = 2;
  // An inbox item carries no time; items are listed in arrival order.
  reserved 3;
  reserved "tick";
  optional string sender_id = 4;
  // 5 was a payload the SDK always sent empty.
  reserved 5;
  reserved "payload";
  bool   is_stale_route  = 6; // arrived via previous (non-current) relationship tip
}
message InboxRequest {
  uint32 limit           = 1; // max items to retrieve (0 = use default)
  string chain_tip       = 2; // optional: filter by chain tip
}
message InboxResponse { repeated InboxItem items = 1; }

// ========================= Storage Sync =========================
message StorageSyncRequest {
  bool pull_inbox        = 1; // retrieve pending items from b0x
  bool push_pending      = 2; // submit local pending transactions
  uint32 limit           = 3; // max inbox items to pull (0 = default 100)
}
message StorageSyncResponse {
  bool   success         = 1;
  uint32 pulled          = 2; // items pulled from inbox
  uint32 processed       = 3; // items successfully processed
  uint32 pushed          = 4; // transactions pushed to storage
  repeated string errors = 5; // any errors encountered
}

// ========================= Canonical Proofs =========================
message SmtPathLeaf { bytes key = 1 [(dsm_fixed_len)=32]; bytes value = 2 [(dsm_fixed_len)=32]; }
message SmtProof {
  bytes key = 1 [(dsm_fixed_len)=32];
  oneof v_path {
    SmtPathLeaf existing_leaf = 2;
    bool absent = 3;
  }
  repeated bytes siblings = 4 [(dsm_fixed_len)=32]; // root→leaf, MSB-first
}

message DeviceTreeProof {
  repeated bytes siblings = 1 [(dsm_fixed_len)=32];
  bool leaf_to_root = 2;
  uint32 path_bits_len = 3; // number of bits in path_bits
  bytes path_bits = 4 [(dsm_max_len)=2048]; // packed LSB-first bitfield
}

// ========================= Device Tree =========================
//
// Whitepaper §16.3 ("Two Merkle Structures (No Renames)") + §2.3 device-set
// commitment. The Device Tree is the deterministic Merkle commitment over
// the owner's enrolled device identifiers (sorted lexicographic, padded
// with `Hpad = BLAKE3("DSM/dev-tree-pad\0")` on odd-arity levels). The
// root `R_G` is what gets published to storage on PUT /devtree/root.
//
// Domain tags (per `dsm::common::domain_tags`):
//   • `DSM/dev-leaf\0`     — Hleaf(DevID)
//   • `DSM/dev-merkle\0`   — Hnode(L, R)
//   • `DSM/dev-empty\0`    — empty-tree root
//   • `DSM/dev-tree-pad\0` — odd-arity padding leaf (distinct from Hleaf
//                            to block the CVE-2012-2459 second-preimage
//                            vector)
//
// V1 schema family (added in Phase B.1 / issue #272). The pre-existing
// `DeviceTreeEntry` + `DeviceTreeProof` messages remain in service for
// the registry-evidence flow that has production callers in
// `dsm_sdk::sdk::storage_node_sdk`, `ingress::self-heal`, and
// `verification::proof_primitives`. They are NOT deprecated by V1: V1
// adds the missing canonical-state-anchor + portable-proof carriers the
// PUT /devtree/root / GET /devtree/proof flow needs. Tasks B.3 (SDK
// add/remove_secondary_device) and B.4 (storage validator) consume the
// V1 messages directly; legacy flows keep using the pre-V1 messages.

// Sorted (by `device_id` ascending) leaf of the Device Tree. Optional
// `device_name` carries a UI-only label; it is NOT included in
// Hleaf(DevID) — the leaf hash binds the device_id only.
message DeviceLeafV1 {
  bytes  device_id   = 1 [(dsm_fixed_len)=32];
  string device_name = 2 [(dsm_max_len)=128];
}

// Canonical state anchor for a published Device Tree at a given version.
// `version_number` is the monotone counter the storage-node validator
// enforces on PUT /devtree/root; it MUST strictly increase between
// successive writes for a given genesis. `device_count` is the count of
// real (non-padding) leaves. `root_hash` is the 32-byte Merkle root.
//
// The `schema_version` byte is a forward-compatibility tag carried
// distinct from `version_number` (which is per-tree-state). Current
// value is 1; future changes to the canonical encoding will bump it.
message DeviceTreeV1 {
  uint32 schema_version = 1;                          // canonical-encoding version; currently 1
  bytes  root_hash      = 2 [(dsm_fixed_len)=32];     // 32-byte Merkle root R_G
  uint32 device_count   = 3;                          // count of real DevID leaves (>= 1 post-genesis)
  uint64 version_number = 4;                          // monotone counter; strictly increases per update
}

// Audit-trail record for a Device Tree root transition. Storage nodes
// retain this alongside the current `DeviceTreeV1` so consumers can
// reconstruct the version history without reading every prior tree.
//
// `signature` is a SPHINCS+ signature over the canonical concatenation
// `domain_hash("DSM/dev-tree-root-update/v1", old_root || new_root ||
// version_number_le_bytes)` by the root-binding key; verification is
// out of scope for B.1 and lands with the bounded-validator work in
// Phase B.4 (issue #275) once `RootBindingRecord` is in place
// (enrollment hardening, Phase 3).
message DeviceTreeRootUpdateV1 {
  bytes  old_root       = 1 [(dsm_fixed_len)=32];
  bytes  new_root       = 2 [(dsm_fixed_len)=32];
  uint64 version_number = 3;
  bytes  signature      = 4 [(dsm_max_len)=65536]; // SPHINCS+ SPX256f signature
}

// Portable Merkle inclusion proof for a specific Device Tree leaf. This
// is the wire format returned by GET /devtree/proof in Phase B.5
// (issue #276); the verifier reconstructs the path by walking siblings
// using `path_bits` (LSB-first per-level: 0 = current is left child,
// 1 = current is right child) and Hnode (`DSM/dev-merkle\0`) /
// Hleaf (`DSM/dev-leaf\0`) per `dsm::common::device_tree::DevTreeProof`.
//
// `path_bits` is a packed bitfield; `path_bits_len` is the number of
// valid bits (equal to `siblings.len()`). The `root_hash` field carries
// the root the proof was derived against, so a verifier can fail-closed
// if the caller-supplied tree state doesn't match.
message DeviceInclusionProofV1 {
  bytes  device_id     = 1 [(dsm_fixed_len)=32];
  bytes  root_hash     = 2 [(dsm_fixed_len)=32];
  repeated bytes siblings = 3 [(dsm_fixed_len)=32]; // root → leaf order
  uint32 path_bits_len = 4;
  bytes  path_bits     = 5 [(dsm_max_len)=2048]; // LSB-first packed bits
}

// Persistent state of a Device Tree for one genesis: the `DeviceTreeV1`
// summary (root, count, version) together with the canonical sorted +
// deduplicated `device_ids` list that produced it. The list is the
// authoritative source from which the root is recomputed; storing it
// alongside the summary lets callers (B.4 issue #276 inclusion-proof
// derivation) rebuild the Merkle tree byte-exactly from disk.
//
// Used as the SDK's local KV value under key `device_tree:{genesis}`
// (Phase B.3 issue #274) and as the persistence record alongside the
// validated published anchor on the storage node side (Phase B.4
// issue #275).
//
// Each `device_ids` element is fixed-width 32 bytes (the DevID width).
message DeviceTreeStateV1 {
  DeviceTreeV1 tree = 1;
  repeated bytes device_ids = 2 [(dsm_fixed_len)=32];
}

// Legacy / registry-evidence types — production callers retained.
message DeviceTreeEntry {
  bytes device_id = 1 [(dsm_fixed_len)=32];
  bytes genesis_hash = 2 [(dsm_fixed_len)=32];
  bytes parent_hash = 3 [(dsm_fixed_len)=32];
  uint32 tree_depth = 4;
  repeated bytes merkle_proof = 5 [(dsm_fixed_len)=32];
}

// ========================= Storage Status =========================
// `storage.status`: the storage set this device's traffic uses — its
// network's pinned set (storage spec §10) — and what each member answered
// when asked for its latest ByteCommit (§14). Every answer is an observation,
// never a verdict (§4): a member that did not answer has not failed, and a
// ByteCommit is as the member stated it, not as a verifier accepted it.
message StorageStatusRequest {}

message StorageStatusResponse {
  // A node count, a reachable count, a formatted size and the recovery
  // capsule status. The members and their answers replace the counts; the
  // capsule status is the recovery screen's.
  reserved 1, 2, 3, 4, 5;
  reserved "total_nodes", "connected_nodes", "last_sync_iter", "data_size", "backup_status";
  string network_id = 6;                          // the committed network the set is pinned for
  bytes  storage_set_id = 7 [(dsm_fixed_len)=32]; // re-derived from the members' (id, incarnation) pairs
  repeated StorageMemberStatus members = 8;       // in the set's member order
  uint64 completed_syncs = 9;                     // storage.sync runs that ran to their end on this device
  uint64 database_bytes = 10;                     // the size of this device's database file
}

// One member of the pinned set, and its answer to `bytecommit/latest`.
message StorageMemberStatus {
  bytes  member_id               = 1 [(dsm_max_len)=128]; // exactly as the set commits it
  bytes  register_incarnation_id = 2 [(dsm_fixed_len)=32];
  string endpoint                = 3;                     // transport, resolved outside committed state (§11)
  oneof answer {
    StorageMemberByteCommit latest = 4; // the member's latest ByteCommit, as it stated it
    StorageMemberNoCycle no_cycle  = 5; // the member states it has closed no cycle yet
    string unanswered              = 6; // why there is no ByteCommit of this member's to show
  }
  optional bytes answered_as = 7 [(dsm_max_len)=128]; // the member id the answering node echoed, when it echoed one
}

message StorageMemberByteCommit {
  ByteCommitV4 commit = 1;
  bytes digest = 2 [(dsm_fixed_len)=32]; // d_t, computed by Core from the commit's fields
}

message StorageMemberNoCycle {}

// ============================ POLICY FILE (Canonical) ============================
message PolicyRoleProto {
  string id = 1;
  string name = 2;
  repeated string permissions = 3; // sorted
}

message PolicyConditionProto {
  oneof kind {
    IdentityConstraintProto identity_constraint = 1;
    OperationRestrictionProto operation_restriction = 3;
    EmissionsScheduleProto emissions_schedule = 5;
    CreditBundlePolicyProto credit_bundle_policy = 6;
    CustomConstraintProto custom = 7;
    BitcoinTapConstraintProto bitcoin_tap_constraint = 8;
    // 9 was a signer-set authority over burn and creation: the signer set
    // authorizes only what the policy's own rules name, and none names it
    // (SoFi §47, §49); burns are the burn flag's, creation the creator's.
    SupplyCapProto      supply_cap      = 10;
  }
  reserved 9;
  reserved "token_authority";
  // A logical-time window: DSM has no clock to evaluate it against.
  reserved 4;
  reserved "logical_time_constraint";
  // A vault condition (hash, minimum balance, vault type, smart policy): no
  // verifier derives the vault facts it names, so it cannot be checked.
  reserved 2;
  reserved "vault_enforcement";
}

// The whole supply a token is created with. Nothing is minted after genesis
// (SoFi §48) and no supply is unlimited (§54): 2 was the unlimited flag.
message SupplyCapProto {
  bytes max_supply_u128 = 1 [(dsm_max_len)=16];
  reserved 2;
  reserved "unlimited";
}

message IdentityConstraintProto { repeated string allowed_identities = 1; bool allow_derived = 2; }
message OperationRestrictionProto { repeated string allowed_operations = 1; }
message EmissionsScheduleProto { uint64 total_supply = 1; uint32 shard_depth = 2; uint32 schedule_steps = 3; uint64 initial_step_emissions = 4; uint64 initial_step_amount = 5; }
message CreditBundlePolicyProto { uint64 bundle_size = 1; string debit_rule = 2; string refill_rule = 3; }

// Bitcoin tap safety constraints (dBTC §12). Protocol law — frozen into policy_commit.
message BitcoinTapConstraintProto {
  uint32 max_successor_depth = 1; // Maximum successor vault generations (§12.1.1)
  uint64 min_vault_balance_sats = 2; // Minimum vault balance after fractional exit (§12.1.2)
  uint64 dust_floor_sats = 3; // Bitcoin dust floor — hard floor for any UTXO output
  uint64 min_confirmations = 4; // Required block depth for entry/exit anchors (§12.1.3)
}

// IMPORTANT: `parameters_kv` is the canonical/deterministic representation.
// `parameters` (map) is UI/interop only and MUST NOT be used in hashed preimages.
message CustomConstraintProto {
  string constraint_type = 1;

  // UI/interop only (non-deterministic ordering). Do not hash.
  map<string, string> parameters = 2;

  // Canonical: sorted by key before hashing/signing.
  repeated ParamKV parameters_kv = 3;
}

message CanonicalPolicy {
  string author = 1;
  repeated PolicyConditionProto conditions = 2;
  repeated PolicyRoleProto roles = 3;
}

message StoredPolicy {
  string name = 1;
  string revision = 2;
  reserved 3;
  reserved "created_tick";
  string author = 4;
  string description = 5;
  repeated PolicyConditionProto conditions = 6;
  repeated PolicyRoleProto roles = 7;
  map<string, string> metadata = 8;
}

// ====================== WebView Bridge Messages ======================
// Formal schema for SinglePathWebViewBridge binary RPC calls
// Replaces manual byte slicing with protobuf serialization

message BridgeRpcRequest {
  reserved 7;
  reserved "create_genesis";
  string method = 1 [(dsm_max_len)=128];
  oneof payload {
    EmptyPayload empty = 2;
    BytesPayload bytes = 3;
    StringPayload string = 4;
    PreferencePayload preference = 5;
    AppRouterPayload app_router = 6;
    BleContactPayload ble_contact = 8;
    BleAddressPayload ble_address = 9;
    BleIdentityPayload ble_identity = 10;
    BilateralPayload bilateral = 11;
  }
}

message BridgeRpcResponse {
  oneof result {
    SuccessResponse success = 1;
    ErrorResponse error = 2;
  }
}

message EmptyPayload {}

message BytesPayload {
  bytes data = 1 [(dsm_max_len)=65535];
}

message StringPayload {
  string value = 1 [(dsm_max_len)=1024];
}

message PreferencePayload {
  string key = 1 [(dsm_max_len)=256];
  optional string value = 2 [(dsm_max_len)=4096]; // null for get, set for set
}

message AppRouterPayload {
  string method_name = 1 [(dsm_max_len)=256];
  bytes args = 2 [(dsm_max_len)=65535];
}

message BleContactPayload {
  bytes pairing_data = 1 [(dsm_max_len)=4096];
}

message BleAddressPayload {
  bytes device_id = 1 [(dsm_fixed_len)=32];
}

message BleIdentityPayload {
  bytes genesis_hash = 1 [(dsm_fixed_len)=32];
  bytes device_id = 2 [(dsm_fixed_len)=32];
}

message BilateralPayload {
  bytes commitment = 1 [(dsm_fixed_len)=32];
  optional string reason = 2 [(dsm_max_len)=1024]; // for reject operations
}

message SuccessResponse {
  bytes data = 1 [(dsm_max_len)=65535];
}

message ErrorResponse {
  uint32 error_code = 1;
  string message = 2 [(dsm_max_len)=1024];
  // Base32-Crockford debug string encoding of the canonical ErrorResponse bytes
  // Useful for human-readable diagnostics without introducing JSON.
  string debug_b32 = 3 [(dsm_max_len)=4096];
}

// DLV stitched receipt storage (§7.3, §18.4)

// ====================== Native Ingress Contract ======================
// Platform-agnostic ingress contract for native clients (Android JNI, iOS FFI).
//
// Both platforms translate ABI-specific inputs to IngressRequest, pass them
// through the single shared Rust ingress, and translate IngressResponse back
// to their respective ABI outputs. The only platform-specific code is the
// thin ABI marshalling layer; all semantic behaviour is identical after that
// point.

// AppRouter read-only query: method name + opaque protobuf args.
message RouterQueryOp {
  string method = 1 [(dsm_max_len)=256];
  bytes  args   = 2 [(dsm_max_len)=65535];
}

// AppRouter mutating invoke: method name + opaque protobuf args.
message RouterInvokeOp {
  string method = 1 [(dsm_max_len)=256];
  bytes  args   = 2 [(dsm_max_len)=65535];
}

// Generic Envelope v3 dispatch: raw protobuf-encoded Envelope bytes.
// The 0x03 framing prefix is optional; the ingress strips it if present.
message EnvelopeOp {
  bytes envelope_bytes = 1 [(dsm_max_len)=65535];
}

// Session hardware-state snapshot update.
message HardwareFactsOp {
  SessionHardwareFactsProto facts = 1;
}

// Drain queued SDK events as a typed protobuf batch.
message DrainEventsOp {
  uint32 max_events = 1;
}

enum SdkEventKind {
  SDK_EVENT_KIND_UNSPECIFIED = 0;
  SDK_EVENT_KIND_SESSION_STATE = 1;
  SDK_EVENT_KIND_BILATERAL_EVENT = 2;
  SDK_EVENT_KIND_BLE_ENVELOPE = 3;
  SDK_EVENT_KIND_INBOX_UPDATED = 4;
  SDK_EVENT_KIND_WALLET_REFRESH = 5;
  SDK_EVENT_KIND_IDENTITY_READY = 6;
  SDK_EVENT_KIND_ENV_CONFIG_ERROR = 7;
  SDK_EVENT_KIND_BIOMETRIC_RESULT = 8;
  SDK_EVENT_KIND_QR_SCAN_RESULT = 9;
  SDK_EVENT_KIND_BLUETOOTH_PERMISSIONS = 10;
  SDK_EVENT_KIND_DETERMINISTIC_SAFETY = 11;
  SDK_EVENT_KIND_CONTACT_BLE_UPDATED = 12;
  SDK_EVENT_KIND_NFC_RECOVERY_CAPSULE = 13;
  SDK_EVENT_KIND_NFC_BACKUP_WRITTEN = 14;
  SDK_EVENT_KIND_BRIDGE_READY = 15;
  SDK_EVENT_KIND_CANONICAL_ENVELOPE = 16;
}

// Typed async SDK event envelope. `payload` contains the canonical protobuf
// bytes for the declared event kind.
message SdkEvent {
  SdkEventKind kind = 1;
  bytes payload = 2 [(dsm_max_len)=65535];
}

message SdkEventBatch {
  repeated SdkEvent events = 1;
  bool has_more = 2;
}

// Canonical platform-agnostic ingress request.
message IngressRequest {
  oneof operation {
    RouterQueryOp   router_query   = 1;
    RouterInvokeOp  router_invoke  = 2;
    EnvelopeOp      envelope       = 3;
    HardwareFactsOp hardware_facts = 4;
    DrainEventsOp   drain_events   = 5;
  }
}

// Canonical platform-agnostic ingress response.
message IngressResponse {
  oneof result {
    bytes ok_bytes = 1 [(dsm_max_len)=65535];
    Error error    = 2;
  }
}

// Startup/bootstrap operations are modeled separately from request ingress.
// They express one-time native platform setup rather than protocol requests.

// Configure the SDK storage base directory.
message SetStorageBaseDirOp {
  string path_utf8 = 1 [(dsm_max_len)=2048];
}

// Configure the authoritative env-config TOML path used by the SDK.
message ConfigureEnvOp {
  string config_path_utf8 = 1 [(dsm_max_len)=2048];
}

// Initialize the SDK runtime, storage-node registry, and router layer.
message InitializeSdkOp {}

// Install canonical identity context. Identity is re-derived from the unlocked
// wallet seed (Genesis v2); there is no binding key.
message InitializeIdentityContextOp {
  bytes device_id    = 1 [(dsm_fixed_len)=32];
  bytes genesis_hash = 2 [(dsm_fixed_len)=32];
}

// Restore canonical identity context. Under Genesis v2 the device key re-derives
// deterministically from the unlocked wallet seed; the cold-start path needs no
// silicon inputs.
message RestoreIdentityContextOp {
  bytes device_id             = 1 [(dsm_fixed_len)=32];
  bytes genesis_hash          = 2 [(dsm_fixed_len)=32];
}

// Canonical startup/bootstrap request shared by native platforms.
message StartupRequest {
  oneof operation {
    SetStorageBaseDirOp        set_storage_base_dir     = 1;
    ConfigureEnvOp             configure_env            = 2;
    InitializeSdkOp            initialize_sdk           = 3;
    InitializeIdentityContextOp initialize_identity_context = 4;
    RestoreIdentityContextOp   restore_identity_context = 5;
  }
}

// Canonical startup/bootstrap response.
message StartupResponse {
  oneof result {
    bytes ok_bytes = 1 [(dsm_max_len)=65535];
    Error error    = 2;
  }
}

// Project-private native host boundary for WebView <-> platform host control.
enum NativeHostRequestKind {
  reserved 101;

  NATIVE_HOST_REQUEST_KIND_UNSPECIFIED = 0;

  // host_control.*
  NATIVE_HOST_REQUEST_KIND_HOST_CONTROL_CAPABILITIES_GET = 1;
  NATIVE_HOST_REQUEST_KIND_HOST_CONTROL_QR_START_SCAN = 2;
  NATIVE_HOST_REQUEST_KIND_HOST_CONTROL_QR_STOP_SCAN = 3;
  NATIVE_HOST_REQUEST_KIND_HOST_CONTROL_BLE_SCAN_START = 4;
  NATIVE_HOST_REQUEST_KIND_HOST_CONTROL_BLE_SCAN_STOP = 5;
  NATIVE_HOST_REQUEST_KIND_HOST_CONTROL_BLE_ADVERTISE_START = 6;
  NATIVE_HOST_REQUEST_KIND_HOST_CONTROL_BLE_ADVERTISE_STOP = 7;
  NATIVE_HOST_REQUEST_KIND_HOST_CONTROL_NFC_READER_START = 8;
  NATIVE_HOST_REQUEST_KIND_HOST_CONTROL_NFC_READER_STOP = 9;
  NATIVE_HOST_REQUEST_KIND_HOST_CONTROL_PERMISSIONS_REQUEST = 10;

  // platform_primitive.*
  NATIVE_HOST_REQUEST_KIND_PLATFORM_PRIMITIVE_BIOMETRIC_AUTHORIZE = 102;
  NATIVE_HOST_REQUEST_KIND_PLATFORM_PRIMITIVE_NFC_TAG_READ_PAYLOAD = 105;
  NATIVE_HOST_REQUEST_KIND_PLATFORM_PRIMITIVE_NFC_TAG_WRITE_PAYLOAD = 106;
  // Declared host primitives no host implemented and no caller issued.
  reserved 103, 104, 107 to 109;
  reserved "NATIVE_HOST_REQUEST_KIND_PLATFORM_PRIMITIVE_SECURE_HARDWARE_GENERATE_KEY",
           "NATIVE_HOST_REQUEST_KIND_PLATFORM_PRIMITIVE_SECURE_HARDWARE_SIGN",
           "NATIVE_HOST_REQUEST_KIND_PLATFORM_PRIMITIVE_BLE_TRANSPORT_OPEN",
           "NATIVE_HOST_REQUEST_KIND_PLATFORM_PRIMITIVE_BLE_TRANSPORT_SEND_CHUNKS",
           "NATIVE_HOST_REQUEST_KIND_PLATFORM_PRIMITIVE_BLE_TRANSPORT_CLOSE";
}

message NativeHostRequest {
  NativeHostRequestKind kind = 1;
  bytes payload = 2 [(dsm_max_len)=65535];
}

message NativeHostCapabilities {
  repeated NativeHostRequestKind supported_requests = 1;
}

message NativeHostResponse {
  oneof result {
    bytes ok_bytes = 1 [(dsm_max_len)=65535];
    NativeHostCapabilities capabilities = 2;
    Error error = 3;
  }
}

enum NativeHostEventKind {
  NATIVE_HOST_EVENT_KIND_UNSPECIFIED = 0;
  NATIVE_HOST_EVENT_KIND_QR_SCAN_RESULT = 1;
  NATIVE_HOST_EVENT_KIND_BLUETOOTH_PERMISSIONS = 2;
  NATIVE_HOST_EVENT_KIND_BIOMETRIC_RESULT = 3;
  NATIVE_HOST_EVENT_KIND_NFC_TAG_READ = 4;
  NATIVE_HOST_EVENT_KIND_NFC_TAG_WRITE = 5;
  NATIVE_HOST_EVENT_KIND_SESSION_STATE_HINT = 6;
}

message NativeHostEvent {
  NativeHostEventKind kind = 1;
  bytes payload = 2 [(dsm_max_len)=65535];
}

message NativeHostAck {
  bool success = 1;
}

message HostPermissionsRequestPayload {
