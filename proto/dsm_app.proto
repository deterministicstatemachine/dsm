// ─── Storage Node Regulation (clockless, signature-free) ────────────────────

// Capacity up-signal: node utilization >= U_UP for w consecutive cycles.
// Domain: "DSM/signal/up\0"
message UpSignalV3 {
  bytes node_id   = 1; // 32 bytes
  uint64 capacity = 2; // declared capacity C
  repeated bytes anchors = 3; // H(B_{t-w+1}),...,H(B_t) ByteCommit digests
}

// Capacity down-signal: node utilization <= U_DOWN for w consecutive cycles.
// Domain: "DSM/signal/down\0"
message DownSignalV3 {
  bytes node_id   = 1; // 32 bytes
  uint64 capacity = 2;
  repeated bytes anchors = 3;
}

// Active node registry: sorted ascending lexicographic order.
// Domain: "DSM/registry\0"
message RegistryV3 {
  repeated bytes node_ids = 1; // sorted ascending lex
}

// Applicant pack for joining the active storage-node set.
// Domain: "DSM/apply\0"
message ApplicantV3 {
  bytes hw_bind   = 1; // device-birth hardware binding
  bytes env_fp    = 2; // environment fingerprint
  uint64 capacity = 3; // declared capacity C
  bytes stake_dlv = 4; // StakeDLV address
  bytes seed_app  = 5; // H("DSM/app_seed\0" || hw_bind || G)
}

// Storage payment receipt for PaidK spend-gate.
// Domain: "DSM/pay/storage\0"
message StoragePaymentReceiptV3 {
  bytes device_id        = 1; // 32 bytes, payer
  bytes operator_node_id = 2; // 32 bytes, recipient operator
  uint64 amount          = 3; // payment amount (>= FLAT_RATE)
  bytes receipt_digest   = 4; // H("DSM/pay/storage\0" || ProtoDet(this without digest))
}

// PaidK spend-gate proof, carried inside JoinActivationProof.gate_proof.
//
// Whitepaper §16 PaidK predicate:
//   PaidK(G, DevID, R) := |{r in R | VerifyPayment(r) AND amt(r) >= FLAT_RATE}| >= K
//
// The emissions verifier checks structurally:
//   * exactly the same `device_id` across every receipt
//   * `>= K` distinct `operator_node_id` values
//   * `amount >= FLAT_RATE` per receipt
//
// Per-receipt operator signature verification (the `VerifyPayment(r)` step) is
// tracked as a follow-on issue — receipts are not signed by operators in this
// schema yet, so this proof structure pins shape + distinctness + floor, not
// payment authenticity.
message PaidKGateProofV1 {
  repeated StoragePaymentReceiptV3 receipts = 1;
}

// Registry update result (informational, for mirroring).
message RegistryUpdateV3 {
  bytes previous_registry_addr = 1;
  bytes new_registry_addr      = 2;
  int64 position_delta         = 3; // dP = |U| - |D|
  repeated bytes added_nodes   = 4;
  repeated bytes removed_nodes = 5;
}

// PaidK status response.
message PaidKStatusV3 {
  bool satisfied         = 1;
  uint32 distinct_operators = 2;
  uint32 required_k      = 3;
}

message BleConnectionFailed {
  string address = 1;
  string error = 2;
}

// ── keyed cells and indexes (storage contract Part II) ──────────────────────
// Everything a member holds at a key, in arrival order. An empty list is an
// asserted absence. The member decodes none of the values.
message CellValuesV1 {
  repeated bytes values = 1 [(dsm_max_len)=262144];
  // One arrival record per value, in the same order (storage spec §14).
  repeated ArrivalRecordV1 records = 2;
}

// Arrival record of one keyed-cell entry (storage spec §6, §14): the member,
// the cell, the entry's per-key arrival index (from 1), and the member's
// running hash for the key after the entry. Bytes, not a signature.
message ArrivalRecordV1 {
  bytes  member_id    = 1 [(dsm_max_len)=128]; // exactly as the storage set commits it
  bytes  namespace    = 2 [(dsm_max_len)=128];
  bytes  key          = 3 [(dsm_fixed_len)=32];
  uint64 index        = 4;
  bytes  running_hash = 5 [(dsm_fixed_len)=32];
}

// The arrival records of a batch put, one per entry in the batch's order.
message ArrivalRecordsV1 {
  repeated ArrivalRecordV1 records = 1;
}

// What a writer puts at each seat of a cell's route (storage spec §9, §14
// keyed-cell formats item 5). The same value goes to every seat; what differs
// is the seat, its route position, and the chain collected so far. A node
// stores these bytes and returns their arrival record; it never reads them.
message RouteEntryV1 {
  bytes  namespace      = 1 [(dsm_max_len)=128];
  bytes  key            = 2 [(dsm_fixed_len)=32];
  bytes  value          = 3 [(dsm_max_len)=262144];
  bytes  seat_member_id = 4 [(dsm_max_len)=128]; // the seat at `position`, as the set commits it
  uint32 position       = 5;                     // 0 = the leader, up to 4
  repeated ChainSlotV1 chain = 6;                // one slot per earlier position, in route order
}

// One earlier position of a route chain: the link that seat returned, or an
// empty recording why there is none. An empty never counts as a link.
message ChainSlotV1 {
  oneof kind {
    ArrivalRecordV1 link        = 1; // the seat's arrival record for this value
    ArrivalRecordV1 taken       = 2; // the seat's arrival record showing another value's chain first
    NoResponseV1    no_response = 3; // recorded, proves nothing
  }
}

message NoResponseV1 {}

// A member's ByteCommit for cycle t (storage spec §14). Unsigned. Its digest
// is computed from the fields, never from these encoded bytes.
message ByteCommitV4 {
  bytes  member_id     = 1 [(dsm_max_len)=128]; // exactly as the storage set commits it
  uint64 cycle_index   = 2;                     // from 1; a counter, never time
  bytes  smt_root      = 3 [(dsm_fixed_len)=32];
  uint64 bytes_used    = 4;
  bytes  parent_digest = 5 [(dsm_fixed_len)=32]; // zeros at cycle 1
}

// Every distinct ByteCommit a mirror fetched for one member and cycle. More
// than one is evidence that the member equivocated.
message ByteCommitsV4 {
  repeated ByteCommitV4 commits = 1;
}

// A member's proof that its ByteCommit for a cycle commits a cell's latest
// entry as of that cycle: the entry's index and running hash, and the SMT
// inclusion proof of the cell's leaf.
message CellCommitProofV1 {
  uint64 index        = 1;
  bytes  running_hash = 2 [(dsm_fixed_len)=32];
  bytes  smt_proof    = 3 [(dsm_max_len)=8300];
}

// One value for one key, as a batch put carries it. The member keeps it
// after anything already at the key, exactly as a single put would.
message CellPutV1 {
  bytes namespace = 1 [(dsm_max_len)=128];
  bytes key       = 2 [(dsm_fixed_len)=32];
  bytes value     = 3 [(dsm_max_len)=262144];
}

// Several keys taken in ONE local transaction at the member: all of them or
// none of them (Part II §17.4, the two position cells). The member still
// decodes none of the values and refuses none of them.
message CellPutsV1 {
  repeated CellPutV1 entries = 1;
}

message IndexEntryV1 {
  int64 seq  = 1;
  bytes addr = 2 [(dsm_fixed_len)=32];
}

// One page of the content addresses appended under a locator, in append
// order. Page from the last `seq`.
message IndexPageV1 {
  repeated IndexEntryV1 entries = 1;
}
