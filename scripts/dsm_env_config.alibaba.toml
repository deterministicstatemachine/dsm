# DSM environment config — Alibaba Cloud storage nodes (3-node, us-west-1)
# Push to device with: scripts/push_env_override.sh --alibaba
#
# Nodes (ECS, VPC vpc-rj9oepiel1c2517avaboj, sg dsm-storage-sg):
#   us-west-1a: 47.251.246.93, 47.251.250.159, 47.251.88.58

protocol = "https"
lan_ip = "0.0.0.0"
allow_localhost = false
storage_node_mode = "remote"
ports = [8080]

bitcoin_network = "signet"
dbtc_min_confirmations = 1
mempool_api_url = "https://mempool.space"

# Self-signed CA for Alibaba storage node TLS certs
# Path is relative to this config file's directory (resolved by SDK).
custom_ca_certs = ["ca.crt"]

# `name` IS THE MEMBER ID OF THE CANONICAL STORAGE SET, not a label. It is
# hashed (sorted, length-prefixed) into the storage_set_id a vault is born
# under, and it is what an acceptance is counted against: a member only counts
# toward quorum when the node echoes this exact string back as x-dsm-node-id.
#
# So each name MUST equal that node's own `[node] id`, which is also the CN of
# the TLS certificate it serves — verify with:
#   openssl s_client -connect <ip>:8080 </dev/null | openssl x509 -noout -subject
# A name that merely describes the node ("us-west-1a-1") makes the client
# compute a set id no node belongs to: every settlement-slot claim is refused as
# a foreign set and no publication ever reaches quorum.
#
# `register_incarnation` is the register history that node is serving, as its
# own database minted it at first boot and logged it. The set id is derived from
# the (name, register_incarnation) pairs, and the network's root-register
# profile PINS that id in core — so a node that rebuilt its register stops
# resolving here rather than silently serving the register it used to.
# Provisioned 2026-09-05; set id E05YS8101EJH33KY2CG625JJE8A0Z4GJNSEM335TX1XVTWM9RR8G.
[[nodes]]
name = "dsm-node-1"
endpoint = "https://47.251.246.93:8080"
register_incarnation = "DXWR7W9J2E5ASQ5BJBYF13ZZEK1VFTZFYNWAYPF1KNT8C33YPVM0"

[[nodes]]
name = "dsm-node-2"
endpoint = "https://47.251.250.159:8080"
register_incarnation = "H4ZSDG34M1BSQQH8T9WWWZ65Y90YW9QY2CYRR2EG3H621VDGJ3W0"

[[nodes]]
name = "dsm-node-3"
endpoint = "https://47.251.88.58:8080"
