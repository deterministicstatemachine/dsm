# cbindgen configuration file for DSM SDK
language = "C"
cpp_compat = true
include_version = true
# `usize` is `size_t`, which Swift imports as `Int` (the type of `Data.count`).
usize_is_size_t = true
header = "/* Automatically generated by cbindgen for DSM SDK */"

[export]
include = ["*"]
exclude = [
    "JNI_OnLoad",
    "Java_com_dsm_wallet_bridge_UnifiedNativeApi_hasContactForDeviceId",
    "Java_com_dsm_wallet_bridge_UnifiedNativeApi_isBleAddressPaired",
    "Java_com_dsm_wallet_bridge_UnifiedNativeApi_isCommitEnvelope",
    "Java_com_dsm_wallet_bridge_UnifiedNativeApi_isRejectEnvelope",
]
