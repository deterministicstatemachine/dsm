# DSM environment config — the beta storage fleet (5 nodes, OVHcloud BHS5).
# Bundled into the APK: this file and ca.crt beside it are what a default
# install reaches the network with.
#
# The fleet was provisioned 2026-11-10 on OVHcloud Public Cloud (Beauharnois,
# the owner's own hosting) after the GCP set went down; every member minted a
# new register incarnation into its fresh database, and
# the committed set id every member logs is
#   BE5WR3N11WNNBFFV823D6HYC6824C5DMH39RN1BRNZF8KF2BJ1WG
# which is the id core pins (dsm::economic::register), so this list must stay
# exactly the pinned pairs: `dsm_sdk::sdk::storage_set::tests::
# the_bundled_env_config_resolves_the_pinned_beta_set` refuses anything else.

allow_localhost = false

bitcoin_network = "signet"
dbtc_min_confirmations = 1
mempool_api_url = "https://mempool.space"

# The fleet's CA (CN=DSM-Storage-CA): every member serves a certificate for
# its IP and CN=dsm-node-N issued by it. Path is relative to this config
# file's directory (resolved by the SDK); the app installs the bundled ca.crt
# next to the config.
custom_ca_certs = ["ca.crt"]

# `name` IS THE MEMBER ID OF THE CANONICAL STORAGE SET, not a label. It is
# hashed (sorted, length-prefixed) into the storage_set_id a vault is born
# under, and it is what an acceptance is counted against: a member only counts
# toward quorum when the node echoes this exact string back as x-dsm-node-id.
#
# So each name MUST equal that node's own `[node] id`, which is also the CN of
# the TLS certificate it serves. `register_incarnation` is the register history
# that member serves, as its own database minted it at first boot and logged
# it; the set id is derived from the (name, register_incarnation) pairs, so a
# stale incarnation makes the client compute a set id no member belongs to and
# every read of the canonical set fails closed.
[[nodes]]
name = "dsm-node-1"
endpoint = "https://148.113.157.16:8080"
register_incarnation = "DFGXMD8BV3JDETMTKDKJ97XA3840YDRV5RX67QJQBYVP42P8ASFG"

[[nodes]]
name = "dsm-node-2"
endpoint = "https://167.114.146.179:8080"
