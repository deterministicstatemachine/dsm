[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dsm-app-client"
version = "0.1.0b4"
description = "A client for a dsm-app-host's local ingress: an application's own DSM account (DSM Connect, Amendment A11)"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["protobuf>=5.27"]

[tool.setuptools.packages.find]
include = ["dsm_app_client*"]
