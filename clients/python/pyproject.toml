[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dsm-app-client"
version = "0.1.0b4"
description = "Plug your app into DSM: your app's own DSM account, wallet connections, payments, proofs of ownership and sign-in, from Python."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
# dsm_app_client/generated/dsm_app_pb2.py is generated by protoc 29.0 (grpcio-tools 1.71.0),
# which names protobuf 5.29 as the runtime it was made for.
dependencies = ["protobuf>=5.29,<6"]

[project.urls]
Homepage = "https://deterministicstatemachine.github.io/dsm/"
Repository = "https://github.com/deterministicstatemachine/dsm"

[tool.setuptools.packages.find]
include = ["dsm_app_client*"]
