# DSM storage dev node 4: the production binary on localhost (ruling #2).
# scripts/dev/start_dev_nodes.sh generates dev-pki/ (the dev CA, this node's
# certificate, and the admin and gossip tokens) and creates the database.

[node]
id = "dev-node-4"

[network]
listen_addr = "127.0.0.1"
port = 8083

[tls]
cert_path = "dev-pki/node4.crt"
key_path = "dev-pki/node4.key"
ca_path = "dev-pki/ca.crt"

[database]
url = "postgresql://localhost:5432/dsm_storage_node4"

[replication]
peers = [
  "https://127.0.0.1:8080",
  "https://127.0.0.1:8081",
  "https://127.0.0.1:8082",
  "https://127.0.0.1:8084",
]
