# DSM storage dev node 2: the production binary on localhost (ruling #2).
# scripts/dev/start_dev_nodes.sh generates dev-pki/ (the dev CA, this node's
# certificate, and the admin and gossip tokens) and creates the database.

[node]
id = "dev-node-2"

[network]
listen_addr = "127.0.0.1"
port = 8081

[tls]
cert_path = "dev-pki/node2.crt"
key_path = "dev-pki/node2.key"
ca_path = "dev-pki/ca.crt"

[database]
url = "postgresql://localhost:5432/dsm_storage_node2"

[replication]
peers = [
  "https://127.0.0.1:8080",
  "https://127.0.0.1:8082",
  "https://127.0.0.1:8083",
  "https://127.0.0.1:8084",
]
