# DSM storage dev node 5: the production binary on localhost (ruling #2).
# scripts/dev/start_dev_nodes.sh generates dev-pki/ (the dev CA, this node's
# certificate) and creates the database.

[node]
id = "dev-node-5"

[network]
listen_addr = "127.0.0.1"
port = 8084

[tls]
cert_path = "dev-pki/node5.crt"
key_path = "dev-pki/node5.key"
ca_path = "dev-pki/ca.crt"

[database]
url = "postgresql://localhost:5432/dsm_storage_node5?sslmode=disable"
