# DSM Storage Node — Local Development Configuration
#
# Usage:
#   cargo run --package dsm_storage_node --features local-dev --no-default-features \
#       -- --config dsm_storage_node/config/local-dev.toml
#
# This starts a single storage node with:
#   - SQLite backend (no PostgreSQL required)
#   - Bound to 127.0.0.1 only (not externally reachable)
#   - TLS disabled
#   - Replication disabled (single node)

[node]
id = "local-dev-0"

# The canonical storage set this node is a member of. Member ids are the
# `node.id` strings of every member (this node's own id MUST be listed); the
# canonical set id is BLAKE3 over the sorted, length-prefixed ids — exactly what
# clients derive from their env config's `[[nodes]] name` entries. Absent ⇒ the
# settlement-slot claim register is INACTIVE on this node (every claim refused).
# On the fleet, list all three members on every node; the set is immutable for
# the lifetime of every vault born under it.
[storage_set]
members = ["local-dev-0"]

[network]
listen_addr = "127.0.0.1"
port = 8080
max_connections = 64

[tls]
enabled = false

[database]
# In local-dev mode the PostgreSQL URL is ignored; SQLite uses this as a file path.
# The SQLite file will be created automatically.
url = "dsm-storage-local.db"

[http]
body_limit_bytes = 1048576   # 1 MiB
