# DSM Storage Node — Production Configuration Template
#
# Placeholders are filled by deploy/generate_node_configs.sh:
#   __NODE_ID__         — e.g. "dsm-node-1"
#   __LISTEN_ADDR__     — e.g. "0.0.0.0"
#   __PORT__            — e.g. 8080
#   __DATABASE_URL__    — injected at deploy time from operator-provided settings;
#                         TLS is required unless the URL says sslmode=disable
#
# The storage set is NOT a placeholder: see the two-phase bring-up below.

[node]
id = "__NODE_ID__"

# THE CANONICAL STORAGE SET this node belongs to. Absent, the node serves the
# storage contract and mirrors no set-mate (the phase-1 state below).
#
# Rules, all load-bearing:
#   * list EVERY member of the set, including this node; this node's own
#     `node.id` MUST appear or startup refuses;
#   * each member id must equal the `name` of that node's entry in the CLIENT
#     env config (`[[nodes]] name = "..."`), because the canonical set id is
#     derived from the (member id, register incarnation) pairs and both sides
#     derive it independently — a differing name or incarnation gives the
#     client a set id no member serves;
#   * the set is IMMUTABLE for the lifetime of every vault born under it. A vault's
#     signed birth anchor binds this id; changing membership needs the handover
#     of storage spec §12.5, which carries every key's arrival log, not a config edit;
#   * what a member holds, in arrival order, must survive restart AND storage lifecycle —
#     restoring this node's database from a snapshot that predates a held value,
#     or replacing the node without its register, is a SAFETY violation.
#
# TWO-PHASE BRING-UP, and it cannot be collapsed into one.
#
# A member is `(id, register_incarnation)`. The incarnation is generated by the
# node itself on first boot, from the OS random source, into its own database —
# it is deliberately NOT derivable from the node id or its TLS key, because
# a node that kept its id and certificate but lost its register MUST come back
# as a different member. So no generator can know these values in advance:
#
#   Phase 1 — deploy every node with this section COMMENTED OUT. Each node logs
#             `register incarnation for node <id>: <Base32-Crockford>` at startup.
#   Phase 2 — collect those values, write the full member list into EVERY node's
#             config below and into the client env config's `[[nodes]]` entries,
#             then restart. A node whose configured incarnation is not the one in
#             its database REFUSES TO START, so a mistake here is loud.
#
# Re-running phase 1 on a node that has already minted an incarnation is safe:
# the value is write-once and is read back, never regenerated.
#
# `endpoint` is where this node reaches that set-mate to mirror its
# ByteCommits (storage spec §14). Every member other than this node needs one:
# a node mirrors every set-mate, and fetches one only at the endpoint named
# here. The node refuses to start if a set-mate has none.
#
# `ca_cert` is the PEM of the CA that member's operator holds. A node reaches a
# set-mate over a client that trusts that set-mate's CA and no other member's, so
# no member can stand in for another. The node refuses to start if a set-mate
# has none. A node's own entry needs neither, and carries both when the same list
# is written to every member.
#
# [storage_set]
# [[storage_set.members]]
# id = "dsm-node-1"
# register_incarnation = "<from that node's phase-1 log>"
# endpoint = "https://<dsm-node-1 address>:8080"
# ca_cert = """
# <PEM of dsm-node-1's CA>
# """
#
# [[storage_set.members]]
# id = "dsm-node-2"
# register_incarnation = "<from that node's phase-1 log>"
# endpoint = "https://<dsm-node-2 address>:8080"
# ca_cert = """
# <PEM of dsm-node-2's CA>
# """

[network]
listen_addr = "__LISTEN_ADDR__"
port = 8080
max_connections = 256    # requests in flight at once, across every route together
max_open_connections = 4096   # connections held open at once; one more is closed before its TLS handshake
max_open_connections_per_peer = 128   # of those, held by one peer (an IPv4 address or an IPv6 /64) at once

[tls]
cert_path = "/certs/node.crt"
key_path  = "/certs/node.key"

# Push (dsm_storage_node/deploy/operator/PUSH_DOORBELL.md): the node rings devices' phones through Firebase Cloud
# Messaging when their spools take an entry. Absent = no doorbell; devices keep their waits.
# Every value is the operator's; the certificate and its key are this node's alone.
# [push.fcm]
# project_id = "<Firebase project id>"
# workload_identity_provider = "//iam.googleapis.com/projects/<project number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>"
# service_account = "<name>@<project id>.iam.gserviceaccount.com"
# client_cert_path = "/certs/push-client.crt"
# client_key_path = "/certs/push-client.key"
# [push.apns]                                  # iPhones: Apple's provider certificate (PEM)
# topic = "com.dsm.wallet"
# client_cert_path = "/certs/apns-provider.crt"
# client_key_path = "/certs/apns-provider.key"
# endpoint = "https://api.sandbox.push.apple.com"   # only for phones running a development build

[database]
url = "__DATABASE_URL__"

[http]
body_limit_bytes = 1048576    # 1 MiB
request_timeout_secs = 60       # one request, waiting for a slot included; answered 408 after
header_read_timeout_secs = 10   # a connection that has not sent a request's headers by then is closed
