# DSM Storage Node — Production Configuration Template
#
# Placeholders are filled by deploy/generate_node_configs.sh:
#   __NODE_ID__         — e.g. "dsm-node-1"
#   __LISTEN_ADDR__     — e.g. "0.0.0.0"
#   __PORT__            — e.g. 8080
#   __DATABASE_URL__    — injected at deploy time from operator-provided settings
#
# The storage set is NOT a placeholder: see the two-phase bring-up below.

[node]
id = "__NODE_ID__"

# THE CANONICAL STORAGE SET this node belongs to — required before the
# settlement-slot claim register will accept anything (absent ⇒ the register is
# INACTIVE on this node and every claim is refused, fail-closed).
#
# Rules, all load-bearing:
#   * list EVERY member of the set, including this node; this node's own
#     `node.id` MUST appear or startup refuses;
#   * each member id must equal the `name` of that node's entry in the CLIENT
#     env config (`[[nodes]] name = "..."`), because the canonical set id is
#     BLAKE3 over the sorted, length-prefixed member ids and both sides derive
#     it independently — a mismatch makes every claim look like a foreign set;
#   * the set is IMMUTABLE for the lifetime of every vault born under it. A vault's
#     signed birth anchor binds this id; changing membership needs an explicit
#     handover protocol that preserves outstanding write-once claims, not a config edit;
#   * the register's non-equivocation must survive restart AND storage lifecycle —
#     restoring this node's database from a snapshot that predates a held claim,
#     or replacing the node without its register, is a SAFETY violation.
#
# TWO-PHASE BRING-UP, and it cannot be collapsed into one.
#
# A member is `(id, register_incarnation)`. The incarnation is generated by the
# node itself on first boot, from the OS random source, into its own database —
# it is deliberately NOT derivable from the node id or the signing key, because
# a node that kept its key but lost its register MUST come back as a different
# member. So no generator can know these values in advance:
#
#   Phase 1 — deploy every node with this section COMMENTED OUT. The register is
#             inactive and every claim is refused, which is the correct state for
#             a fleet that has not yet agreed on a set. Each node logs
#             `register incarnation for node <id>: <Base32-Crockford>` at startup.
#   Phase 2 — collect those values, write the full member list into EVERY node's
#             config below and into the client env config's `[[nodes]]` entries,
#             then restart. A node whose configured incarnation is not the one in
#             its database REFUSES TO START, so a mistake here is loud.
#
# Re-running phase 1 on a node that has already minted an incarnation is safe:
# the value is write-once and is read back, never regenerated.
#
# [storage_set]
# [[storage_set.members]]
# id = "dsm-node-1"
# register_incarnation = "<from that node's phase-1 log>"
#
# [[storage_set.members]]
# id = "dsm-node-2"
# register_incarnation = "<from that node's phase-1 log>"

[network]
listen_addr = "__LISTEN_ADDR__"
port = 8080
max_connections = 256

[tls]
enabled = true
cert_path = "/certs/node.crt"
key_path  = "/certs/node.key"

[database]
url = "__DATABASE_URL__"

[http]
body_limit_bytes = 1048576    # 1 MiB

[security_headers]
hsts_max_age = 31536000       # 1 year

[replication]
# Peers are listed here; generate_node_configs.sh fills them in at deploy time.
peers = []

[paidk]
flat_rate = 1000     # Minimum payment amount per operator
k = 3                # Distinct operators required for spend-gate satisfaction

[registry]
grace_cycles = 8     # New nodes protected from Down signals for this many cycles
discovery_window = 4 # Signal aggregation window (cycles)
n = 6                # Target node count
u_up = 0.85          # Utilization threshold for Up signal validity
u_down = 0.35        # Utilization threshold for Down signal validity
