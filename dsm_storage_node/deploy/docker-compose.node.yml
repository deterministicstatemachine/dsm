# DSM Storage Node — Per-Node Docker Compose
#
# Deployed to each EC2 instance. Runs PostgreSQL + storage-node together.
# Requires: .env, config/node.toml, certs/node.crt, certs/node.key, certs/ca.crt
#
# Usage:
#   docker compose -f docker-compose.node.yml up -d
#
# Each service's log is rotated: at most five files of 50 MB, so a client
# that makes a node log cannot fill its disk. Each service's memory and
# process count are bounded too, so neither can starve the other or the host:
# a node that outgrows its memory is restarted, and its database with it
# keeps every acknowledged byte (synchronous commit, storage spec §3). The
# defaults fit a 2 GB host; set DSM_NODE_MEM_LIMIT / DSM_PG_MEM_LIMIT in
# .env for a larger one.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: ${DSM_PG_MEM_LIMIT:-640m}
    # One process per connection, and the node's pool holds at most 32.
    pids_limit: 256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsm_storage}
      POSTGRES_USER: ${POSTGRES_USER:-dsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsm} -d ${POSTGRES_DB:-dsm_storage}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dsm-internal
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  storage-node:
    image: dsm-storage-node:latest
    restart: unless-stopped
    mem_limit: ${DSM_NODE_MEM_LIMIT:-896m}
    # The runtime's worker threads and its blocking pool (at most 512).
    pids_limit: 1024
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DSM_PORT:-8080}:8080"
    volumes:
      - ./config:/config:ro
      - ./certs:/certs:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: "1"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--insecure", "https://localhost:8080/api/v2/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - dsm-internal
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgdata:

networks:
  dsm-internal:
    driver: bridge
