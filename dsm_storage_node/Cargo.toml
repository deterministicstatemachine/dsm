[package]
name = "dsm_storage_node"
version = "0.1.0-beta.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Storage node for the Deterministic State Machine (DSM)"


[dependencies]
# Core async runtime
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.31"

# HTTP server
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }              # TLS listener
rustls = { version = "0.23", features = ["ring"] }
# PEM cert/key parsing via the maintained rustls-pki-types crate (Issue #24).
# Replaces the unmaintained rustls-pemfile (RUSTSEC-2025-0134); the
# `alloc` feature gates the PEM-reading helpers (`from_pem_slice`,
# `from_pem_reader`, etc.) on `rustls::pki_types::CertificateDer` and friends.
rustls-pki-types = { version = "1", features = ["alloc"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "set-header", "limit"] }

# Error handling
anyhow = "1.0.75"

# Randomness (the register incarnation)
rand = "0.8.6"

# Configuration
clap = { version = "4.6.1", features = ["derive"] }
config = "0.15.23"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
log = "0.4"
tracing-log = "0.2"

# HTTP Client
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }

# Database (PostgreSQL)
tokio-postgres = { version = "0.7.17", default-features = false, features = ["runtime"] }
deadpool-postgres = "0.14.1"
tokio-postgres-rustls = "0.14"
webpki-roots = "1.0.7"

# DSM Core (for SPHINCS+ and shared types)
dsm = { version = "0.1.0-beta.3", path = "../dsm_client/deterministic_state_machine/dsm" }

# Protobuf support
prost = "0.14"

[[bin]]
name = "storage_node"
path = "src/main.rs"

[dev-dependencies]
rcgen = "0.14.8"
