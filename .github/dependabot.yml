version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    ignore:
      # The rand stack drives the seeded ChaCha20 RNG used for DETERMINISTIC
      # SPHINCS+ keygen (crypto/rng.rs, crypto/sphincs.rs). rand_chacha 0.10 /
      # rand 0.10 change both the API (ChaCha20Rng::from_seed, SeedableRng) and
      # the RNG output stream — silently altering crypto keygen output, a
      # determinism break the current KATs (intra-run equality only) do NOT
      # catch. Hold minor/major bumps until a coordinated migration that pins
      # byte-exact RNG/keygen KATs proves output is unchanged. Patch bumps OK.
      # See PRs #379 (rand_chacha 0.10) and #383 (rand 0.10).
      - dependency-name: "rand"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "rand_chacha"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/dsm_client/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 5
    ignore:
      # @bufbuild/protoc-gen-es is pinned to the v1 line because it must match
      # the @bufbuild/protobuf ^1 runtime. The v1 plugin emits the class-based
      # API (proto3.makeMessageType / new Message()) used by every proto
      # consumer in src/services and src/proto/dsm_app_pb.ts. v2+ emits a
      # different runtime (typeName-keyed schemas, create(Schema, ...)) and
      # requires migrating @bufbuild/protobuf to ^2 plus rewriting every
      # consumer; bumping the plugin alone silently breaks `npm run type-check`
      # and `proto:gen`. A 2.x bump was already reverted twice (the pin in
      # commit b14e436a, then PR #457 re-bumped it). Hold minor/major until a
      # coordinated v2 migration lands. Patch bumps OK.
      - dependency-name: "@bufbuild/protoc-gen-es"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@bufbuild/protobuf"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
      - "dependencies"
    ignore:
      # dtolnay/rust-toolchain's tag IS the Rust version, and every `uses:` pin
      # of it is a MIRROR of rust-toolchain.toml — the sole normative
      # declaration. ci/check_toolchain_consistency.sh exists to prove the two
      # equal, and runs in `make lint` and ci/production_safety_checks.sh.
      #
      # So a Dependabot bump of this action can never merge: it moves the
      # mirrors and cannot move the normative file, and the consistency gate
      # fails by design. PR #782 (1.98.0 -> 1.120.0) is the demonstration —
      # Rust, Coverage, Embedded and Storage Node all red, on a change that
      # touched no code.
      #
      # Moving the toolchain is a deliberate, coordinated edit: rust-toolchain.toml
      # first, then every mirror in ci.yml and release.yml, in one change, with
      # the consistency gate green. Dependabot cannot author that, so it should
      # not keep proposing half of it.
      - dependency-name: "dtolnay/rust-toolchain"
