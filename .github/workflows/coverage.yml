# Coverage is a REPORT, not a merge gate: the main-branch ruleset requires no
# status checks, and the Rust board in ci.yml already executes every test a
# PR can affect. Re-running the whole workspace instrumented on every pull
# request cost 77–87 minutes per PR (measured 2026-09-13) and was the entire
# critical path. So it runs where the report is read from — every push to
# main — and nightly, so a quiet main still gets a fresh number.
name: Coverage

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsm_node_test
        ports:
          - 5432:5432
        # Without a health check the job races the container's first accept().
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # The storage node's store is Postgres, and the SDK suites run their nodes
    # on it: every node-backed test needs this server.
    env:
      DSM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dsm_node_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dsm_client/frontend/package-lock.json

      - name: Install coverage deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ripgrep

      - name: Install frontend dependencies
        working-directory: dsm_client/frontend
        run: npm ci

      - name: Generate Rust coverage artifacts
        run: |
          mkdir -p coverage
          cargo llvm-cov clean --workspace
          # --test-threads=1: same shared-singleton parallel race as the Test step
          # (see its comment). Coverage was flaking a random dsm_sdk #[serial] test
          # per run; serial execution makes it deterministic.
          cargo llvm-cov --locked --workspace --exclude dsm_storage_node --no-report -- --nocapture --test-threads=1
          cargo llvm-cov --locked -p dsm_storage_node --no-report -- --nocapture --test-threads=1
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --lcov --output-path coverage/rust.lcov

      - name: Generate frontend coverage artifacts
        working-directory: dsm_client/frontend
        run: npm run test:coverage -- --passWithNoTests --ci

      - name: Build aggregate coverage summary
        run: |
          node scripts/aggregate_coverage.mjs

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/rust.lcov
          flags: rust
          name: rust-coverage
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: dsm_client/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload coverage summary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: |
            coverage/aggregate.json
            coverage/rust.lcov
            dsm_client/frontend/coverage/lcov.info

