# CodeQL security analysis — advanced setup, in-repo and reviewable.
#
# No untrusted GitHub event inputs are used: the only expressions are
# `matrix.language` / `matrix.build-mode`, both defined in this file.
#
# WHY THIS FILE EXISTS
#
# CodeQL *security* analysis has not run on this repository since 2026-03-26.
# A workflow named "CodeQL" has been green every day since, which is why the
# gap was invisible. The green run is a different product:
#
#   Initialize CodeQL:  analysis-kinds: code-quality
#                       disable-default-queries: true
#                       - uses: code-quality
#
# That is GitHub's *code quality* default setup. It runs the maintainability
# suite over javascript-typescript and python and uploads `*.quality.sarif`.
# It produces no security results, and `code-scanning/default-setup` reports
# `state: not-configured` — the security half was switched off and only the
# quality half kept running.
#
# What the last real security scan (2026-03-26) covered, and found:
#
#   /language:rust                   178 results  -> 100 alerts
#   /language:actions                  4 results
#   /language:javascript-typescript    4 results
#   /language:python                   0 results
#   /language:c-cpp                    0 results
#
# All 100 rust alerts were triaged by the owner on 2026-03-26 and 2026-03-29
# (50 "false positive", 50 "won't fix"). Dismissals are keyed by alert
# fingerprint and survive re-enablement, so restoring this workflow does not
# resurrect them — but it also means the current "0 open alerts" reflects that
# triage, not five months of clean scans.
#
# Everything merged since 2026-03-26 — the FORS address collision, the
# forged-signature verifier, the domain-separation cut, the Kyber binding
# enforcement, the BLE trust-root work — has never been seen by a security
# query. A settings toggle can be flipped with no diff and no notification;
# a committed workflow can only change through review. That is the fix.
name: CodeQL

on:
  push:
    # TEMPORARY PROBE — remove `ci/restore-codeql-security-analysis` before
    # merge. A pull_request run cannot prove this workflow restores coverage:
    # codeql-action v4 computes the PR diff ("Persisted 1 diff range(s) across
    # 1 file(s)") and passes --extension-packs=codeql-action/pr-diff-range to
    # run-queries, so a PR that changes only YAML reports 0 source alerts by
    # construction. March shows the same asymmetry on the same tooling:
    # /language:rust returned 178 on refs/heads/main and 1 on refs/pull/85/head.
    # workflow_dispatch cannot substitute — it only fires from the default
    # branch — so a push on this branch is the only pre-merge full-tree run.
    branches: [main, ci/restore-codeql-security-analysis]
  pull_request:
    branches: [main]
  # Lets a full-tree scan be forced without waiting for a push or the cron.
  workflow_dispatch:
  schedule:
    # Weekly, so a language that stops analyzing surfaces as a failing
    # scheduled run rather than as silence.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Rust and Kotlin are large here; give them room rather than letting a
    # timeout masquerade as a language that "doesn't work".
    timeout-minutes: 90
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      # One language failing must not hide the others' results.
      fail-fast: false
      matrix:
        include:
          # build-mode: none analyses read source directly. That matters here:
          # a full --all-features workspace build takes ~30 minutes, and
          # requiring one is how Rust coverage gets quietly dropped again the
          # next time the build is slow or breaks.
          #
          # KNOWN DEGRADED, tracked separately — do not read a clean rust job
          # as clean Rust coverage until this is closed. Measured on the
          # 2026-08-14 full-tree run: 15,081 "macro expansion failed" warnings
          # (assert_eq 3412, assert 2678, vec 2615, format 2300, log::* 1053),
          # leaving 439 of 552 files carrying at least one warning and 113
          # clean. Everything inside a macro invocation is absent from the AST,
          # and that is exactly where the March findings lived:
          #
          #   rust/hard-coded-cryptographic-value   71 -> 64  (mostly intact)
          #   rust/cleartext-logging               105 ->  0  (sink set gone)
          #   rust/cleartext-transmission            2 ->  0
          #
          # cleartext-logging's sinks — log::__private_api::log,
          # std::io::stdio::_print, core::panicking::panic_fmt — exist only
          # inside macro expansions, so losing expansion deletes the query
          # outright rather than shrinking it.
          #
          # `rustup component add rust-src` was TRIED AND MEASURED, and is not
          # the fix: with the component installed, the run was byte-identical
          # (15,081 failures, 439/113, same 64 results). The extractor still
          # reported `sysroot: None, sysroot_src: None, rustc_src: None,
          # proc_macro_server: None, extract_dependencies_as_source: false` —
          # those are unset options, not failed discovery. Next candidates are
          # the explicit CODEQL_EXTRACTOR_RUST_OPTION_* overrides and fetched
          # dependency sources, one variable at a time against the frozen
          # baseline of 64.
          #
          # Separately, 31 files under dsm_sdk/src/jni/ and platform/{android,
          # ios} got "semantic analyzer unavailable (not included as a module)"
          # because they are cfg-gated to non-host targets. The JNI boundary is
          # invisible to every security query until that is addressed.
          - language: rust
            build-mode: none
          # java-kotlin was never in the pre-2026-03-26 matrix, so the Android
          # client (85 Kotlin files) has never been analyzed at all.
          #
          # This one CANNOT use build-mode: none. Buildless Java extracts Java
          # source only — the extractor announces "Extracting Java with
          # build-mode=none." and GitHub documents that Kotlin is skipped in
          # that mode because "Kotlin analysis requires a build". This repo has
          # 0 .java files and 85 .kt, so buildless extracts nothing at all: the
          # first attempt died in `database finalize` with "CodeQL could not
          # process any code written in Java/Kotlin." (exit code 32).
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
          # c-cpp is deliberately NOT restored. It returned 0 results on
          # 2026-03-26 because there is no first-party C to extract: the repo
          # tracks 3 headers and no .c/.cpp. It also cannot run build-mode:
          # none. Add it back with a real build mode if firmware C lands here.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Mirrors the existing `android-unit-tests` job in ci.yml, which builds
      # this module green on ubuntu-latest with the same JDK.
      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle caches
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('dsm_client/android/**/*.gradle*', 'dsm_client/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # No `queries:` override — this is the same default suite that ran
          # before 2026-03-26. Restoring coverage and changing the query suite
          # in one step would make the resulting alert delta unattributable.

      # Must run AFTER init and BEFORE analyze: manual mode only captures what
      # the CodeQL tracer observes between those two steps.
      #
      # Compile tasks, not `assembleDebug`: app/build.gradle.kts hooks
      # refreshDsmJniLibs onto merge*JniLibFolders, and that task hard-fails
      # when the cargo-ndk .so artifacts are absent — which they always are
      # here, since this job builds no Rust. Compile tasks never touch jniLibs.
      # The three tasks together cover all 85 .kt files (main 58, test 20,
      # androidTest 7).
      #
      # --no-daemon is required for correctness, not just hygiene: a reused
      # Gradle daemon starts outside the CodeQL tracer, and compilations it
      # performs would go unobserved.
      #
      # androidTest is deliberately EXCLUDED. Those 7 instrumented-test files
      # do not compile today — :app:compileDebugAndroidTestKotlin fails with 14
      # "Unresolved reference" errors against protobuf accessors that no longer
      # exist (reserveAU128, reserveBU128, setReserveAU128, setTokenId) in
      # SoFiCrossDeviceOwnerTest.kt, SoFiTestHelpers.kt and SoFiTradeRealHwTest
      # .kt. Nothing in CI compiles them: ci.yml runs :app:testDebugUnitTest,
      # which covers main and test but never androidTest. That breakage is
      # pre-existing and tracked separately — it is not this workflow's to fix,
      # and blocking all Kotlin security coverage on it would be the wrong
      # trade. The two tasks below cover the 78 files that matter: all 58
      # production sources plus the 20 unit tests.
      - name: Compile Kotlin under the CodeQL tracer
        if: matrix.language == 'java-kotlin'
        working-directory: dsm_client/android
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:compileDebugKotlin \
            :app:compileDebugUnitTestKotlin

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          # Same category strings as the 2026-03-26 analyses, so alerts land in
          # the existing namespace and prior triage still applies.
          category: "/language:${{ matrix.language }}"
