name: Guide

# The developer guide (guide/): written pages, built with mdBook and published
# on GitHub Pages. Every command the pages show is checked against what the
# repo has (guide/check_commands.py): the Makefile's targets, the app's and
# the terminal wallet's commands, and the walkthrough tapes CI runs. So a
# change to any of those runs it too, and a pull request that would leave a
# page showing a command that no longer exists fails here. A push to main
# builds the guide and publishes it. Publishing needs the repository's Pages
# source set to "GitHub Actions" (Settings, Pages).

on:
  push:
    branches: [main]
    paths:
      - 'guide/**'
      - '.github/workflows/guide.yml'
      - 'Makefile'
      - 'clients/typescript/src/app-cli.ts'
      - 'clients/typescript/src/dev-wallet.ts'
      - 'tools/walkthrough/tapes/**'
  pull_request:
    paths:
      - 'guide/**'
      - '.github/workflows/guide.yml'
      - 'Makefile'
      - 'clients/typescript/src/app-cli.ts'
      - 'clients/typescript/src/dev-wallet.ts'
      - 'tools/walkthrough/tapes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide-${{ github.ref }}
  # A newer build of a pull request replaces the older one; a publish to
  # Pages is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_VERSION: v0.5.4
  # sha256 of mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz, as GitHub
  # publishes it for the rust-lang/mdBook release.
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    name: Build the guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every command the pages show is one the repo has
        run: python3 guide/check_commands.py

      - name: Install mdBook
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build
        run: mdbook build guide

      - name: Keep the site for publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: guide/book

  publish:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
