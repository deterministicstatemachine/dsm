name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------------
  # Rust: format, clippy, build, test
  # --------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships ~14 GB free, which the `--all-features` workspace
      # build plus the full test-binary set (with debug info) overflows
      # ("No space left on device", os error 28). Reclaim the preinstalled
      # toolchains this job never uses (~25 GB) before building. Plain shell,
      # no third-party action, to keep the CI supply chain minimal.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # Pinned: rustfmt/clippy output is version-specific. `@stable` drifts on
      # every release and then fails unchanged code on `cargo fmt --check`.
      # Bump this pin deliberately and reformat in the same PR.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install CI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ripgrep

      - name: Protocol purity checks
        run: |
          bash ci/no_clock_and_no_json.sh
          bash scripts/flow_assertions.sh
          bash scripts/flow_mapping_assertions.sh
          bash scripts/check_forbidden_symbols.sh
          bash scripts/ci_scan.sh
          bash ci/canonical_bilateral_gates.sh

      - name: Production safety lints
        run: bash ci/production_safety_checks.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dsm_client/frontend/package-lock.json

      - name: Install frontend lint dependencies
        working-directory: dsm_client/frontend
        run: npm ci

      - name: Lint
        run: make lint

      - name: Build
        run: cargo build --locked --workspace --all-features

      - name: Test
        run: |
          cargo test --locked --workspace --exclude dsm_storage_node -- --nocapture
          cargo test --locked -p dsm_storage_node --no-default-features --features local-dev,strict -- --nocapture

      - name: Codegen enforcement
        run: |
          bash scripts/codegen_enforce.sh
          bash scripts/guard_protos.sh

      - name: Security audit
        run: |
          cargo install cargo-audit --quiet || true
          cargo audit

  # --------------------------------------------------------------------------
  # Formal validation: TLA+ model checking + real-code bridge harness
  # --------------------------------------------------------------------------
  formal-validation:
    name: Formal Validation
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: Swatinem/rust-cache@v2

      - name: Install formal validation deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: TLA+ model checks
        run: cargo run --locked -p dsm_vertical_validation -- tla-check

      - name: Real-code bridge properties
        run: cargo run --locked -p dsm_vertical_validation -- property-tests --iterations 5 --seed 42

      - name: Direct implementation traces
        run: cargo run --locked -p dsm_vertical_validation -- implementation-traces

  # --------------------------------------------------------------------------
  # Frontend: type-check, lint, test, build
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsm_client/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dsm_client/frontend/package-lock.json

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            dsm_client/frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('dsm_client/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test -- --passWithNoTests --ci

      - name: Build
        run: npm run build

  # --------------------------------------------------------------------------
  # Android: Kotlin unit tests (pure JVM — no SDK / no emulator).
  # Today this guards the WebView external-host allowlist via
  # WebViewAllowlistTest, which freezes the allowlist set so any expansion
  # is visible in PR diff.
  #
  # SECURITY: run: commands below use only ${{ runner.os }} and
  # ${{ hashFiles(...) }} which are not derived from untrusted user input.
  # --------------------------------------------------------------------------
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsm_client/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # `gradle/wrapper-validation-action` was here but the GHA runner could
      # not reach the Gradle wrapper-checksum service (ETIMEDOUT to Cloudflare
      # 104.16.72.101:443 across 3 consecutive runs — appears to be a
      # network-policy constraint, not transient). The wrapper jar is
      # committed and visible in every PR diff, so reviewer attention is the
      # primary defence; this external action was belt-and-suspenders that
      # cost more in flake than it added in assurance.

      - name: Cache Gradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('dsm_client/android/**/*.gradle*', 'dsm_client/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

  # --------------------------------------------------------------------------
  # Coverage: Rust + frontend reports, Codecov upload, aggregate summary
  # --------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dsm_client/frontend/package-lock.json

      - name: Install coverage deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ripgrep

      - name: Install frontend dependencies
        working-directory: dsm_client/frontend
        run: npm ci

      - name: Generate Rust coverage artifacts
        run: |
          mkdir -p coverage
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --workspace --exclude dsm_storage_node --no-report -- --nocapture
          cargo llvm-cov --locked -p dsm_storage_node --no-default-features --features local-dev,strict --no-report -- --nocapture
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --lcov --output-path coverage/rust.lcov

      - name: Generate frontend coverage artifacts
        working-directory: dsm_client/frontend
        run: npm run test:coverage -- --passWithNoTests --ci

      - name: Build aggregate coverage summary
        run: |
          node scripts/aggregate_coverage.mjs

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/rust.lcov
          flags: rust
          name: rust-coverage
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: dsm_client/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload coverage summary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: |
            coverage/aggregate.json
            coverage/rust.lcov
            dsm_client/frontend/coverage/lcov.info

  # --------------------------------------------------------------------------
  # SPDX: every source file under the primary code paths must carry an
  # SPDX-License-Identifier header (Issue #23). The check itself is just
  # a bash script (`scripts/check-spdx.sh`) — fast, no toolchain needed.
  # No untrusted GitHub event inputs are used.
  # --------------------------------------------------------------------------
  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify SPDX headers
        run: ./scripts/check-spdx.sh

  # --------------------------------------------------------------------------
  # SBOM: full supply-chain inventory (Issue #26).
  #
  # Invokes the workspace SBOM generator (`scripts/generate-sbom.sh`),
  # which produces a consolidated CycloneDX 1.5 bundle covering:
  #   • Rust workspace (every crate, resolved via cargo-cyclonedx)
  #   • Frontend (resolved via package-lock.json)
  #   • Optional MCP server (resolved via its package-lock.json)
  #   • Root JS workspace manifest snapshot
  #   • Android Gradle dependencies (manifest snapshot)
  #
  # Run on every push to main + every PR so any dependency drift is
  # visible in PR diff via the uploaded artifact. The script also writes
  # a per-run metadata.json summarizing component counts + git state.
  #
  # `--skip-validation` is set: the `formal-validation` job already runs
  # `dsm_vertical_validation tla-check` end-to-end. Re-running it here
  # would double the validation cost. Tag-release SBOM (with validation
  # evidence + GitHub Release attachment) is handled separately by the
  # release workflow.
  #
  # No untrusted GitHub event inputs are used by any `run:` step below.
  # --------------------------------------------------------------------------
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Install SBOM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq protobuf-compiler
          cargo install cargo-cyclonedx --quiet --locked

      - name: Generate workspace SBOM bundle
        run: ./scripts/generate-sbom.sh --skip-validation

      - name: Show consolidated component count
        run: |
          jq '.summary' "sbom/latest/metadata.json"

      - name: Upload SBOM bundle
        uses: actions/upload-artifact@v7
        with:
          name: dsm-sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 90

  # --------------------------------------------------------------------------
  # Docker: storage node image
  # --------------------------------------------------------------------------
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Build storage node image
        run: docker build -f ci/docker/StorageNode.Dockerfile -t dsm/storage-node:ci .
