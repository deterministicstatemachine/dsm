# The test map: which repository files each dsm_sdk library test module
# executes. CI's `select` job reads the newest successful map from main to run,
# on a pull request, only the test modules that execute a file it changed
# (ci/sdk_tests.py has the rules; every doubt runs every test).
#
# Built by running the suite once, instrumented (-C instrument-coverage), one
# process per test module, each writing its own profile, then asking llvm-cov
# which files each profile executed. A module that fails leaves the map
# incomplete and this run red: the selector then keeps using the last complete
# map, and an incomplete one is never used to narrow anything.
#
# Not a merge gate and nothing waits on it. It runs on every push to main
# (a build in progress finishes; only the newest waiting push builds next, so
# merges faster than a build still yield maps), nightly, by hand, and on a pull
# request that changes how the map is built, so a change to the builder is
# proven before it lands.
name: Test map

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/test-map.yml
      - ci/sdk_tests.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  map:
    name: Build the test map
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsm_node_test
        ports:
          - 5432:5432
        # Without a health check the job races the container's first accept().
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DSM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dsm_node_test?sslmode=disable
      # The instrumented, unoptimized build needs more stack than the 2 MiB
      # default on the Connect path (measured; see coverage.yml).
      RUST_MIN_STACK: "8388608"
      CARGO_TARGET_DIR: target/map
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test-map

      - name: Install CI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler jq

      - name: Self-test
        run: python3 ci/test_sdk_tests.py

      - name: Build the instrumented library tests
        env:
          RUSTFLAGS: -C instrument-coverage
          # Build scripts and proc macros are instrumented too; their profiles
          # are not the tests' and go nowhere that is read.
          LLVM_PROFILE_FILE: ${{ runner.temp }}/build-%p-%m.profraw
        run: |
          set -o pipefail
          cargo test --locked -p dsm_sdk --lib --no-run --message-format=json > build.json
          bin="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "dsm_sdk"
                         and .profile.test == true and .executable != null) | .executable' build.json | tail -1)"
          test -x "$bin"
          echo "TEST_BIN=$bin" >> "$GITHUB_ENV"
          sysroot="$(rustc --print sysroot)"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "LLVM_BIN=$sysroot/lib/rustlib/$host/bin" >> "$GITHUB_ENV"
          cargo metadata --locked --format-version 1 > metadata.json

      - name: Run each test module in its own process
        run: |
          "$TEST_BIN" --list --format terse > list.txt
          python3 ci/sdk_tests.py groups --list list.txt --out-dir groups
          mkdir -p prof
          while IFS=$'\t' read -r i key; do
            mapfile -t names < "groups/$i.txt"
            echo "::group::$key (${#names[@]} tests)"
            # A module that fails, or whose names ran other than exactly once
            # each, leaves the map incomplete.
            if ! LLVM_PROFILE_FILE="$PWD/prof/$i-%p-%m.profraw" \
                 "$TEST_BIN" --exact --nocapture --test-threads=1 "${names[@]}" > "groups/$i.log" 2>&1 \
               || ! python3 ci/sdk_tests.py check --log "groups/$i.log" --expect "${#names[@]}"; then
              touch "groups/$i.failed"
              echo "::error::test module $key failed in the map run"
            fi
            cat "groups/$i.log"
            # One small profile per module instead of its raw ones: raw
            # profiles of the whole binary, kept for every module, would fill
            # the runner's disk.
            shopt -s nullglob
            raws=(prof/"$i"-*.profraw)
            shopt -u nullglob
            if [ "${#raws[@]}" -gt 0 ]; then
              "$LLVM_BIN/llvm-profdata" merge -sparse "${raws[@]}" -o "prof/$i.profdata"
              rm -f "${raws[@]}"
            fi
            echo "::endgroup::"
          done < groups/index.tsv

      - name: What each module executed
        run: |
          mkdir -p exports
          # A module with no profile gets no export, and `assemble` counts it
          # as failed: the map is then incomplete and never narrows anything.
          export_one() {
            i="$1"
            [ -f "prof/$i.profdata" ] || return 0
            "$LLVM_BIN/llvm-cov" export -summary-only -instr-profile "prof/$i.profdata" "$TEST_BIN" \
              -ignore-filename-regex='/(\.cargo|rustc)/' > "exports/$i.json"
          }
          export -f export_one
          cut -f1 groups/index.tsv | xargs -P "$(nproc)" -I{} bash -c 'export_one {}'

      - name: Assemble the map
        run: |
          python3 ci/sdk_tests.py assemble --groups-dir groups --exports-dir exports \
            --metadata metadata.json --root "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" --out test-map.json
          ls -l test-map.json

      - name: Keep the map
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-map
          path: test-map.json
          if-no-files-found: warn
          retention-days: 30
