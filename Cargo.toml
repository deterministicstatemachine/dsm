[workspace]
resolver = "2"
members = [
    "crates/dsm-anchor-core",
    "crates/dsm-anchor-verifier",
    "crates/dsm-sphincs",
    "dsm_client/deterministic_state_machine/dsm",
    "dsm_client/deterministic_state_machine/dsm_sdk",
    "dsm_storage_node",
    "tools/vector_runner",
    "tools/vector_builder",
    "tools/vertical_validation",
]
# RP2350 firmware is a thumbv8m-only binary; built separately from inside the
# crate dir (its .cargo/config.toml sets the target). Excluded so host
# `cargo build`/`test` over the workspace doesn't try to build it for the host.
# dsm-anchor-hw-verifier is the ONLY crate that depends on the sibling libtropic-rs
# checkout (tropic01); excluded so CI builds green without that sibling. Build it
# directly (cargo build -p dsm-anchor-hw-verifier) on a machine that has the sibling.
# dsm-android-anchor is the on-device glue that installs the hw-verifier anchor impls into the SDK
# bridge; it transitively pulls tropic01, so it too is excluded (built only in the Android cargo-ndk
# pipeline). The default workspace stays tropic01-free (verify: `cargo tree --workspace -i tropic01`).
exclude = [
    "crates/dsm-anchor-pico",
    "crates/dsm-anchor-hw-verifier",
    "crates/dsm-android-anchor",
    # Host used-chip bench harness (native serialport dep); built directly, not in CI.
    "crates/dsm-anchor-bench",
]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
# Keep only targeted denials; allow formatting/doc/style lints to warn, not fail
uninlined_format_args = "warn"
unused_async = "deny"

# Production safety: warn on unwrap/expect/panic in non-test code
# These can cause runtime panics and should be avoided in production paths
# Build scripts, tests, and examples can override with #[allow(clippy::unwrap_used)]
# Start with "warn" to identify issues without blocking builds
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Also warn on unwrap in result contexts
unwrap_in_result = "warn"

# Allow all other warnings with lower priority
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
# Explicitly allow documentation warnings
missing_errors_doc = "allow"
doc_markdown = "allow"

## Root is a pure workspace manifest; no [package] here to avoid cargo metadata errors.
